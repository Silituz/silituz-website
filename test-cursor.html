<!-- Experimenteller Cursor -->
<style>
/* Basis */
body {
  cursor: none; /* Standard-Cursor ausblenden */
  overflow-x: hidden;
}

/* Kreis-Cursor */
.custom-cursor {
  position: fixed;
  top: 0;
  left: 0;
  width: 24px;
  height: 24px;
  border: 2px solid #10b981;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  transition: transform 0.12s ease-out, width 0.25s, height 0.25s, background 0.25s;
  z-index: 9999;
  mix-blend-mode: difference;
}

/* Hover-Effekt auf Buttons */
.cursor-hover {
  width: 60px;
  height: 60px;
  background: rgba(16, 185, 129, 0.3);
  border-color: rgba(16, 185, 129, 0.6);
}
</style>

<script>
  // Custom Cursor Script
  const cursor = document.createElement("div");
  cursor.classList.add("custom-cursor");
  document.body.appendChild(cursor);

  document.addEventListener("mousemove", (e) => {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
  });

  // Hover-Effekt bei Buttons
  document.querySelectorAll(".cursor-btn").forEach(btn => {
    btn.addEventListener("mouseenter", () => cursor.classList.add("cursor-hover"));
    btn.addEventListener("mouseleave", () => cursor.classList.remove("cursor-hover"));
  });
</script>
