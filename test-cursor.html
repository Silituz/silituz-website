<section class="relative w-full h-screen flex flex-col items-center justify-center bg-gray-900 overflow-hidden select-none">
  <img src="/assets/images/welcome-head.svg" alt="" class="absolute inset-0 w-full h-full object-cover opacity-25" />
  <div class="relative z-10 text-center px-6 space-y-6">
    <h1 class="text-4xl font-extrabold text-emerald-500">Silituz Snake Cursor – Wiggle Hover</h1>
    <p class="text-slate-300">Arrow → <strong>Pointer-Snake (größer + schlängelt)</strong> • Pill (Scroll) • I-Beam (Text) • Pulse (Klick)</p>

    <div class="flex gap-6 justify-center">
      <a href="/gallery/" class="cursor-target px-6 py-3 rounded-xl bg-emerald-500/90 hover:bg-emerald-600 text-white font-semibold shadow transition">Zu Galerie</a>
      <button class="cursor-target px-6 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-semibold shadow transition">Button testen</button>
    </div>

    <div class="max-w-md mx-auto grid grid-cols-1 gap-3 pt-6">
      <input type="text" placeholder="Feld für I-Beam testen" class="px-4 py-3 rounded-xl bg-slate-800/70 text-slate-100 placeholder-slate-400 outline-none ring-0" />
      <textarea rows="3" placeholder="Noch ein Textfeld…" class="px-4 py-3 rounded-xl bg-slate-800/70 text-slate-100 placeholder-slate-400 outline-none ring-0"></textarea>
    </div>

    <label class="inline-flex items-center gap-2 text-slate-300/90 pt-6">
      <input id="toggle-cursor" type="checkbox" class="h-4 w-4" checked>
      Custom Cursor aktiv
    </label>
  </div>
</section>

<style>
:root{
  --emerald:#10b981;
  --g1:rgba(16,185,129,.95);
  --g2:rgba(16,185,129,.55);
  --g3:rgba(16,185,129,.25);
}
html,body{height:100%}

/* Systemcursor überall aus */
body.custom-cursor-enabled,
body.custom-cursor-enabled *{ cursor:none !important; }
body.custom-cursor-enabled{ overflow-x:hidden }

/* Cursor Container */
#snake-cursor{
  position:fixed; top:0; left:0; width:48px; height:48px;
  pointer-events:none; z-index:9999; opacity:1; transition:opacity .25s ease;
  filter:
    drop-shadow(0 0 6px var(--g1))
    drop-shadow(0 0 18px var(--g2))
    drop-shadow(0 0 40px var(--g3));
  mix-blend-mode:screen;
}
/* Grundstile */
#snake-cursor .stroke{stroke:var(--emerald); stroke-width:2.3; stroke-linecap:round; stroke-linejoin:round; fill:none}
#snake-cursor .fill{fill:var(--emerald)}

/* Variantenumschalter */
#snake-cursor [data-variant]{display:none}
#snake-cursor[data-state="arrow"]         [data-variant="arrow"]{display:block}
#snake-cursor[data-state="pointer"]       [data-variant="pointer"]{display:block}
#snake-cursor[data-state="pointer-hover"] [data-variant="pointer-hover"]{display:block}
#snake-cursor[data-state="pill"]          [data-variant="pill"]{display:block}
#snake-cursor[data-state="ibeam"]         [data-variant="ibeam"]{display:block}

/* Hover-Glow etwas stärker, aber ohne Zusatz-UI */
#snake-cursor.is-hovering{
  filter:
    drop-shadow(0 0 8px var(--g1))
    drop-shadow(0 0 22px var(--g2))
    drop-shadow(0 0 60px var(--g3));
}

/* Click Pulse */
#snake-cursor.click-pulse::after{
  content:""; position:absolute; inset:0; border-radius:50%;
  box-shadow:0 0 0 0 rgba(16,185,129,.55);
  animation:pulse .38s ease-out;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(16,185,129,.55); opacity:1}
  100%{box-shadow:0 0 0 18px rgba(16,185,129,0); opacity:0}
}

/* Pill – Ball (senkrecht) */
.pill-ball{ transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.pill-ball.down{ transform: translateY(10px); }
.pill-ball.up{   transform: translateY(-10px); }

/* HOVER WIGGLE (kein Ring, nur dezente Bewegung) */
@keyframes wiggle {
  0%,100% { transform: rotate(0deg) }
  25%     { transform: rotate(1.8deg) }
  75%     { transform: rotate(-1.8deg) }
}
@keyframes tail-wave {
  0%,100% { stroke-dashoffset: 0 }
  50%     { stroke-dashoffset: 10 }
}

/* Touch: nativer Cursor */
@media (hover:none) and (pointer:coarse){
  #snake-cursor{display:none}
  body.custom-cursor-enabled, body.custom-cursor-enabled *{ cursor:auto !important; }
}
</style>

<!-- SVG mit 5 Varianten (Pointer-Hover ohne Ring, mit Wiggle + Tail-Wave) -->
<svg id="snake-cursor" viewBox="0 0 48 48" aria-hidden="true" data-state="arrow">
  <!-- ARROW (Standard) -->
  <g data-variant="arrow">
    <path class="stroke" d="M10,34 C16,26 22,28 26.5,21.5 C29,17.8 25.5,14 22.5,11" />
    <path class="fill" d="M22.4,9.7 l4.4,2.4 l-4.4,2.4 q1.45-2.35 0-4.8z" />
    <path class="stroke" d="M26.9,12 h2.7" />
  </g>

  <!-- POINTER (Zeigefinger-Schlange – Basis) -->
  <g data-variant="pointer">
    <path class="stroke" d="M13,31 C17.5,27 21,27.6 23.8,25.8" />
    <path class="stroke tail" d="M14.4,30 C18,27.8 21.5,27.8 23.6,26.5" opacity=".55"/>
    <path class="stroke" d="M24,16 v10" />
    <circle class="fill" cx="24" cy="14.2" r="2.05"/>
    <path class="stroke" d="M26.2,14.2 h1.8" />
  </g>

  <!-- POINTER-HOVER (größer + Schlängel-Wiggle + Zunge sichtbar) -->
  <g data-variant="pointer-hover" transform-origin="24px 14px">
    <!-- Handkurve leicht ausgeprägter -->
    <path class="stroke" d="M12.4,31.6 C18.2,26.2 21.9,26.9 24.8,25.0" />
    <!-- animierte Tail-Wave (nur Strich) -->
    <path class="stroke tail" d="M13.6,30.4 C18.4,27.6 21.9,27.6 24.2,26.1" opacity=".6"
          style="stroke-dasharray:40 14; stroke-dashoffset:0;" />
    <!-- längerer Finger -->
    <path class="stroke" d="M24,15 v11.8" />
    <!-- spitzerer Kopf -->
    <circle class="fill" cx="24" cy="13.5" r="1.85"/>
    <!-- kleine sichtbare Zunge -->
    <path class="stroke" d="M26.1,13.5 h2.0 M27.1,13.0 v1.0" />
  </g>

  <!-- PILL (senkrecht, Scroll) -->
  <g data-variant="pill">
    <rect class="stroke" x="20.5" y="11" width="7" height="26" rx="3.5" ry="3.5"/>
    <rect class="fill"   x="20.5" y="11" width="7" height="26" rx="3.5" ry="3.5" opacity=".2"/>
    <g class="pill-ball" transform="translate(0,0)">
      <circle class="fill" cx="24" cy="24" r="3.2"/>
      <circle cx="25" cy="23" r="0.7" fill="#fff" opacity=".95"/>
    </g>
  </g>

  <!-- I-BEAM -->
  <g data-variant="ibeam">
    <path class="stroke" d="M24,12 v24" />
    <path class="stroke" d="M19,16 h10" />
    <path class="stroke" d="M19,32 h10" />
  </g>
</svg>
<script>
(()=>{
  const cursor = document.getElementById('snake-cursor');
  const toggle = document.getElementById('toggle-cursor');

  const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isTouch = matchMedia('(hover: none) and (pointer: coarse)').matches;

  // 🔧 Tuning
  const BASE_SIZE   = 48;                 // Größe des SVG-Containers
  const EASE        = prefersReduced ? 1 : 0.28;  // höher = direkter (vorher ~0.18)
  const SNAP_DIST   = 80;                 // bei großem Abstand "snappen"
  const ROTATE_GAIN = 0.06;               // etwas weniger Rotations-Trägheit

  let enabled = true;
  let mouseX = innerWidth/2, mouseY = innerHeight/2;
  let x = mouseX, y = mouseY;

  const STATE = {
    ARROW:'arrow',
    POINTER:'pointer',
    POINTER_HOVER:'pointer-hover',
    PILL:'pill',
    IBEAM:'ibeam'
  };
  let state = STATE.ARROW;
  let hoverInTimer = null, hoverOutTimer = null, pillTimer = null;
  let isHoveringInteractive = false;

  function setState(next){
    if(state === next) return;
    state = next;
    cursor.setAttribute('data-state', next);

    // Wiggle nur im pointer-hover aktiv
    const ph = cursor.querySelector('[data-variant="pointer-hover"]');
    const tail = ph?.querySelector('.tail');
    if(ph){
      if(next === STATE.POINTER_HOVER){
        ph.style.animation = 'wiggle .5s ease-in-out infinite';
        if(tail){ tail.style.animation = 'tail-wave .9s ease-in-out infinite'; }
      } else {
        ph.style.animation = 'none';
        if(tail){ tail.style.animation = 'none'; }
      }
    }
  }

  function setEnabled(on){
    enabled = on;
    document.body.classList.toggle('custom-cursor-enabled', on);
    cursor.style.opacity = on ? '1' : '0';
  }

  addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

  // Interaktive Ziele → zweistufig: POINTER → POINTER_HOVER
  const selectorTargets = 'a, button, [role="button"], .cursor-target, .welcome-btn';
  function bindHover(){
    document.querySelectorAll(selectorTargets).forEach(el=>{
      el.addEventListener('mouseenter', ()=>{
        isHoveringInteractive = true;
        cursor.classList.add('is-hovering');
        clearTimeout(hoverOutTimer);
        setState(STATE.POINTER);
        clearTimeout(hoverInTimer);
        hoverInTimer = setTimeout(()=> setState(STATE.POINTER_HOVER), 60); // schneller rein
      });
      el.addEventListener('mouseleave', ()=>{
        isHoveringInteractive = false;
        cursor.classList.remove('is-hovering');
        clearTimeout(hoverInTimer);
        clearTimeout(hoverOutTimer);
        hoverOutTimer = setTimeout(()=> setState(STATE.ARROW), 60); // schneller raus
      });
    });
  }
  bindHover();

  // Textfelder → I-BEAM
  const textSelector = 'input[type="text"], input[type="search"], textarea, [contenteditable=""], [contenteditable="true"]';
  function bindText(){
    document.querySelectorAll(textSelector).forEach(el=>{
      el.addEventListener('mouseenter', ()=> { clearTimeout(hoverInTimer); clearTimeout(hoverOutTimer); setState(STATE.IBEAM); });
      el.addEventListener('mouseleave', ()=> setState(STATE.ARROW));
      el.addEventListener('focus',     ()=> { clearTimeout(hoverInTimer); clearTimeout(hoverOutTimer); setState(STATE.IBEAM); });
      el.addEventListener('blur',      ()=> setState(STATE.ARROW));
    });
  }
  bindText();

  // Scroll → PILL (Ball rutscht je Richtung)
  const pillBall = () => cursor.querySelector('.pill-ball');
  function triggerPill(deltaY){
    if(isHoveringInteractive) return; // Hover-Klicks nicht stören
    setState(STATE.PILL);
    const ball = pillBall();
    if(ball){
      ball.classList.remove('up','down');
      void ball.offsetWidth; // reflow retrigger
      ball.classList.add(deltaY > 0 ? 'down' : 'up');
    }
    clearTimeout(pillTimer);
    pillTimer = setTimeout(()=>{
      if(ball) ball.classList.remove('up','down');
      setState(STATE.ARROW);
    }, 650);
  }
  addEventListener('wheel', (e)=> triggerPill(e.deltaY), {passive:true});
  addEventListener('scroll', ()=> triggerPill(1), {passive:true});

  // Click Pulse
  addEventListener('mousedown', ()=>{
    cursor.classList.remove('click-pulse'); void cursor.offsetWidth; cursor.classList.add('click-pulse');
  });

  // Render Loop — reaktiver + Snap
  function raf(){
    if(enabled){
      const dx = mouseX - x, dy = mouseY - y;
      const dist = Math.hypot(dx, dy);

      // großer Sprung → sofort zur Maus (fühlt sich präziser an)
      if(dist > SNAP_DIST){
        x = mouseX; y = mouseY;
      } else {
        x += dx * EASE;
        y += dy * EASE;
      }

      // dezente Ausrichtung in Bewegungsrichtung
      const angle = Math.atan2(mouseY - y, mouseX - x) * (180/Math.PI) * ROTATE_GAIN;

      // 🔎 Größer auf Hover: deutlicher als zuvor
      const scale =
        state === STATE.POINTER_HOVER ? 1.22 :   // vorher ~1.14
        state === STATE.POINTER       ? 1.08 :
        state === STATE.PILL          ? 1.08 :
        1;

      cursor.style.transform = `translate(${x - BASE_SIZE/2}px, ${y - BASE_SIZE/2}px) rotate(${angle}deg) scale(${scale}) translateZ(0)`;
    }
    requestAnimationFrame(raf);
  }
  requestAnimationFrame(raf);

  // Toggle
  document.getElementById('toggle-cursor').addEventListener('change', e=> setEnabled(e.target.checked));

  // Start
  setEnabled(!isTouch);
})();
</script>
