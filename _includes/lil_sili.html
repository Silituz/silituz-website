<div class="site-lil-sili" data-lil-sili data-lil-sili-lang="{{ page.lang | default: 'de' }}">
  <button
    type="button"
    class="site-lil-sili__summary"
    data-lil-sili-trigger
    aria-controls="site-lil-sili-panel"
    aria-label="Lil Sili öffnen"
  >
    <span class="site-lil-sili__hint" data-lil-sili-copy="badge">BEREIT ZU HELFEN</span>
    <span class="site-lil-sili__trigger">
      <img src="/assets/images/lil-sili-cute-v2.svg?v=2" alt="" width="104" height="104" />
      <span data-lil-sili-trigger-badge aria-hidden="true">?</span>
    </span>
  </button>

  <section
    class="site-lil-sili__panel"
    id="site-lil-sili-panel"
    role="dialog"
    aria-modal="false"
    aria-labelledby="site-lil-sili-title"
    hidden
  >
    <header class="site-lil-sili__head">
      <div>
        <span data-lil-sili-copy="panelBadge">SILITUZ GUIDE</span>
        <h2 id="site-lil-sili-title" data-lil-sili-copy="title">Hey, ich bin Lil Sili!</h2>
      </div>
      <button
        class="site-lil-sili__close"
        type="button"
        data-lil-sili-close
        aria-label="Lil Sili schließen"
      >×</button>
    </header>

    <p class="site-lil-sili__intro" data-lil-sili-copy="intro">
      Was möchtest du entdecken? Ich bringe dich direkt dorthin.
    </p>

    <div class="site-lil-sili__language-choice" data-lil-sili-language-choice role="group" aria-label="Choose your language">
      <button type="button" data-lil-sili-language="de"><span aria-hidden="true">DE</span> Deutsch</button>
      <button type="button" data-lil-sili-language="en"><span aria-hidden="true">EN</span> English</button>
      <button type="button" data-lil-sili-language="es"><span aria-hidden="true">ES</span> Español</button>
    </div>

    <form class="site-lil-sili__form" data-lil-sili-form>
      <label class="sr-only" for="site-lil-sili-search" data-lil-sili-copy="searchLabel">
        Frage oder Suchbegriff
      </label>
      <input
        id="site-lil-sili-search"
        name="lil-sili-search"
        type="search"
        autocomplete="off"
        data-lil-sili-search
        placeholder="z. B. News, Bilder, Musik, Hilfe …"
      />
      <button type="submit">
        <span data-lil-sili-copy="search">Los</span>
        <span aria-hidden="true">→</span>
      </button>
    </form>

    <p class="site-lil-sili__message" data-lil-sili-message aria-live="polite"></p>

    <nav class="site-lil-sili__actions" aria-label="Lil Sili Schnellzugriffe">
      <a href="https://anime-pulse-news.silituz.chatgpt.site" data-lil-sili-route="news">
        <i class="fa-solid fa-newspaper" aria-hidden="true"></i><span data-lil-sili-label="news">SILITUZ NEWS</span><b aria-hidden="true">›</b>
      </a>
      <a href="/gallery/" data-lil-sili-route="gallery">
        <i class="fa-regular fa-images" aria-hidden="true"></i><span data-lil-sili-label="gallery">Bilder & Videos</span><b aria-hidden="true">›</b>
      </a>
      <a href="/generators/" data-lil-sili-route="generators">
        <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><span data-lil-sili-label="generators">Generatoren & mehr</span><b aria-hidden="true">›</b>
      </a>
      <a href="/music/" data-lil-sili-route="music">
        <i class="fa-solid fa-music" aria-hidden="true"></i><span data-lil-sili-label="music">Musik</span><b aria-hidden="true">›</b>
      </a>
      <a href="/support/" class="site-lil-sili__support" data-lil-sili-route="support">
        <i class="fa-solid fa-heart" aria-hidden="true"></i><span data-lil-sili-label="support">Silituz unterstützen</span><b aria-hidden="true">›</b>
      </a>
      <a href="/socials/" data-lil-sili-route="socials">
        <i class="fa-solid fa-share-nodes" aria-hidden="true"></i><span data-lil-sili-label="socials">Socials</span><b aria-hidden="true">›</b>
      </a>
    </nav>
  </section>
</div>
