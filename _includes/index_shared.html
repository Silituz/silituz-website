<!-- Hero-Bereich -->
<section class="relative w-full">
  <div class="relative w-full h-96">
    <img
      src="/assets/images/welcome-head.svg"
      alt="{{ page.hero_alt }}"
      class="absolute inset-0 w-full h-full object-cover"
    />

    <!-- Text-Overlay links -->
    <div class="absolute inset-y-0 left-[8%] flex items-center">
      <div class="px-6 sm:px-10 md:px-14 lg:px-16">
        <div class="max-w-xl bg-white/70 dark:bg-gray-900/60 backdrop-blur-sm rounded-2xl p-4 sm:p-6 shadow-md">
          <h1 class="text-3xl text-emerald-500 md:text-4xl font-extrabold leading-tight">
            {{ page.hero_title }}
          </h1>
          <p class="mt-2 text-base md:text-lg opacity-90">
            {{ page.hero_sub }}
          </p>

          <!-- Buttons -->
          <div class="mt-4 flex flex-wrap gap-3">
            <!-- Über mich / About -->
            <a href="{{ page.about_link }}"
               class="group relative inline-flex items-center gap-2 rounded-xl px-4 py-2 font-semibold 
                      border border-white/40 dark:border-white/10 
                      bg-white/40 dark:bg-gray-800/40 
                      backdrop-blur-md 
                      text-gray-900 dark:text-gray-100 
                      overflow-hidden transition-colors group-hover:text-white">
              <span class="absolute inset-y-0 left-0 h-full w-0 bg-emerald-500/90 transition-all duration-[1200ms] ease-out group-hover:w-full"></span>
              <span class="relative z-10 inline-flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.418 0-8 2.239-8 5v1h16v-1c0-2.761-3.582-5-8-5Z"/></svg>
                {{ page.about_btn }}
              </span>
            </a>

            <!-- Socials -->
            <a href="/socials/"
               class="group relative inline-flex items-center gap-2 rounded-xl px-4 py-2 font-semibold 
                      border border-white/40 dark:border-white/10 
                      bg-white/40 dark:bg-gray-800/40 
                      backdrop-blur-md 
                      text-gray-900 dark:text-gray-100 
                      overflow-hidden transition-colors group-hover:text-white">
              <span class="absolute inset-y-0 left-0 h-full w-0 bg-emerald-500/90 transition-all duration-[1200ms] ease-out group-hover:w-full"></span>
              <span class="relative z-10 inline-flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8a3 3 0 1 0-2.816-4H15a3 3 0 0 0 0 6 2.98 2.98 0 0 0 1.335-.323l-6.07 3.41A3 3 0 1 0 10 16c0-.17-.017-.336-.048-.497l6.074-3.414A3 3 0 0 0 18 14a3 3 0 1 0-2.816-4H15a2.98 2.98 0 0 0 1.335-.323Z"/></svg>
                {{ page.socials_btn }}
              </span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Kachel-Bereich -->
<section class="container mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Kachel 1 -->
    <a href="/gallery.html" class="group relative block overflow-hidden rounded-2xl shadow-md bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 transition hover:shadow-lg">
      <span class="absolute inset-y-0 left-0 w-0 bg-emerald-500 transition-all duration-[1200ms] ease-out group-hover:w-full"></span>
      <div class="relative z-10">
        <div class="aspect-square w-full overflow-hidden">
          <img src="/assets/images/Kachel 1.svg" alt="{{ page.tile1_alt }}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-[1.02]" />
        </div>
        <div class="p-5 transition-colors group-hover:text-white">
          <h3 class="text-lg font-semibold">{{ page.tile1_title }}</h3>
          <p class="mt-2 text-sm text-gray-600 dark:text-gray-300 group-hover:text-white/95">{{ page.tile1_text }}</p>
        </div>
      </div>
    </a>

    <!-- Kachel 2 -->
    <a href="/generators.html#edits" class="group relative block overflow-hidden rounded-2xl shadow-md bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 transition hover:shadow-lg">
      <span class="absolute inset-y-0 left-0 w-0 bg-emerald-500 transition-all duration-[1200ms] ease-out group-hover:w-full"></span>
      <div class="relative z-10">
        <div class="aspect-square w-full overflow-hidden">
          <img src="/assets/images/Kachel 2.svg" alt="{{ page.tile2_alt }}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-[1.02]" />
        </div>
        <div class="p-5 transition-colors group-hover:text-white">
          <h3 class="text-lg font-semibold">{{ page.tile2_title }}</h3>
          <p class="mt-2 text-sm text-gray-600 dark:text-gray-300 group-hover:text-white/95">{{ page.tile2_text }}</p>
        </div>
      </div>
    </a>

    <!-- Kachel 3 -->
    <a href="/music.html" class="group relative block overflow-hidden rounded-2xl shadow-md bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 transition hover:shadow-lg">
      <span class="absolute inset-y-0 left-0 w-0 bg-emerald-500 transition-all duration-[1200ms] ease-out group-hover:w-full"></span>
      <div class="relative z-10">
        <div class="aspect-square w-full overflow-hidden">
          <img src="/assets/images/Kachel 3.svg" alt="{{ page.tile3_alt }}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-[1.02]" />
        </div>
        <div class="p-5 transition-colors group-hover:text-white">
          <h3 class="text-lg font-semibold">{{ page.tile3_title }}</h3>
          <p class="mt-2 text-sm text-gray-600 dark:text-gray-300 group-hover:text-white/95">{{ page.tile3_text }}</p>
        </div>
      </div>
    </a>

  </div>
</section>
