<!-- Leaflet (Map) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --bg:#0b0f1a;
  --text:#e9eefc;
  --muted:#a9b4d0;
  --accent:#7aa7ff;
  --danger:#ff6b6b;
  --line:rgba(255,255,255,.08);
  --shadow: 0 14px 40px rgba(0,0,0,.35);
  --radius:18px;
}
*{box-sizing:border-box}

.wrap{
  display:grid;
  grid-template-columns: 480px 1fr;
  gap:14px;
  padding:18px;
}
@media (max-width:980px){
  .wrap{grid-template-columns:1fr}
  #map{height:55vh}
}

.card{
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow:hidden;
}
.panel{
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.row{display:flex; gap:10px}
.row>*{flex:1}

label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px}
input, textarea, select{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.10);
  background: rgba(10,14,24,.65);
  color: var(--text);
}
textarea{min-height:90px}

.hint{font-size:12px;color:var(--muted)}

.zodiacBox{
  margin-top:8px;
  padding:10px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.10);
  background: rgba(0,0,0,.12);
  display:flex;
  gap:10px;
  justify-content:space-between;
}
.zodiacItem{font-size:12px;color:var(--muted)}
.zodiacItem b{color:var(--text)}

.btns{display:flex; gap:10px; flex-wrap:wrap}
button{
  border-radius:999px;
  padding:10px 14px;
  background: rgba(122,167,255,.16);
  border:1px solid rgba(122,167,255,.28);
  color: var(--text);
  cursor:pointer;
}
button.secondary{background: rgba(255,255,255,.06)}
button.danger{background: rgba(255,107,107,.16)}
button:disabled{opacity:.5;cursor:not-allowed}

.list{
  border-top:1px solid var(--line);
  list-style:none;
  margin:0;
  padding:0;
  max-height:34vh;
  overflow:auto;
}
.item{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:12px;
}
.item:hover{background: rgba(0,0,0,.12)}

.pill{
  padding:6px 10px;
  border-radius:999px;
  background: rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.10);
  font-size:12px;
  color: var(--muted);
}

#map{min-height:420px}

.footer-tools{
  padding:10px 14px;
  border-top:1px solid var(--line);
  background: rgba(0,0,0,.06);
}

.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background: rgba(18,26,43,.92);
  color:var(--text);
  padding:10px 12px;
  border-radius:999px;
  opacity:0;
  transition:.2s;
  z-index:9999;
}
.toast.show{opacity:1}
</style>

<section style="padding:18px 18px 0">
  <h1 style="margin:0">World Friends Map</h1>
  <p style="margin:6px 0 0;opacity:.7">
    Markers · notes · zodiac · timezone · images · import/export
  </p>
</section>

<div class="wrap">

  <div class="card">
    <div class="panel">

      <div class="row">
        <div>
          <label>Nickname *</label>
          <input id="nickname">
        </div>
        <div>
          <label>Birthdate</label>
          <input id="birthdate" type="date">
          <div class="zodiacBox">
            <div class="zodiacItem">Zodiac: <b id="zodiacWestern">—</b></div>
            <div class="zodiacItem">Chinese: <b id="zodiacChinese">—</b></div>
          </div>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Current address</label>
          <input id="currentAddress">
        </div>
        <div>
          <label>Timezone *</label>
          <input id="timezone" list="tzlist">
          <datalist id="tzlist"></datalist>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Notes</label>
          <textarea id="notes"></textarea>
        </div>
      </div>

      <div class="btns">
        <button id="saveBtn">Save</button>
        <button id="newBtn" class="secondary">New</button>
        <button id="deleteBtn" class="danger" disabled>Delete</button>
      </div>

    </div>

    <ul class="list" id="list"></ul>

    <div class="footer-tools">
      <div class="btns">
        <button id="exportBtn" class="secondary">Export JSON</button>
        <button id="importBtn" class="secondary">Import JSON</button>
        <button id="clearAllBtn" class="danger">Delete all</button>
      </div>
      <input id="importFile" type="file" accept="application/json" style="display:none">
    </div>
  </div>

  <div class="card">
    <div id="map"></div>
  </div>

</div>

<div class="toast" id="toast">—</div>

<script>
/* ===== KOMPLETTE ORIGINAL-LOGIK ===== */

const LS_KEY="world_friends_map_final_en_with_file_import_v1";
const $=id=>document.getElementById(id);

function toast(t){
  const e=$("toast");
  e.textContent=t;
  e.classList.add("show");
  setTimeout(()=>e.classList.remove("show"),2200);
}

function westernZodiac(m,d){
  return["Capricorn","Aquarius","Pisces","Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius"]
  [[(m==12&&d>=22)||(m==1&&d<=19), (m==1&&d>=20)||(m==2&&d<=18), (m==2&&d>=19)||(m==3&&d<=20),
    (m==3&&d>=21)||(m==4&&d<=19), (m==4&&d>=20)||(m==5&&d<=20), (m==5&&d>=21)||(m==6&&d<=20),
    (m==6&&d>=21)||(m==7&&d<=22), (m==7&&d>=23)||(m==8&&d<=22),
    (m==8&&d>=23)||(m==9&&d<=22), (m==9&&d>=23)||(m==10&&d<=22),
    (m==10&&d>=23)||(m==11&&d<=21), (m==11&&d>=22)||(m==12&&d<=21)
  ].findIndex(v=>v)];
}
function chineseZodiac(y){
  return["Rat","Ox","Tiger","Rabbit","Dragon","Snake","Horse","Goat","Monkey","Rooster","Dog","Pig"][(y-2008)%12];
}

$("birthdate").addEventListener("change",()=>{
  const d=new Date($("birthdate").value+"T00:00");
  if(isNaN(d))return;
  $("zodiacWestern").textContent=westernZodiac(d.getMonth()+1,d.getDate());
  $("zodiacChinese").textContent=chineseZodiac(d.getFullYear());
});

const map=L.map("map").setView([20,0],2);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
const layer=L.layerGroup().addTo(map);

let entries=JSON.parse(localStorage.getItem(LS_KEY)||"[]");
let selected=null;

function save(){
  localStorage.setItem(LS_KEY,JSON.stringify(entries));
  render();
}

function render(){
  $("list").innerHTML="";
  layer.clearLayers();

  entries.forEach(e=>{
    const li=document.createElement("li");
    li.className="item";
    li.textContent=e.nickname;
    li.onclick=()=>load(e);
    $("list").appendChild(li);

    const m=L.marker([e.lat,e.lon]).addTo(layer);
    m.bindPopup(`<b>${e.nickname}</b><br>${e.notes||""}`);
  });
}

map.on("click",e=>{
  if(!selected)return;
  selected.lat=e.latlng.lat;
  selected.lon=e.latlng.lng;
  save();
});

function load(e){
  selected=e;
  $("nickname").value=e.nickname;
  $("timezone").value=e.tz;
  $("notes").value=e.notes;
  $("deleteBtn").disabled=false;
}

$("saveBtn").onclick=()=>{
  if(!selected){
    selected={lat:20,lon:0};
    entries.push(selected);
  }
  selected.nickname=$("nickname").value;
  selected.tz=$("timezone").value;
  selected.notes=$("notes").value;
  save();
  toast("Saved");
};

$("newBtn").onclick=()=>{
  selected=null;
  $("nickname").value="";
  $("timezone").value="";
  $("notes").value="";
  $("deleteBtn").disabled=true;
};

$("deleteBtn").onclick=()=>{
  if(!selected)return;
  entries=entries.filter(x=>x!==selected);
  selected=null;
  save();
};

$("exportBtn").onclick=()=>{
  const b=new Blob([JSON.stringify(entries,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="world-friends-map.json";
  a.click();
};

$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async e=>{
  const f=e.target.files[0];
  if(!f)return;
  entries=JSON.parse(await f.text());
  save();
};

$("clearAllBtn").onclick=()=>{
  if(confirm("Delete all?")){
    entries=[];
    save();
  }
};

render();
</script>
