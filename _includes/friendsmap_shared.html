<!-- Leaflet (Map) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root{
    --bg:#0b0f1a;
    --text:#e9eefc;
    --muted:#a9b4d0;
    --accent:#7aa7ff;
    --danger:#ff6b6b;
    --line:rgba(255,255,255,.08);
    --shadow: 0 14px 40px rgba(0,0,0,.35);
    --radius:18px;
  }
  *{box-sizing:border-box}

  .wrap{
    display:grid;
    grid-template-columns: 480px 1fr;
    gap:14px;
    padding:18px;
  }
  @media (max-width: 980px){
    .wrap{grid-template-columns:1fr}
    #map{height:55vh}
  }

  .card{
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow:hidden;
  }
  .panel{
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .row{display:flex; gap:10px}
  .row > *{flex:1}

  label{display:block; font-size:12px; color:var(--muted); margin:0 0 6px;}
  input, textarea, select{
    width:100%;
    padding:10px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(10,14,24,.65);
    color: var(--text);
  }
  textarea{min-height:90px}

  .hint{font-size:12px; color: var(--muted);}

  .zodiacBox{
    margin-top:8px;
    padding:10px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.12);
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:space-between;
  }
  .zodiacItem{font-size:12px;color:var(--muted)}
  .zodiacItem b{color:var(--text)}

  .btns{display:flex; gap:10px; flex-wrap:wrap}
  button{
    border-radius:999px;
    padding:10px 14px;
    background: rgba(122,167,255,.16);
    border:1px solid rgba(122,167,255,.28);
    color: var(--text);
    cursor:pointer;
  }
  button.secondary{background: rgba(255,255,255,.06)}
  button.danger{background: rgba(255,107,107,.16)}
  button:disabled{opacity:.5; cursor:not-allowed}

  .list{
    border-top:1px solid var(--line);
    list-style:none;
    margin:0;
    padding:0;
    max-height:34vh;
    overflow:auto;
  }
  .item{
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    gap:12px;
    cursor:pointer;
  }
  .item:hover{background: rgba(0,0,0,.12)}

  .pill{
    padding:6px 10px;
    border-radius:999px;
    background: rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
    font-size:12px;
    color: var(--muted);
  }

  #map{min-height:420px}

  .footer-tools{
    padding:10px 14px;
    border-top:1px solid var(--line);
    background: rgba(0,0,0,.06);
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    background: rgba(18,26,43,.92);
    color:var(--text);
    padding:10px 12px;
    border-radius:999px;
    opacity:0;
    transition:.2s;
    z-index:9999;
  }
  .toast.show{opacity:1}
</style>

<section style="padding:18px 18px 0">
  <h1 style="margin:0">World Friends Map</h1>
  <p style="margin:6px 0 0;opacity:.7">
    Markers · notes · zodiac · timezone · images · import/export
  </p>
</section>
