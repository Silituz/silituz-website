<!-- Leaflet (Map) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root{
    --bg:#0b0f1a;
    --text:#e9eefc;
    --muted:#a9b4d0;
    --accent:#7aa7ff;
    --danger:#ff6b6b;
    --line:rgba(255,255,255,.08);
    --shadow: 0 14px 40px rgba(0,0,0,.35);
    --radius:18px;
  }

  *{box-sizing:border-box}

  .wrap{
    display:grid;
    grid-template-columns:480px 1fr;
    gap:14px;
    padding:18px;
  }

  @media (max-width:980px){
    .wrap{grid-template-columns:1fr}
    #map{height:55vh}
  }

  .card{
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }

  .panel{padding:14px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}

  label{font-size:12px;color:var(--muted)}
  input,textarea{
    width:100%;
    padding:10px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(10,14,24,.65);
    color:var(--text);
  }

  textarea{min-height:90px}
  .btns{display:flex;gap:10px;flex-wrap:wrap}

  button{
    border-radius:999px;
    padding:10px 14px;
    background:rgba(122,167,255,.16);
    border:1px solid rgba(122,167,255,.28);
    color:var(--text);
    cursor:pointer;
  }

  button.secondary{background:rgba(255,255,255,.06)}
  button.danger{background:rgba(255,107,107,.16)}

  .list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  .item{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:hover{background:rgba(255,255,255,.05)}

  #map{min-height:420px}

  .toast{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    background:#121a2b;
    color:white;
    padding:10px 14px;
    border-radius:999px;
    opacity:0;
    transition:.2s;
    z-index:9999;
  }
  .toast.show{opacity:1}
</style>

<section style="padding:18px 18px 0">
  <h1 style="margin:0">World Friends Map</h1>
  <p style="margin:6px 0 0;opacity:.7">
    Private map with notes, timezones & images
  </p>
</section>

<div class="wrap">
  <div class="card">
    <div class="panel">
      <div class="row">
        <div>
          <label>Nickname</label>
          <input id="nickname">
        </div>
        <div>
          <label>Timezone</label>
          <input id="timezone" placeholder="Europe/Berlin">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Notes</label>
          <textarea id="notes"></textarea>
        </div>
      </div>

      <div class="btns">
        <button id="saveBtn">Save</button>
        <button id="newBtn" class="secondary">New</button>
        <button id="deleteBtn" class="danger">Delete</button>
      </div>
    </div>

    <ul class="list" id="list"></ul>
  </div>

  <div class="card">
    <div id="map"></div>
  </div>
</div>

<div class="toast" id="toast">—</div>

<script>
  const LS_KEY = "friends_map_shared_v1";
  const $ = id => document.getElementById(id);
  let entries = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
  let selected = null;

  const map = L.map("map").setView([20,0],2);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
  const markers = L.layerGroup().addTo(map);

  function toast(t){
    $("toast").textContent=t;
    $("toast").classList.add("show");
    setTimeout(()=>$("toast").classList.remove("show"),2000);
  }

  function save(){
    localStorage.setItem(LS_KEY,JSON.stringify(entries));
    render();
  }

  function render(){
    $("list").innerHTML="";
    markers.clearLayers();

    entries.forEach(e=>{
      const li=document.createElement("li");
      li.className="item";
      li.textContent=e.nickname;
      li.onclick=()=>load(e);
      $("list").appendChild(li);

      const m=L.marker([e.lat,e.lon]).addTo(markers);
      m.bindPopup(`<b>${e.nickname}</b><br>${e.notes||""}`);
    });
  }

  map.on("click",e=>{
    if(!selected) return;
    selected.lat=e.latlng.lat;
    selected.lon=e.latlng.lng;
    save();
  });

  function load(e){
    selected=e;
    $("nickname").value=e.nickname;
    $("timezone").value=e.tz;
    $("notes").value=e.notes;
  }

  $("saveBtn").onclick=()=>{
    if(!selected){
      selected={id:Date.now(),lat:20,lon:0};
      entries.push(selected);
    }
    selected.nickname=$("nickname").value;
    selected.tz=$("timezone").value;
    selected.notes=$("notes").value;
    save();
    toast("Saved");
  };

  $("newBtn").onclick=()=>{
    selected=null;
    $("nickname").value="";
    $("timezone").value="";
    $("notes").value="";
  };

  $("deleteBtn").onclick=()=>{
    if(!selected) return;
    entries=entries.filter(e=>e!==selected);
    selected=null;
    save();
  };

  render();
</script>
