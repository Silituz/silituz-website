<button id="distanceFloatingBtn" title="Distance tool">📏</button>

<div id="distanceHint"></div>

<!-- Command Menu (Ctrl/Cmd + K) -->
<div class="cmdk" id="cmdk" aria-hidden="true">
  <div class="cmdkOverlay" id="cmdkOverlay"></div>
  <div class="cmdkPanel" role="dialog" aria-modal="true" aria-label="Command menu">
    <div class="cmdkHeader">
      <input id="cmdkInput" type="text" placeholder="Search or type a command… (e.g. export, privacy, tag juju)" autocomplete="off" />
      <div class="cmdkHint">Ctrl+K · Esc</div>
    </div>
    <div class="cmdkList" id="cmdkList"></div>
  </div>
</div>

<div class="mobileQuickBar" id="mobileQuickBar" aria-label="Quick actions">
  <button type="button" data-mqa="new" aria-label="New entry"><span class="mqIcon" aria-hidden="true">✚</span><span class="mqLabel">New</span></button>
  <button type="button" data-mqa="save" aria-label="Save"><span class="mqIcon" aria-hidden="true">💾</span><span class="mqLabel">Save</span></button>
  <button type="button" data-mqa="search" aria-label="Search"><span class="mqIcon" aria-hidden="true">🔎</span><span class="mqLabel">Search</span></button>
  <button type="button" data-mqa="import" aria-label="Import JSON"><span class="mqIcon" aria-hidden="true">📥</span><span class="mqLabel">Import</span></button>
  <button type="button" data-mqa="export" aria-label="Export JSON"><span class="mqIcon" aria-hidden="true">📤</span><span class="mqLabel">Export</span></button>
  <button type="button" data-mqa="map" aria-label="Map"><span class="mqIcon" aria-hidden="true">🗺️</span><span class="mqLabel">Map</span></button>
  <button type="button" data-mqa="card" aria-label="Card"><span class="mqIcon" aria-hidden="true">🪪</span><span class="mqLabel">Card</span></button>
</div>
