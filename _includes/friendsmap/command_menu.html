<!-- Command Menu (Ctrl/Cmd + K) -->
<div class="cmdk" id="cmdk" aria-hidden="true">
  <div class="cmdkOverlay" id="cmdkOverlay"></div>
  <div class="cmdkPanel" role="dialog" aria-modal="true" aria-label="Command menu">
    <div class="cmdkHeader">
      <input id="cmdkInput" type="text" placeholder="Search or type a command… (e.g. export, privacy, tag juju)" autocomplete="off" />
      <div class="cmdkHint">Ctrl+K · Esc</div>
    </div>
    <div class="cmdkList" id="cmdkList"></div>
  </div>
</div>
