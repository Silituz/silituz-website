<div class="toast" id="toast" aria-live="polite" aria-atomic="true">
  <span class="toastMsg" id="toastMsg">—</span>
  <button type="button" class="toastAction" id="toastAction" hidden>Undo</button>

</div>

<!-- Unsaved changes guard -->
<div class="unsavedModal" id="unsavedModal" aria-hidden="true">
  <div class="unsavedInner" role="dialog" aria-modal="true" aria-label="Unsaved changes">
    <div class="unsavedTitle">Unsaved changes</div>
    <div class="unsavedText">You have <b>Unsaved…</b> edits. What would you like to do?</div>
    <div class="unsavedBtns">
      <button id="unsavedSave" class="secondary" type="button">Save</button>
      <button id="unsavedDiscard" class="danger" type="button">Discard</button>
      <button id="unsavedStay" class="secondary" type="button">Stay</button>
    </div>
  </div>
</div>

<!-- Time compare overlay -->
<div class="timeCompareModal" id="timeCompareModal" aria-hidden="true">
  <div class="timeCompareInner" role="dialog" aria-modal="true" aria-label="Time comparison">
    <div class="timeCompareTop">
      <div class="timeCompareTitle">🕒 Time comparison</div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button id="timeCompareToggle" class="secondary" type="button" style="padding:6px 10px;" title="Toggle 12h/24h">24h</button>
        <button id="timeCompareClose" class="secondary" type="button" style="padding:6px 10px;">Close</button>
      </div>
    </div>
    <div class="timeCompareBody" id="timeCompareBody">—</div>
  </div>
</div>

<!-- Weather alerts overlay -->
<div class="timeCompareModal" id="weatherAlertsModal" aria-hidden="true">
  <div class="timeCompareInner" role="dialog" aria-modal="true" aria-label="Weather alerts and hints">
    <div class="timeCompareTop">
      <div class="timeCompareTitle">⚠️ Weather alerts / hints</div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button id="weatherAlertsClose" class="secondary" type="button" style="padding:6px 10px;">Close</button>
      </div>
    </div>
    <div class="timeCompareBody" id="weatherAlertsBody">—</div>
  </div>
</div>

<!-- Context menu (right click / long press) -->
<div class="ctxMenu" id="ctxMenu" aria-hidden="true">
  <button class="ctxItem" type="button" data-act="open">🪪 Open card</button>
  <button class="ctxItem" type="button" data-act="edit">✏️ Edit</button>
  <button class="ctxItem" type="button" data-act="map">📍 Map</button>
  <button class="ctxItem" type="button" data-act="network">🕸️ Network</button>
  <div class="ctxSep"></div>
  <button class="ctxItem" type="button" data-act="fav">⭐ Toggle favorite</button>
  <button class="ctxItem" type="button" data-act="copy">📋 Copy name</button>
</div>

<!-- Image modal (click thumbs to open) -->

<div class="imgModal" id="imgModal" aria-hidden="true">
  <div class="imgModalInner" role="dialog" aria-modal="true" aria-label="Image preview">
    <img id="imgModalImg" alt="Preview" />
    <div class="imgModalHint">
      <span>Tip: click outside or press <span class="kbd">Esc</span> to close</span>
      <button id="imgModalClose" class="secondary" style="padding:8px 12px;">Close</button>
    </div>
  </div>
</div>


<!-- Network modal (graph) -->
<div class="netModal" id="netModal" aria-hidden="true">
  <div class="netModalInner" role="dialog" aria-modal="true" aria-label="Network graph">
    <div class="netTop">
      <div class="netTitle">
        🕸️ Network
        <span class="pill" id="netStats">—</span>
      </div>
      <div class="netControls">
        <input id="netSearch" type="text" placeholder="Search names…" />
        <label title="Hide Dislike/Enemy/Nemesis (below the tree)">
          <input id="netHideUnderground" type="checkbox" />
          Hide enemies
        </label>
        <button id="netReset" class="secondary" type="button" style="padding:8px 12px;">Reset</button>
        <button id="netClose" class="secondary" type="button" style="padding:8px 12px;">Close</button>
      </div>
    </div>

    <div class="netCanvasWrap" id="netCanvasWrap">
      <svg id="netSvg" xmlns="http://www.w3.org/2000/svg" aria-label="Connections network"></svg>
    </div>

    <div class="netLegend">
      <span><span class="k">Tip:</span> hover a node to highlight connections · click a node to open profile</span>
      <span><span class="kbd">Esc</span> closes</span>
    </div>
  </div>
</div>
