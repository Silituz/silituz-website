<script>

  // ==============================
  // Storage key
  // ==============================
  const LS_KEY = "world_friends_map_final_en_with_file_import_v1";
  const NOTES_LOCK_KEY = LS_KEY + "__notes_hidden";
  let notesHidden = (localStorage.getItem(NOTES_LOCK_KEY) === "1");

  const LINKS_TOGGLE_KEY = LS_KEY + "__links_on";
  let linksOn = (()=>{ 
    try{
      const v = localStorage.getItem(LINKS_TOGGLE_KEY);
      return (v === null) ? true : (v === "1");
    }catch{ return true; }
  })();
  const WEATHER_TOGGLE_KEY = LS_KEY + "__weather_on";
  let weatherOn = (()=>{ 
    try{
      const v = localStorage.getItem(WEATHER_TOGGLE_KEY);
      return (v === null) ? true : (v === "1");
    }catch{ return true; }
  })();

  const $ = (id) => document.getElementById(id);

  function cmToFeetInchesStr(cm){
    const n = Number(cm);
    if(!Number.isFinite(n) || n <= 0) return "";
    const totalIn = n / 2.54;
    let ft = Math.floor(totalIn / 12);
    let inch = Math.round(totalIn - (ft * 12));
    if(inch === 12){ ft += 1; inch = 0; }
    return `${ft}\'${inch}"`;
  }

  function refreshHeightUs(){
    const cmEl = $("heightCm");
    const usEl = $("heightUs");
    if(!cmEl || !usEl) return;
    const s = cmToFeetInchesStr(cmEl.value);
    usEl.value = s || "";
  }


  (function initMedicalExtras(){
    const cmEl = $("heightCm");
    if(cmEl){
      cmEl.addEventListener("input", refreshHeightUs);
      cmEl.addEventListener("change", refreshHeightUs);
    }
    // initial render
    refreshHeightUs();

  })();

  let __toastTimer = null;
  let __toastAction = null;

  function toast(msg, opts={}){
    const t = $("toast");
    if(!t) return;
    const m = $("toastMsg") || t;
    const btn = $("toastAction");

    if(__toastTimer) clearTimeout(__toastTimer);
    __toastAction = null;

    m.textContent = String(msg ?? "");

    if(btn){
      const actionText = opts && opts.actionText ? String(opts.actionText) : "";
      const onAction = (opts && typeof opts.onAction === "function") ? opts.onAction : null;
      if(actionText && onAction){
        btn.hidden = false;
        btn.textContent = actionText;
        __toastAction = onAction;
      }else{
        btn.hidden = true;
      }
    }

    t.classList.add("show");
    t.setAttribute("aria-hidden","false");

    const duration = Number(opts?.duration ?? 2200);
    __toastTimer = setTimeout(()=>{
      t.classList.remove("show");
      t.setAttribute("aria-hidden","true");
      if(btn) btn.hidden = true;
      __toastAction = null;
    }, Math.max(900, duration));
  }

  function bindToastAction(){
    const btn = $("toastAction");
    if(!btn || btn.__bound) return;
    btn.__bound = true;
    btn.addEventListener("click", ()=>{
      const fn = __toastAction;
      __toastAction = null;
      btn.hidden = true;
      try{ fn && fn(); }catch{}
      const t = $("toast");
      t?.classList.remove("show");
      t?.setAttribute("aria-hidden","true");
      if(__toastTimer) clearTimeout(__toastTimer);
    });
  }
  if(document.readyState === "loading"){
    window.addEventListener("DOMContentLoaded", bindToastAction);
  }else{
    bindToastAction();
  }

  

  function safeParseJSON(str){ try{ return JSON.parse(str); }catch{ return null; } }

  function parseJSONLoose(text){
    // Accepts slightly non-strict JSON: BOM, trailing commas, line comments.
    if(typeof text !== "string") return null;
    let t = text;
    // Strip UTF-8 BOM
    t = t.replace(/^\uFEFF/, "");
    // Remove // comments (only when they start a line)
    t = t.replace(/^\s*\/\/.*$/mg, "");
    // Remove /* ... */ comments
    t = t.replace(/\/\*[\s\S]*?\*\//g, "");
    // Remove trailing commas
    t = t.replace(/,\s*([}\]])/g, "$1");
    return safeParseJSON(t);
  }
  function uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+"_"+Math.random().toString(16).slice(2))); }
  function escapeHTML(s){
    return String(s ?? "").replace(/[&<>\"']/g, (c)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }

  // ==============================
// Weather (Open‑Meteo) — on-demand + cached + 7-day forecast
// ==============================
const WEATHER_UNIT_KEY = LS_KEY + "__weather_unit"; // "C" or "F"
let weatherUnit = (()=>{ 
  try{ return (localStorage.getItem(WEATHER_UNIT_KEY) === "F") ? "F" : "C"; }
  catch{ return "C"; }
})();

function applyWeatherUnitUI(){
  const card = $("profileWeatherCard");
  if(!card) return;
  card.querySelectorAll(".wUnitBtn").forEach(btn=>{
    const u = btn.getAttribute("data-unit") || "C";
    const on = (u === weatherUnit);
    btn.classList.toggle("active", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
  });
}

function setWeatherUnit(u){
  const next = (u === "F") ? "F" : "C";
  weatherUnit = next;
  try{ localStorage.setItem(WEATHER_UNIT_KEY, next); }catch{}
  applyWeatherUnitUI();

  // Re-render weather for current profile (use cache if possible)
  try{
    if(selectedId && $("profileView").style.display !== "none"){
      const e = entries.find(x=>x.id===selectedId);
      if(e){
        renderProfileWeather(e);
        if(isWeatherForecastOpen()){
          renderProfileWeatherForecast(e);
        }
        const hourlyDay = $("profileWeatherCard")?.dataset?.hourlyDay || "";
        if(hourlyDay && isWeatherHourlyOpen()){
          renderProfileWeatherHourly(e, hourlyDay);
        }
      }
    }
  }catch{}
}

function isWeatherForecastOpen(){
  const fc = $("profileWeatherForecast");
  return !!(fc && !fc.hidden);
}
function hideWeatherForecast(forceClose=false){
  const fc = $("profileWeatherForecast");
  const btn = document.querySelector("#profileWeatherCard .js-weather-forecast");
  if(fc){
    fc.hidden = true;
  }
  hideWeatherHourly(forceClose);
  if(btn){
    btn.setAttribute("aria-expanded","false");
    // keep icon; no need to change text
  }
  if(forceClose){
    const list = $("profileWeatherForecastList");
    if(list) list.innerHTML = "";
  }
}
function toggleWeatherForecast(entry){
  const fc = $("profileWeatherForecast");
  const list = $("profileWeatherForecastList");
  const btn = document.querySelector("#profileWeatherCard .js-weather-forecast");
  if(!fc || !list) return;

  const willOpen = !!fc.hidden;
  fc.hidden = !willOpen;
  if(btn) btn.setAttribute("aria-expanded", willOpen ? "true" : "false");

  if(!willOpen) return;

  list.innerHTML = '<span class="weatherLoading">Loading 7-day forecast…</span>';
  renderProfileWeatherForecast(entry);
}

function _cToF(c){ return (Number(c) * 9/5) + 32; }
function _fmtTemp(valC){
  const n = Number(valC);
  if(!isFinite(n)) return "—";
  return String(Math.round(weatherUnit === "F" ? _cToF(n) : n));
}
function _tempUnit(){ return (weatherUnit === "F") ? "°F" : "°C"; }

function _dayLabel(dateStr){
  // dateStr is usually "YYYY-MM-DD" (local date). Use UTC to avoid timezone shifts.
  const s = String(dateStr || "");
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m) return s || "—";
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  const dt = new Date(Date.UTC(y, mo-1, d));
  try{
    return dt.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric", timeZone:"UTC" });
  }catch{
    return s;
  }
}
function _hourLabel(isoStr){
  const s = String(isoStr || "");
  const m = /(\d{2}):(\d{2})$/.exec(s);
  if(m) return m[1] + ":" + m[2];
  return s.slice(-5) || "—";
}
function _resetWeatherAlertButton(titleText){
  const btn = document.querySelector("#profileWeatherCard .js-weather-alerts");
  if(!btn) return;
  btn.classList.remove("hasAlerts");
  btn.setAttribute("data-count", "");
  btn.title = titleText || "Weather alerts / hints";
}
function _setWeatherAlertButton(entry, curData=null, dailyData=null, hourlyData=null){
  const btn = document.querySelector("#profileWeatherCard .js-weather-alerts");
  if(!btn) return;
  if(!entry || notesHidden || !weatherOn){
    _resetWeatherAlertButton();
    return;
  }
  const lat = entry?.lat, lon = entry?.lon;
  if(!(typeof lat === "number" && isFinite(lat) && typeof lon === "number" && isFinite(lon))){
    _resetWeatherAlertButton("No coordinates saved");
    return;
  }
  const cur = curData || _getWeatherCurCache(lat, lon);
  const daily = dailyData || _getWeatherDailyCache(lat, lon);
  const hourly = hourlyData || _getWeatherHourlyCache(lat, lon);
  const alerts = _collectWeatherAlerts(cur, daily, hourly);
  const count = alerts.length;
  btn.classList.toggle("hasAlerts", count > 0);
  btn.setAttribute("data-count", count > 0 ? String(Math.min(count, 9)) : "");
  btn.title = count > 0 ? (count + " weather hint" + (count === 1 ? "" : "s")) : "Weather alerts / hints";
}

const WEATHER_CACHE_KEY = LS_KEY + "__weather_cache_v3";
const WEATHER_CUR_TTL_MS = 10 * 60 * 1000;  // 10 minutes
const WEATHER_DAILY_TTL_MS = 60 * 60 * 1000; // 60 minutes
let __weatherSaveTimer = null;
let __weatherReqToken = 0;
let __weatherDailyReqToken = 0;
let __weatherHourlyReqToken = 0;
const WEATHER_HOURLY_TTL_MS = 30 * 60 * 1000; // 30 minutes

function _loadWeatherCache(){
  try{
    const raw = localStorage.getItem(WEATHER_CACHE_KEY);
    const obj = safeParseJSON(raw);
    return (obj && typeof obj === "object") ? obj : {};
  }catch{ return {}; }
}
let __weatherCache = _loadWeatherCache(); // { "<lat,lon>": {cur:{ts,data}, daily:{ts,data}, hourly:{ts,data}} }

function _weatherKey(lat, lon){
  const la = Number(lat), lo = Number(lon);
  if(!isFinite(la) || !isFinite(lo)) return "";
  return la.toFixed(3) + "," + lo.toFixed(3);
}
function _scheduleWeatherSave(){
  if(__weatherSaveTimer) return;
  __weatherSaveTimer = setTimeout(()=>{
    __weatherSaveTimer = null;
    try{ localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(__weatherCache)); }catch{}
  }, 700);
}

function _getWeatherCurCache(lat, lon){
  const k = _weatherKey(lat, lon);
  if(!k) return null;
  const it = __weatherCache[k];
  const cur = it && it.cur ? it.cur : null;
  if(!cur || !cur.ts) return null;
  if((Date.now() - Number(cur.ts)) > WEATHER_CUR_TTL_MS) return null;
  return cur.data || null;
}
function _setWeatherCurCache(lat, lon, data){
  const k = _weatherKey(lat, lon);
  if(!k) return;
  __weatherCache[k] = __weatherCache[k] || {};
  __weatherCache[k].cur = { ts: Date.now(), data };
  _scheduleWeatherSave();
}

function _getWeatherDailyCache(lat, lon){
  const k = _weatherKey(lat, lon);
  if(!k) return null;
  const it = __weatherCache[k];
  const daily = it && it.daily ? it.daily : null;
  if(!daily || !daily.ts) return null;
  if((Date.now() - Number(daily.ts)) > WEATHER_DAILY_TTL_MS) return null;
  return daily.data || null;
}
function _setWeatherDailyCache(lat, lon, data){
  const k = _weatherKey(lat, lon);
  if(!k) return;
  __weatherCache[k] = __weatherCache[k] || {};
  __weatherCache[k].daily = { ts: Date.now(), data };
  _scheduleWeatherSave();
}
function _getWeatherHourlyCache(lat, lon){
  const k = _weatherKey(lat, lon);
  if(!k) return null;
  const it = __weatherCache[k];
  const hourly = it && it.hourly ? it.hourly : null;
  if(!hourly || !hourly.ts) return null;
  if((Date.now() - Number(hourly.ts)) > WEATHER_HOURLY_TTL_MS) return null;
  return hourly.data || null;
}
function _setWeatherHourlyCache(lat, lon, data){
  const k = _weatherKey(lat, lon);
  if(!k) return;
  __weatherCache[k] = __weatherCache[k] || {};
  __weatherCache[k].hourly = { ts: Date.now(), data };
  _scheduleWeatherSave();
}

function describeWeatherCode(code, isDay){
  const c = Number(code);
  const day = (Number(isDay) === 1);
  // WMO weather codes used by Open‑Meteo
  if(c === 0) return { emoji: day ? "☀️" : "🌙", text:"Clear" };
  if(c === 1) return { emoji: day ? "🌤️" : "🌙☁️", text:"Mostly clear" };
  if(c === 2) return { emoji:"⛅", text:"Partly cloudy" };
  if(c === 3) return { emoji:"☁️", text:"Overcast" };
  if(c === 45 || c === 48) return { emoji:"🌫️", text:"Fog" };
  if(c >= 51 && c <= 57) return { emoji:"🌦️", text:"Drizzle" };
  if((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return { emoji:"🌧️", text:"Rain" };
  if(c >= 71 && c <= 77) return { emoji:"🌨️", text:"Snow" };
  if(c === 85 || c === 86) return { emoji:"🌨️", text:"Snow showers" };
  if(c === 95) return { emoji:"⛈️", text:"Thunderstorm" };
  if(c === 96 || c === 99) return { emoji:"⛈️🧊", text:"Thunderstorm (hail)" };
  return { emoji:"🌦️", text:"Weather" };
}

async function fetchWeatherOpenMeteo(lat, lon, tz){
  // Open‑Meteo: no API key needed
  const url =
    `https://api.open-meteo.com/v1/forecast` +
    `?latitude=${encodeURIComponent(lat)}` +
    `&longitude=${encodeURIComponent(lon)}` +
    `&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,is_day` +
    `&timezone=${encodeURIComponent(tz || "auto")}`;
  const res = await fetch(url, { method:"GET" });
  if(!res.ok) throw new Error("Weather fetch failed");
  const data = await res.json();
  const cur = data && data.current ? data.current : null;
  if(!cur) throw new Error("No weather data");
  return {
    time: cur.time || "",
    code: cur.weather_code,
    is_day: cur.is_day,
    t_c: cur.temperature_2m,
    feels_c: cur.apparent_temperature,
    precip_mm: cur.precipitation,
    wind_kmh: cur.wind_speed_10m
  };
}

async function fetchWeatherForecastOpenMeteo(lat, lon, tz){
  const url =
    `https://api.open-meteo.com/v1/forecast` +
    `?latitude=${encodeURIComponent(lat)}` +
    `&longitude=${encodeURIComponent(lon)}` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max` +
    `&forecast_days=7` +
    `&timezone=${encodeURIComponent(tz || "auto")}`;
  const res = await fetch(url, { method:"GET" });
  if(!res.ok) throw new Error("Forecast fetch failed");
  const data = await res.json();
  const d = data && data.daily ? data.daily : null;
  if(!d) throw new Error("No forecast data");
  return {
    time: d.time || [],
    code: d.weather_code || [],
    tmax_c: d.temperature_2m_max || [],
    tmin_c: d.temperature_2m_min || [],
    precip_mm: d.precipitation_sum || [],
    wind_kmh: d.wind_speed_10m_max || []
  };
}
async function fetchWeatherHourlyOpenMeteo(lat, lon, tz){
  const url =
    `https://api.open-meteo.com/v1/forecast` +
    `?latitude=${encodeURIComponent(lat)}` +
    `&longitude=${encodeURIComponent(lon)}` +
    `&hourly=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m` +
    `&forecast_days=7` +
    `&timezone=${encodeURIComponent(tz || "auto")}`;
  const res = await fetch(url, { method:"GET" });
  if(!res.ok) throw new Error("Hourly forecast fetch failed");
  const data = await res.json();
  const h = data && data.hourly ? data.hourly : null;
  if(!h) throw new Error("No hourly forecast data");
  return {
    time: h.time || [],
    code: h.weather_code || [],
    t_c: h.temperature_2m || [],
    feels_c: h.apparent_temperature || [],
    precip_mm: h.precipitation || [],
    wind_kmh: h.wind_speed_10m || []
  };
}

function _setWeatherCurrentUI(html){
  const cur = $("profileWeatherCurrent");
  if(cur) cur.innerHTML = html;
}

function _renderCurrentWeatherHTML(d){
  const desc = describeWeatherCode(d.code, d.is_day);
  const badges = [];
  const c = Number(d.code);
  const wind = Number(d.wind_kmh);
  const pr = Number(d.precip_mm);

  if(c >= 95) badges.push("⚠️ Thunderstorm");
  if(isFinite(wind) && wind >= 45) badges.push("⚠️ Strong wind");
  if(isFinite(pr) && pr >= 5) badges.push("⚠️ Heavy precipitation");

  const tDisp = Number(d.t_c);
  const fDisp = Number(d.feels_c);
  const tShown = (weatherUnit === "F") ? _cToF(tDisp) : tDisp;
  const fShown = (weatherUnit === "F") ? _cToF(fDisp) : fDisp;

  const feelsPart = (isFinite(fShown) && isFinite(tShown) && Math.abs(fShown - tShown) >= 1)
    ? (' · feels ' + Math.round(fShown) + _tempUnit())
    : "";

  return (
    '<div class="weatherTopLine">' +
      '<span class="weatherEmoji">' + desc.emoji + '</span>' +
      '<span class="weatherDesc">' + escapeHTML(desc.text) + '</span>' +
      '<span class="weatherNums">' + _fmtTemp(d.t_c) + _tempUnit() + feelsPart + '</span>' +
    '</div>' +
    '<div class="weatherNums">💨 ' + Math.round(Number(d.wind_kmh)) + 'km/h · ☔ ' + Number(d.precip_mm).toFixed(1) + 'mm</div>' +
    (badges.length ? ('<div class="weatherBadges">' + badges.map(b=>'<span class="weatherBadge">' + escapeHTML(b) + '</span>').join("") + '</div>') : "")
  );
}

function isWeatherHourlyOpen(){
  const wrap = $("profileWeatherHourlyWrap");
  return !!(wrap && !wrap.hidden);
}
function hideWeatherHourly(forceClear=false){
  const wrap = $("profileWeatherHourlyWrap");
  const list = $("profileWeatherHourlyList");
  const card = $("profileWeatherCard");
  if(wrap) wrap.hidden = true;
  if(card) card.dataset.hourlyDay = "";
  document.querySelectorAll("#profileWeatherForecastList .weatherDayRow.active").forEach(el=>el.classList.remove("active"));
  if(forceClear && list) list.innerHTML = "";
}
function _setActiveWeatherDay(dayStr){
  document.querySelectorAll("#profileWeatherForecastList .weatherDayRow[data-day]").forEach(el=>{
    el.classList.toggle("active", (el.getAttribute("data-day") || "") === String(dayStr || ""));
  });
}
function _hourlyRowsForDay(hd, dayStr){
  const times = Array.isArray(hd?.time) ? hd.time : [];
  const codes = Array.isArray(hd?.code) ? hd.code : [];
  const temps = Array.isArray(hd?.t_c) ? hd.t_c : [];
  const feels = Array.isArray(hd?.feels_c) ? hd.feels_c : [];
  const precip = Array.isArray(hd?.precip_mm) ? hd.precip_mm : [];
  const wind = Array.isArray(hd?.wind_kmh) ? hd.wind_kmh : [];
  const rows = [];
  for(let i=0;i<times.length;i++){
    if(String(times[i] || "").slice(0,10) !== String(dayStr || "")) continue;
    rows.push({
      time: times[i],
      code: codes[i],
      t_c: temps[i],
      feels_c: feels[i],
      precip_mm: precip[i],
      wind_kmh: wind[i]
    });
  }
  return rows;
}
function _renderHourlyHTML(dayStr, rows){
  if(!rows.length) return '<span class="weatherMuted">No hourly data available for this day.</span>';
  return rows.map(r=>{
    const desc = describeWeatherCode(r.code, 1);
    const feelsPart = (isFinite(Number(r.feels_c)) && Math.abs(Number(r.feels_c) - Number(r.t_c)) >= 1)
      ? (' · feels ' + _fmtTemp(r.feels_c) + _tempUnit())
      : '';
    const prMm = isFinite(Number(r.precip_mm)) ? Number(r.precip_mm).toFixed(1) : '—';
    const wK = isFinite(Number(r.wind_kmh)) ? Math.round(Number(r.wind_kmh)) : '—';
    return (
      '<div class="weatherHourCard">' +
        '<div class="weatherHourTime">' + escapeHTML(_hourLabel(r.time)) + '</div>' +
        '<div class="weatherHourMain">' +
          '<span>' + desc.emoji + '</span>' +
          '<span class="weatherHourTemp">' + _fmtTemp(r.t_c) + _tempUnit() + '</span>' +
        '</div>' +
        '<div class="weatherHourDesc">' + escapeHTML(desc.text) + feelsPart + '</div>' +
        '<div class="weatherHourMeta">☔ ' + prMm + 'mm · 💨 ' + wK + 'km/h</div>' +
      '</div>'
    );
  }).join("");
}
function _pushWeatherAlert(arr, level, key, title, detail){
  if(!key) key = title + '|' + detail;
  if(arr.some(x=>x.key === key)) return;
  arr.push({ level, key, title, detail });
}
function _collectWeatherAlerts(cur, daily, hourly){
  const out = [];
  const levelRank = { red:3, orange:2, yellow:1 };
  if(cur){
    const c = Number(cur.code), wind = Number(cur.wind_kmh), pr = Number(cur.precip_mm);
    if(c === 95) _pushWeatherAlert(out, 'red', 'cur-thunder', 'Thunderstorm right now', 'Current conditions show a thunderstorm at this location.');
    if(c === 96 || c === 99) _pushWeatherAlert(out, 'red', 'cur-hail', 'Thunderstorm with hail right now', 'Current conditions point to thunder and hail risk.');
    if(isFinite(wind) && wind >= 70) _pushWeatherAlert(out, 'red', 'cur-wind-red', 'Very strong wind right now', 'Current wind is around ' + Math.round(wind) + ' km/h.');
    else if(isFinite(wind) && wind >= 45) _pushWeatherAlert(out, 'orange', 'cur-wind-orange', 'Strong wind right now', 'Current wind is around ' + Math.round(wind) + ' km/h.');
    if(isFinite(pr) && pr >= 8) _pushWeatherAlert(out, 'orange', 'cur-rain', 'Heavy precipitation right now', 'Current precipitation is around ' + pr.toFixed(1) + ' mm.');
  }
  const dTimes = Array.isArray(daily?.time) ? daily.time : [];
  const dCodes = Array.isArray(daily?.code) ? daily.code : [];
  const dPrecip = Array.isArray(daily?.precip_mm) ? daily.precip_mm : [];
  const dWind = Array.isArray(daily?.wind_kmh) ? daily.wind_kmh : [];
  for(let i=0;i<Math.min(dTimes.length, dCodes.length); i++){
    const day = _dayLabel(dTimes[i]);
    const code = Number(dCodes[i]);
    const pr = Number(dPrecip[i]);
    const wind = Number(dWind[i]);
    if(code === 95) _pushWeatherAlert(out, 'red', 'daily-thunder-' + dTimes[i], 'Thunderstorm risk on ' + day, 'Forecast indicates thunderstorm conditions.');
    if(code === 96 || code === 99) _pushWeatherAlert(out, 'red', 'daily-hail-' + dTimes[i], 'Thunderstorm with hail risk on ' + day, 'Forecast indicates thunderstorm and hail conditions.');
    if(isFinite(wind) && wind >= 70) _pushWeatherAlert(out, 'red', 'daily-wind-red-' + dTimes[i], 'Very strong wind on ' + day, 'Peak wind may reach around ' + Math.round(wind) + ' km/h.');
    else if(isFinite(wind) && wind >= 45) _pushWeatherAlert(out, 'orange', 'daily-wind-orange-' + dTimes[i], 'Strong wind on ' + day, 'Peak wind may reach around ' + Math.round(wind) + ' km/h.');
    if(isFinite(pr) && pr >= 30) _pushWeatherAlert(out, 'red', 'daily-rain-red-' + dTimes[i], 'Very heavy rain on ' + day, 'Total precipitation may reach around ' + pr.toFixed(1) + ' mm.');
    else if(isFinite(pr) && pr >= 15) _pushWeatherAlert(out, 'orange', 'daily-rain-orange-' + dTimes[i], 'Heavy rain on ' + day, 'Total precipitation may reach around ' + pr.toFixed(1) + ' mm.');
  }
  const times = Array.isArray(hourly?.time) ? hourly.time : [];
  const codes = Array.isArray(hourly?.code) ? hourly.code : [];
  const precip = Array.isArray(hourly?.precip_mm) ? hourly.precip_mm : [];
  const wind = Array.isArray(hourly?.wind_kmh) ? hourly.wind_kmh : [];
  const dailyMap = {};
  for(let i=0;i<times.length;i++){
    const dayKey = String(times[i] || '').slice(0,10);
    if(!dayKey) continue;
    dailyMap[dayKey] = dailyMap[dayKey] || { thunder:[], hail:[], maxWind:-Infinity, maxPrecip:0 };
    const box = dailyMap[dayKey];
    const c = Number(codes[i]);
    const w = Number(wind[i]);
    const p = Number(precip[i]);
    if(c === 95) box.thunder.push(_hourLabel(times[i]));
    if(c === 96 || c === 99) box.hail.push(_hourLabel(times[i]));
    if(isFinite(w)) box.maxWind = Math.max(box.maxWind, w);
    if(isFinite(p)) box.maxPrecip = Math.max(box.maxPrecip, p);
  }
  Object.keys(dailyMap).forEach(dayKey=>{
    const day = _dayLabel(dayKey);
    const box = dailyMap[dayKey];
    if(box.hail.length){
      _pushWeatherAlert(out, 'red', 'hourly-hail-' + dayKey, 'Hail window on ' + day, 'Likely around ' + box.hail.slice(0,3).join(', ') + (box.hail.length > 3 ? '…' : '') + '.');
    }else if(box.thunder.length){
      _pushWeatherAlert(out, 'red', 'hourly-thunder-' + dayKey, 'Thunder window on ' + day, 'Likely around ' + box.thunder.slice(0,3).join(', ') + (box.thunder.length > 3 ? '…' : '') + '.');
    }
    if(isFinite(box.maxWind) && box.maxWind >= 70){
      _pushWeatherAlert(out, 'red', 'hourly-wind-red-' + dayKey, 'Very strong wind hours on ' + day, 'Hourly wind may spike to about ' + Math.round(box.maxWind) + ' km/h.');
    }else if(isFinite(box.maxWind) && box.maxWind >= 45){
      _pushWeatherAlert(out, 'orange', 'hourly-wind-orange-' + dayKey, 'Strong wind hours on ' + day, 'Hourly wind may spike to about ' + Math.round(box.maxWind) + ' km/h.');
    }
    if(isFinite(box.maxPrecip) && box.maxPrecip >= 8){
      _pushWeatherAlert(out, 'orange', 'hourly-rain-' + dayKey, 'Heavy precipitation hours on ' + day, 'Hourly precipitation may reach about ' + box.maxPrecip.toFixed(1) + ' mm.');
    }
  });
  return out.sort((a,b)=> (levelRank[b.level] || 0) - (levelRank[a.level] || 0));
}
function _renderWeatherAlertsHTML(alerts){

function _renderForecastHTML(fd, selectedDay=""){
  const times = Array.isArray(fd.time) ? fd.time : [];
  const codes = Array.isArray(fd.code) ? fd.code : [];
  const tmax = Array.isArray(fd.tmax_c) ? fd.tmax_c : [];
  const tmin = Array.isArray(fd.tmin_c) ? fd.tmin_c : [];
  const pr = Array.isArray(fd.precip_mm) ? fd.precip_mm : [];
  const wind = Array.isArray(fd.wind_kmh) ? fd.wind_kmh : [];

  const n = Math.min(7, times.length, codes.length, tmax.length, tmin.length);
  if(!n) return '<span class="weatherMuted">No forecast data available.</span>';

  let out = "";
  for(let i=0;i<n;i++){
    const desc = describeWeatherCode(codes[i], 1);
    const dayKey = String(times[i] || "");
    const day = _dayLabel(dayKey);
    const hi = _fmtTemp(tmax[i]);
    const lo = _fmtTemp(tmin[i]);
    const prMm = (isFinite(Number(pr[i])) ? Number(pr[i]).toFixed(1) : "—");
    const wK = (isFinite(Number(wind[i])) ? Math.round(Number(wind[i])) : "—");
    const active = (String(selectedDay || "") === dayKey) ? " active" : "";
    out += (
      '<div class="weatherDayRow' + active + '" role="button" tabindex="0" data-day-index="' + i + '" data-day="' + escapeHTML(dayKey) + '">' +
        '<div class="wdLeft">' +
          '<span class="wdEmoji">' + desc.emoji + '</span>' +
          '<div class="wdText">' +
            '<div class="wdDay">' + escapeHTML(day) + '</div>' +
            '<div class="wdDesc">' + escapeHTML(desc.text) + ' · tap for hourly details</div>' +
          '</div>' +
        '</div>' +
        '<div class="wdRight">' +
          '<span class="wdTemp">' + hi + _tempUnit() + ' / ' + lo + _tempUnit() + '</span>' +
          '<span>☔ ' + prMm + 'mm</span>' +
          '<span>💨 ' + wK + 'km/h</span>' +
        '</div>' +
      '</div>'
    );
  }
  return out;
}

// ==============================
  // Color naming helper (HEX -> human name)
  // - There is no "official" name for every one of the 16.7M hex colors.
  // - We do two things:
  //   1) Fast local fallback naming (used in hexToNiceName)
  //   2) Optional: load a large public color-name list (thousands of names) and pick the closest match.
  //      If the list can't be loaded (offline), the fallback naming still works.
  // ==============================
  var COLOR_NAME_DB_URL = "https://unpkg.com/color-name-list/dist/colornames.short.min.json";
  var _colorNameDB = null;         // [{ name, hex, rgb:[r,g,b] }, ...]
  var _colorNameDBPromise = null;

  // Eye-name aliases (defined early so load() can normalize saved entries safely)
  var EYE_HEX_NAME_ALIASES = {
    "#add8e6": "Ice Blue" // example / common "ice blue"
  };

  var EYE_NAME_HEX_ALIASES = {
    "iceblue": "#add8e6",
    "ice blue": "#add8e6",
    "eisblau": "#add8e6",

    "hazel": "#8e7618",
    "amber": "#ffbf00",
    "gray": "#9ca3af",
    "grey": "#9ca3af",
    "blue": "#3b82f6",
    "green": "#10b981",
    "brown": "#8b5a2b",
    "black": "#111827",
    "turquoise": "#14b8a6",
    "gold": "#fbbf24"
  };

  function _normalizeColorNameDBShape(data){
    // Supports multiple shapes.
    // Expected (color-name-list): array of objects like {name:"...", hex:"#..."}.
    // But we also support [["Name","#hex"], ...] or { colors:[...] } etc.
    if(!data) return [];
    let arr = [];
    if(Array.isArray(data)){
      arr = data;
    }else if(typeof data === "object"){
      const cand = data.colors || data.colours || data.list || data.items || data.data || data.colorNameList || data.colornames || data.names;
      if(Array.isArray(cand)) arr = cand;
    }
    const out = [];
    for(const it of arr){
      if(!it) continue;
      if(Array.isArray(it) && it.length >= 2){
        const name = String(it[0]||"").trim();
        const hex = String(it[1]||"").trim();
        if(name && hex) out.push({ name, hex });
        continue;
      }
      if(typeof it === "object"){
        const name = String(it.name || it.n || it.title || "").trim();
        const hex = String(it.hex || it.h || it.value || it.color || it.colour || "").trim();
        if(name && hex) out.push({ name, hex });
      }
    }
    return out;
  }

  function ensureColorNameDB(){
    if(_colorNameDBPromise) return _colorNameDBPromise;
    _colorNameDBPromise = (async ()=>{
      try{
        const res = await fetch(COLOR_NAME_DB_URL, { cache:"force-cache" });
        if(!res.ok) throw new Error("db http "+res.status);
        const data = await res.json();
        const flat = _normalizeColorNameDBShape(data);
        const norm = [];
        for(const row of flat){
          const hx = normalizeHexColor(row.hex);
          const rgb = hx ? hexToRGB(hx) : null;
          if(!hx || !rgb) continue;
          norm.push({ name: String(row.name||"").trim(), hex: hx, rgb });
        }
        _colorNameDB = norm;
      }catch{
        _colorNameDB = null;
      }
      return _colorNameDB;
    })();
    return _colorNameDBPromise;
  }

  function nearestNameFromDB(hex){
    const hx = normalizeHexColor(hex);
    if(!hx || !_colorNameDB || !_colorNameDB.length) return "";
    const rgb = hexToRGB(hx);
    if(!rgb) return "";
    let best = null;
    let bestD = Infinity;
    for(const c of _colorNameDB){
      const dr = rgb[0] - c.rgb[0];
      const dg = rgb[1] - c.rgb[1];
      const db = rgb[2] - c.rgb[2];
      const d = dr*dr + dg*dg + db*db;
      if(d < bestD){
        bestD = d;
        best = c;
      }
    }
    return best ? prettifyColorTokenName(best.name) : "";
  }

  // ==============================
  // Display name helper (Nickname + Real name)
  // - If real name is allowed (checkbox) and privacy mode is OFF:
  //     Main = real name (emerald), Sub = nickname (muted)
  // - Otherwise:
  //     Main = nickname (emerald), Sub = "" (or 🔒 Hidden when real exists but is hidden)
  // ==============================
  function displayNames(entry){
    const nick = (entry?.nickname || "").trim();
    const rn = (entry?.realName || "").trim();
    const allowReal = !!entry?.showRealName && !!rn;

    if(allowReal && notesHidden){
      if(nick) return { main: nick, sub: "🔒 Hidden" };
      return { main: "🔒 Hidden", sub: "" };
    }
    if(allowReal){
      if(nick) return { main: rn, sub: nick };
      return { main: rn, sub: "" };
    }
    if(nick) return { main: nick, sub: "" };
    if(rn) return { main: rn, sub: "" };
    return { main: "—", sub: "" };
  }

  function normalizeConnectionsArray(raw, selfId){
    // Supports:
    // - legacy: ["id1","id2"]
    // - v3: [{id:"id1", type:"Freunde"}, ...]
    let arr = Array.isArray(raw) ? raw : [];
    const out = [];
    const seen = new Set();

    for(const v of arr){
      let id = "";
      let type = "Kennen sich";

      if(typeof v === "string"){
        id = v;
      }else if(v && typeof v === "object"){
        id = String(v.id || v.targetId || v.to || "").trim();
        if(typeof v.type === "string" && v.type.trim()) type = v.type.trim();
        else if(typeof v.relType === "string" && v.relType.trim()) type = v.relType.trim();
        else if(typeof v.relationship === "string" && v.relationship.trim()) type = v.relationship.trim();
      }

      id = String(id || "").trim().slice(0, 80);
      type = String(type || "").trim().slice(0, 40) || "Kennen sich";

      if(!id) continue;
      if(selfId && id === selfId) continue;
      if(seen.has(id)) continue;
      seen.add(id);
      out.push({ id, type });
      if(out.length >= 16) break;
    }
    return out;
  }

  function connectionsText(connections){
    if(!Array.isArray(connections)) return "";
    const parts = [];
    for(const c of connections){
      const id = (typeof c === "string") ? String(c||"") : String(c?.id || c?.targetId || "");
      if(!id) continue;
      const t = entryById.get(id);
      if(!t) continue;
      const nm = displayNames(t).main || (t.nickname||"—");
      const type = (typeof c === "object" && c && typeof c.type === "string" && c.type.trim()) ? c.type.trim() : "";
      parts.push(type ? `${nm} (${type})` : nm);
    }
    return parts.join(", ");
  }


  // ==============================
  // Distance helpers (My Location)
  // ==============================
  function haversineKm(lat1, lon1, lat2, lon2){
    const R = 6371; // km
    const toRad = (deg)=> (deg * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function distanceLabelTo(lat, lon){
    if(myLocLat === null || myLocLon === null) return "";
    const aLat = Number(lat), aLon = Number(lon);
    if(!Number.isFinite(aLat) || !Number.isFinite(aLon)) return "";
    const km = haversineKm(myLocLat, myLocLon, aLat, aLon);
    if(!Number.isFinite(km)) return "";

    // More realistic travel-time estimate:
    // - Short/medium distances: assume driving average ~80 km/h
    // - Long distances: assume flying average ~850 km/h + fixed overhead (~0.7h)
    const estimateHours = (dKm)=>{
      if(dKm < 1000){
        return dKm / 80;
      }
      return (dKm / 850) + 0.7;
    };

    const modeEmoji = (km < 1000) ? "🚗" : "✈️";

    const hrs = estimateHours(km);
    const kmTxt = Math.round(km).toLocaleString("en-US");
    const hTxt = (Math.round(hrs * 10) / 10).toFixed(1);
    return `${kmTxt} km (≈ ${hTxt} h ${modeEmoji})`;
  }


  function parseCoords(text){
    const m = String(text).trim().match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);

    return [Number(m[1]), Number(m[2])];
  }
  
  function parseDateYMD(input){
    const s = String(input ?? "").trim();
    if(!s) return null;

    // YYYY-MM-DD
    let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if(m) return { year:Number(m[1]), month:Number(m[2]), day:Number(m[3]), hasYear:true };

    // DD.MM.YYYY
    m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s);
    if(m) return { year:Number(m[3]), month:Number(m[2]), day:Number(m[1]), hasYear:true };

    // DD/MM/YYYY
    m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);
    if(m) return { year:Number(m[3]), month:Number(m[2]), day:Number(m[1]), hasYear:true };

    // DD-MM-YYYY
    m = /^(\d{2})-(\d{2})-(\d{4})$/.exec(s);
    if(m) return { year:Number(m[3]), month:Number(m[2]), day:Number(m[1]), hasYear:true };

    // MM-DD (no year) OR DD-MM (no year) — best-effort
    m = /^(\d{1,2})-(\d{1,2})$/.exec(s);
    if(m){
      const a = Number(m[1]), b = Number(m[2]);
      if(a>=1 && a<=12 && b>=1 && b<=31) return { year:2000, month:a, day:b, hasYear:false };
      if(b>=1 && b<=12 && a>=1 && a<=31) return { year:2000, month:b, day:a, hasYear:false };
    }

    return null;
  }

function fmtDate(iso){
    if(!iso) return "";
    const p = parseDateYMD(iso);
    if(!p) return String(iso);
    const d = new Date(p.year, p.month-1, p.day);
    if(Number.isNaN(d.getTime())) return String(iso);
    return d.toLocaleDateString(undefined, {year:"numeric", month:"2-digit", day:"2-digit"});
  }

  // ==============================
  // Birthday countdown (months + days) until next birthday
  // ==============================
  function monthsDaysUntilNextBirthday(birthISO){
    if(!birthISO) return null;

    const p = parseDateYMD(birthISO);
    if(!p) return null;

    const month = p.month; // 1-12
    const day = p.day;     // 1-31
    const birthYear = p.hasYear ? p.year : null;

    if(!(month>=1 && month<=12 && day>=1 && day<=31)) return null;

    const today = new Date();
    const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());

    let target = new Date(start.getFullYear(), month-1, day);
    // Handle Feb 29 on non-leap years: move to Feb 28
    if(month === 2 && day === 29 && target.getMonth() !== 1){
      target = new Date(start.getFullYear(), 1, 28);
    }
    if(target < start){
      target = new Date(start.getFullYear()+1, month-1, day);
      if(month === 2 && day === 29 && target.getMonth() !== 1){
        target = new Date(start.getFullYear()+1, 1, 28);
      }
    }

    // Count full months by stepping month-by-month
    let months = 0;
    let cursor = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    while(true){
      const next = new Date(cursor.getFullYear(), cursor.getMonth()+1, cursor.getDate());
      // If date overflowed (e.g., Jan 31 -> Mar 3), clamp to last day of next month
      if(next.getMonth() !== (cursor.getMonth()+1)%12){
        const lastDay = new Date(cursor.getFullYear(), cursor.getMonth()+2, 0).getDate();
        next.setDate(lastDay);
      }
      if(next <= target){
        cursor = next;
        months++;
      }else{
        break;
      }
    }
    const msPerDay = 24*60*60*1000;
    const days = Math.round((target - cursor)/msPerDay);
    const age = (birthYear !== null) ? (target.getFullYear() - birthYear) : null;
    return { months, days, target, age };
  }


  // Format birthday countdown as months + days (no weeks)
  function fmtMoDays(months, days){
    const m = Number(months)||0;

    return `${d}d`;
  }


  // ==============================
  // Helpers: days until next birthday / next met anniversary
  // ==============================
  function daysBetweenDates(a, b){
    // a, b are Date objects (midnight recommended)
    const msPerDay = 24*60*60*1000;
    // Use floor/ceil-safe integer day difference
    const ua = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
    const ub = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((ub - ua) / msPerDay);
  }

  function daysUntilNextBirthday(birthISO){
    const diff = monthsDaysUntilNextBirthday(birthISO);
    if(!diff || !diff.target) return null;
    const today = new Date();
    const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const target = new Date(diff.target.getFullYear(), diff.target.getMonth(), diff.target.getDate());
    const d = daysBetweenDates(start, target);
    return Number.isFinite(d) ? Math.max(0, d) : null;
  }

  function nextAnniversaryInfo(metISO){
    if(!metISO) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(metISO).trim());
    if(!m) return null;

    const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
    if(!(mo>=1 && mo<=12 && d>=1 && d<=31)) return null;

    const today = new Date();
    const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());

    // Anniversary date in current year
    let ann = new Date(start.getFullYear(), mo-1, d);
    // Guard overflow dates (e.g. 31 in shorter month) -> clamp to last day of month
    if(ann.getMonth() !== (mo-1)){
      ann = new Date(start.getFullYear(), mo, 0);
    }

    if(ann < start){
      ann = new Date(start.getFullYear()+1, mo-1, d);
      if(ann.getMonth() !== (mo-1)){
        ann = new Date(start.getFullYear()+1, mo, 0);
      }
    }

    const days = Math.max(0, daysBetweenDates(start, ann));

    // Years count (how many full years will be completed on ann)
    let years = ann.getFullYear() - y;
    // if the first met date isn't reached yet in that anniversary year, years is still correct because ann is the anniversary
    if(years < 0) years = 0;

    return { days, years, anniversary: ann };
  }

function yearsMonthsDaysSince(startISO){
    if(!startISO) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(startISO).trim());
    if(!m) return null;

    const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
    if(!(mo>=1 && mo<=12 && d>=1 && d<=31)) return null;

    const today = new Date();
    const end = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    let start = new Date(y, mo-1, d);
    // If invalid date (e.g., 31 in a 30-day month), JS will overflow; guard:
    if(start.getMonth() !== (mo-1) || start.getDate() !== d) return null;

    if(start > end) return null;

    // Step years
    let years = 0;
    let cursor = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    while(true){
      const next = new Date(cursor.getFullYear()+1, cursor.getMonth(), cursor.getDate());
      if(next <= end){
        years++;
        cursor = next;
      } else break;
    }

    // Step months
    let months = 0;
    while(true){
      const next = new Date(cursor.getFullYear(), cursor.getMonth()+1, cursor.getDate());
      // handle overflow (e.g., Jan 31 -> Mar 3): clamp to last day of target month
      if(next.getDate() !== cursor.getDate()){
        const last = new Date(cursor.getFullYear(), cursor.getMonth()+2, 0); // last day of next month
        const clamped = new Date(last.getFullYear(), last.getMonth(), last.getDate());
        if(clamped <= end){
          months++;
          cursor = clamped;
          continue;
        }
        break;
      }
      if(next <= end){
        months++;
        cursor = next;
      } else break;
    }

    // Remaining days
    const msPerDay = 24*60*60*1000;
    const days = Math.round((end - cursor) / msPerDay);

    return { years, months, days };
  }

  function relRank(val){
    const v = String(val || "").trim();
    const idx = REL_TYPES.indexOf(v);
    return (idx >= 0) ? idx : 0;
  }

  function nodeLabelForEntry(e){
    const nm = displayNames(e);
    return {
      main: (nm && nm.main) ? nm.main : (e.nickname || e.realName || "—"),
      sub: (nm && nm.sub) ? nm.sub : ""
    };
  }

  function buildNetworkData(){
    const byId = new Map(entries.map(e=>[e.id, e]));
    const nodes = entries.map(e=>{
      const lbl = nodeLabelForEntry(e);
      return {
        id: e.id,
        name: lbl.main,
        sub: lbl.sub,
        rel: String(e.connection || "").trim(),
        rank: relRank(e.connection),
        fav: !!e.fav,
        special: !!specialId && e.id === specialId
      };
    });

    // Undirected edges, deduped
    const edges = [];
    const edgeSeen = new Map(); // key -> {a,b,type,enemy}
    for(const e of entries){
      const from = e.id;
      const arr = Array.isArray(e.connections) ? e.connections : [];
      for(const c of arr){
        const to = String(c?.id || "").trim();
        if(!to || !byId.has(to) || to === from) continue;
        const a = (from < to) ? from : to;
        const b = (from < to) ? to : from;
        const t = String(c?.type || "").trim() || "Know each other";
        const key = a + "|" + b;
        if(!edgeSeen.has(key)){
          edgeSeen.set(key, { a, b, type: t, enemy: UNDERGROUND_REL.has(t) });
        }else{
          // if other direction exists with different type, mark as mixed (but keep enemy if any)
          const ex = edgeSeen.get(key);
          if(ex.type !== t) ex.type = ex.type; // keep first type as label
          ex.enemy = ex.enemy || UNDERGROUND_REL.has(t);
        }
      }
    }
    for(const v of edgeSeen.values()) edges.push(v);

    // adjacency map
    const adj = new Map();
    for(const n of nodes) adj.set(n.id, new Set());
    for(const e of edges){
      if(!adj.has(e.a) || !adj.has(e.b)) continue;
      adj.get(e.a).add(e.b);
      adj.get(e.b).add(e.a);
    }
    return { nodes, edges, adj };
  }

  function renderNetworkGraph(){
    const svg = $("netSvg");
    const wrap = $("netCanvasWrap");
    if(!svg || !wrap) return;

    const hideUnderground = $("netHideUnderground").checked;
    const q = $("netSearch").value.trim().toLowerCase();

    const { nodes: allNodes, edges: allEdges, adj } = buildNetworkData();
    const nodeMap = new Map(allNodes.map(n=>[n.id, n]));

    function isUndergroundNode(n){
      return UNDERGROUND_REL.has(String(n?.rel || "").trim());
    }

    // Search filter (keep neighbors for context)
    let baseSet = new Set(allNodes.map(n=>n.id));
    if(q){
      const matches = new Set(allNodes.filter(n=>{
        const hay = (n.name + " " + (n.sub||"")).toLowerCase();
        return hay.includes(q);
      }).map(n=>n.id));

      if(matches.size){
        const expanded = new Set(matches);
        for(const e of allEdges){
          if(matches.has(e.a)) expanded.add(e.b);
          if(matches.has(e.b)) expanded.add(e.a);
        }
        baseSet = expanded;
      }else{
        baseSet = matches; // empty
      }
    }

    // Apply "hide underground"
    let baseNodes = allNodes.filter(n=> baseSet.has(n.id) && (!hideUnderground || !isUndergroundNode(n)));
    let baseEdges = allEdges.filter(e=> baseSet.has(e.a) && baseSet.has(e.b));
    if(hideUnderground){
      baseEdges = baseEdges.filter(e => !e.enemy);
    }

    // Focus node (center)
    let focusId = (netFocusId && baseSet.has(netFocusId)) ? netFocusId : null;
    if(!focusId){
      // prefer specialId if available, otherwise first visible node
      const preferred = (typeof specialId !== "undefined" && specialId && baseSet.has(specialId)) ? specialId : null;
      focusId = preferred || (baseNodes[0]?.id || null);
    }
    if(!focusId){
      $("netStats").textContent = `0 people • 0 links`;
      svg.innerHTML = "";
      svg.setAttribute("viewBox", `0 0 980 680`);
      return;
    }

    // Build a focused neighborhood: focus in center, then expand outward by graph distance.
    // Depth 1 = direct connections; Depth 2 = connections-of-connections, etc.
    const MAX_DEPTH = 3;

    const include = new Set([focusId]);
    const dist = new Map([[focusId, 0]]);
    let frontier = [focusId];

    for(let d=1; d<=MAX_DEPTH; d++){
      const next = [];
      for(const id of frontier){
        const neigh = adj.get(id);
        if(!neigh) continue;
        for(const nb of neigh){
          if(!baseSet.has(nb)) continue;
          const nn = nodeMap.get(nb);
          if(!nn) continue;
          if(hideUnderground && isUndergroundNode(nn)) continue;
          if(!include.has(nb)){
            include.add(nb);
            dist.set(nb, d);
            next.push(nb);
          }
        }
      }
      frontier = next;
      if(!frontier.length) break;
    }

    // Keep only nodes/edges inside the focused neighborhood.
    let nodes = baseNodes.filter(n=> include.has(n.id));
    let edges = baseEdges.filter(e=> include.has(e.a) && include.has(e.b));

    // If search is active, still keep focus even if it didn't match.
    // (Already included, but guard against edge cases)
    if(!nodes.some(n=>n.id===focusId)){
      const fn = nodeMap.get(focusId);
      if(fn) nodes.push(fn);
    }

    const focusNode = nodeMap.get(focusId);
    const focusName = focusNode ? focusNode.name : "Focus";
    $("netStats").textContent = `${nodes.length} people • ${edges.length} links • centered: ${focusName}`;

    // Split nodes into main + underground (underground shown on bottom arc)
    const mainNodes = nodes.filter(n=>!isUndergroundNode(n) || n.id===focusId);
    const underNodes = nodes.filter(n=>isUndergroundNode(n) && n.id!==focusId);

    // Group main nodes by distance layer
    const layers = new Map(); // d -> nodes[]
    let maxD = 0;
    for(const n of mainNodes){
      const d = dist.get(n.id) ?? 99;
      if(d === 0) continue; // center node
      maxD = Math.max(maxD, d);
      if(!layers.has(d)) layers.set(d, []);
      layers.get(d).push(n);
    }
    if(maxD === 0) maxD = 1; // still draw at least one orbit for aesthetics

    // Layout sizing (radial "solar" around the focused person)
    const NODE_R = 20;
    const MIN_ARC = 110;        // minimal arc-length per node (includes label space)
    const BASE_INNER = 150;     // ring-1 radius
    const RING_GAP = 150;       // ring spacing

    const rings = []; // [{ d, r, nodes }]
    let rCursor = BASE_INNER;

    for(let d=1; d<=maxD; d++){
      const arr = layers.get(d) || [];
      if(!arr.length) { rCursor += RING_GAP; continue; }

      // Ring needs to be large enough so nodes don't collide.
      const rNeed = (arr.length * MIN_ARC) / (2*Math.PI);
      rCursor = Math.max(rCursor, rNeed);
      rings.push({ d, r: rCursor, nodes: arr });
      rCursor += RING_GAP;
    }

    let outerR = rings.length ? rings[rings.length-1].r : BASE_INNER;

    // Place underground nodes on a dedicated bottom arc, beyond outer ring
    let underR = outerR + 190;
    if(underNodes.length){
      const arcAngle = Math.PI * 0.72;
      const rNeed = (underNodes.length * MIN_ARC) / arcAngle;
      underR = Math.max(underR, rNeed);
      outerR = Math.max(outerR, underR);
    }

    const PAD = 260;
    const w = Math.max(980, Math.round(outerR*2 + PAD));
    const h = Math.max(680, Math.round(outerR*2 + PAD));

    // Prepare SVG
    svg.innerHTML = "";
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.style.width = w + "px";
    svg.style.height = h + "px";

    const cx = w/2;
    const cy = h/2;

    // Auto-center on focus
    wrap.dataset.centerX = String(cx);
    wrap.dataset.centerY = String(cy);
    wrap.dataset.focusX  = String(cx);
    wrap.dataset.focusY  = String(cy);

    const gBg = document.createElementNS("http://www.w3.org/2000/svg","g");
    const gEdges = document.createElementNS("http://www.w3.org/2000/svg","g");
    const gNodes = document.createElementNS("http://www.w3.org/2000/svg","g");
    svg.appendChild(gBg);
    svg.appendChild(gEdges);
    svg.appendChild(gNodes);

    // Orbits
    function addOrbit(radius, cls=""){
      const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("class", "netOrbit" + (cls ? (" " + cls) : ""));
      c.setAttribute("cx", String(cx));
      c.setAttribute("cy", String(cy));
      c.setAttribute("r", String(radius));
      gBg.appendChild(c);
    }
    for(const ring of rings){
      addOrbit(ring.r, "main");
      const t = document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("class","netOrbitLabel");
      t.setAttribute("x", String(cx));
      t.setAttribute("y", String(cy - ring.r - 10));
      t.setAttribute("text-anchor","middle");
      t.textContent = `Layer ${ring.d}`;
      gBg.appendChild(t);
    }
    if(underNodes.length && !hideUnderground){
      addOrbit(underR, "underground");
      const t = document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("class","netOrbitLabel");
      t.setAttribute("x", String(cx));
      t.setAttribute("y", String(cy + underR + 26));
      t.setAttribute("text-anchor","middle");
      t.textContent = "Underground";
      gBg.appendChild(t);
    }

    // Positions
    const pos = new Map(); // id -> {x,y}
    const nodeById = new Map(); // id -> <g>
    const edgeEls = [];         // <line>
    const edgeLabelEls = [];    // <text>

    function stableOffset(seed){
      let h = 0;
      const s = String(seed||"");
      for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
      return (h % 6283) / 1000; // ~0..6.283
    }

    // Center node
    pos.set(focusId, {x: cx, y: cy});

    // Place main rings by distance (sorted by rank/degree/name)
    for(const ring of rings){
      const arr = [...ring.nodes].sort((a,b)=>{
        // nearer relationships (rank) first, then degree, then name
        const ra = relRank(a.rel), rb = relRank(b.rel);
        if(rb !== ra) return rb - ra;
        const da = (adj.get(a.id)?.size || 0);
        const db = (adj.get(b.id)?.size || 0);
        if(db !== da) return db - da;
        return (a.name||"").localeCompare(b.name||"", undefined, {sensitivity:"base"});
      });
      const n = arr.length;
      const off = -Math.PI/2 + stableOffset("layer:"+ring.d+":"+focusId);
      for(let i=0;i<n;i++){
        const ang = off + (i * (2*Math.PI / n));
        const x = cx + ring.r * Math.cos(ang);
        const y = cy + ring.r * Math.sin(ang);
        pos.set(arr[i].id, {x,y});
      }
    }

    // Place underground nodes (bottom arc)
    if(underNodes.length && !hideUnderground){
      const arr = [...underNodes].sort((a,b)=>{
        const da = (adj.get(a.id)?.size || 0);
        const db = (adj.get(b.id)?.size || 0);
        if(db !== da) return db - da;
        return (a.name||"").localeCompare(b.name||"", undefined, {sensitivity:"base"});
      });
      const n = arr.length;
      const startAng = Math.PI * 0.18;
      const endAng   = Math.PI * 0.82;
      const span = (endAng - startAng);
      for(let i=0;i<n;i++){
        const ang = startAng + (n===1 ? span/2 : (i * (span / (n-1))));
        const x = cx + underR * Math.cos(ang);
        const y = cy + underR * Math.sin(ang);
        pos.set(arr[i].id, {x,y});
      }
    }

    // Edges + labels
    function addEdgeLabel(e, p1, p2){
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = (-dy / len);
      const ny = ( dx / len);
      const mx = (p1.x + p2.x) / 2 + nx * 10;
      const my = (p1.y + p2.y) / 2 + ny * 10;

      const t = document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x", String(mx));
      t.setAttribute("y", String(my));
      t.setAttribute("text-anchor","middle");
      t.setAttribute("class", "netEdgeLabel" + (e.enemy ? " enemy" : ""));
      t.textContent = String(e.type || "Know each other");
      t.dataset.a = e.a;
      t.dataset.b = e.b;
      gEdges.appendChild(t);
      edgeLabelEls.push(t);
    }

    for(const e of edges){
      const p1 = pos.get(e.a), p2 = pos.get(e.b);
      if(!p1 || !p2) continue;

      const ln = document.createElementNS("http://www.w3.org/2000/svg","line");
      ln.setAttribute("x1", String(p1.x));
      ln.setAttribute("y1", String(p1.y));
      ln.setAttribute("x2", String(p2.x));
      ln.setAttribute("y2", String(p2.y));
      ln.setAttribute("class", "netEdge" + (e.enemy ? " enemy" : ""));
      ln.dataset.a = e.a;
      ln.dataset.b = e.b;
      gEdges.appendChild(ln);
      edgeEls.push(ln);

      addEdgeLabel(e, p1, p2);
    }

    // Nodes
    function initial(name){
      const s = String(name||"").trim();
      if(!s) return "•";
      return s[0].toUpperCase();
    }

    for(const n of nodes){
      const p = pos.get(n.id);
      if(!p) continue;

      const isCenter = (n.id === focusId);

      const g = document.createElementNS("http://www.w3.org/2000/svg","g");
      g.setAttribute("class",
        "netNode" +
        (n.fav ? " isFav" : "") +
        (n.special ? " isSpecial" : "") +
        (isUndergroundNode(n) ? " isUnderground" : "") +
        (isCenter ? " isCenter" : "")
      );
      g.dataset.id = n.id;

      const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx", String(p.x));
      c.setAttribute("cy", String(p.y));
      c.setAttribute("r", String(isCenter ? 28 : NODE_R));
      g.appendChild(c);

      const it = document.createElementNS("http://www.w3.org/2000/svg","text");
      it.setAttribute("x", String(p.x));
      it.setAttribute("y", String(p.y + 5));
      it.setAttribute("text-anchor","middle");
      it.setAttribute("class","ini");
      it.textContent = isCenter ? initial(n.name) : initial(n.name);
      g.appendChild(it);

      const nm = document.createElementNS("http://www.w3.org/2000/svg","text");
      nm.setAttribute("x", String(p.x));
      nm.setAttribute("y", String(p.y + (isCenter ? 44 : (NODE_R + 18))));
      nm.setAttribute("text-anchor","middle");
      nm.setAttribute("class","nm");
      nm.textContent = n.name;
      g.appendChild(nm);

      // Tooltip
      const title = document.createElementNS("http://www.w3.org/2000/svg","title");
      title.textContent = `${n.name}${n.sub ? " — " + n.sub : ""} (${n.rel || "Other"})`;
      g.appendChild(title);

      gNodes.appendChild(g);
      nodeById.set(n.id, g);
    }

    // Highlight handling (also affects edge labels)
    function clearNetHighlight(){
      for(const g of nodeById.values()){
        g.classList.remove("isHot","isDim");
      }
      for(const ln of edgeEls){
        ln.classList.remove("isHot","isDim");
      }
      for(const t of edgeLabelEls){
        t.classList.remove("isHot","isDim");
      }
      // keep center visually strong
      if(nodeById.has(focusId)){
        nodeById.get(focusId).classList.add("isHot");
      }
    }

    function highlightNet(id){
      const neighbors = adj.get(id) || new Set();

      for(const [nid, g] of nodeById.entries()){
        const isHot = (nid === id) || neighbors.has(nid);
        g.classList.toggle("isHot", isHot);
        g.classList.toggle("isDim", !isHot);
      }

      for(const ln of edgeEls){
        const a = ln.dataset.a, b = ln.dataset.b;
        const hot = (a === id && neighbors.has(b)) || (b === id && neighbors.has(a));
        ln.classList.toggle("isHot", hot);
        ln.classList.toggle("isDim", !hot);
      }
      for(const t of edgeLabelEls){
        const a = t.dataset.a, b = t.dataset.b;
        const hot = (a === id && neighbors.has(b)) || (b === id && neighbors.has(a));
        t.classList.toggle("isHot", hot);
        t.classList.toggle("isDim", !hot);
      }
    }

    clearNetHighlight();

    // ✅ Make the network usable on phones/tablets (no hover):
    // - Desktop: hover highlights, click opens profile
    // - Mobile: tap highlights, tap again opens profile (tap empty space clears)
    const NET_TOUCH = (window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches) || ("ontouchstart" in window);

    // Update the hint text in the legend (best effort)
    try{
      const tipSpan = document.querySelector("#netModal .netLegend span");
      if(tipSpan){
        tipSpan.innerHTML =
          '<span class="k">Tip:</span> ' +
          (NET_TOUCH
            ? "tap a node to highlight connections · tap again to open profile"
            : "hover a node to highlight connections · click a node to open profile");
      }
    }catch{}

    // Tap-to-preview memory (mobile)
    let _tapId = null;
    let _tapTs = 0;
    const TAP_MS = 900;

    if(!NET_TOUCH){
      svg.onmousemove = (ev)=>{
        const node = ev.target.closest(".netNode");
        if(!node){
          // Keep pinned selection highlighted when moving over empty space
          if(netPinnedId){
            if(netHoverId !== netPinnedId){
              netHoverId = netPinnedId;
              highlightNet(netPinnedId);
            }
          }else if(netHoverId){
            netHoverId = null;
            clearNetHighlight();
          }
          return;
        }
        const id = node.dataset.id;
        if(!id) return;
        if(netHoverId !== id){
          netHoverId = id;
          highlightNet(id);
        }
      };

      svg.onmouseleave = ()=>{
        if(netPinnedId){
          netHoverId = netPinnedId;
          highlightNet(netPinnedId);
        }else{
          netHoverId = null;
          clearNetHighlight();
        }
      };
    }else{
      // On touch devices we don't rely on move/leave.
      svg.onmousemove = null;
      svg.onmouseleave = null;
    }

    svg.onclick = (ev)=>{
      const node = ev.target.closest(".netNode");

      // Tap/click on empty area: clear pinned + highlight
      if(!node){
        netPinnedId = null;
        netHoverId = null;
        clearNetHighlight();
        return;
      }

      const id = node.dataset.id;
      if(!id) return;

      const now = Date.now();
      const same = (_tapId === id) && ((now - _tapTs) < TAP_MS);
      _tapId = id;
      _tapTs = now;

      // 1st click/tap: pin + highlight (keep the network view open)
      if(!same){
        netPinnedId = id;
        netHoverId = id;
        highlightNet(id);
        if(NET_TOUCH) toast("Tap again to open profile");
        return;
      }

      // 2nd click/tap quickly on the same node: open profile
      closeNetworkModal();
      openProfile(id);
    };
  }

  function westernZodiac(month, day){
    if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) return "Capricorn";
    if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) return "Aquarius";
    if ((month === 2 && day >= 19) || (month === 3 && day <= 20)) return "Pisces";
    if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) return "Aries";
    if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) return "Taurus";
    if ((month === 5 && day >= 21) || (month === 6 && day <= 20)) return "Gemini";
    if ((month === 6 && day >= 21) || (month === 7 && day <= 22)) return "Cancer";
    if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return "Leo";
    if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return "Virgo";
    if ((month === 9 && day >= 23) || (month === 10 && day <= 22)) return "Libra";
    if ((month === 10 && day >= 23) || (month === 11 && day <= 21)) return "Scorpio";
    if ((month === 11 && day >= 22) || (month === 12 && day <= 21)) return "Sagittarius";
    return "—";
  }

  function chineseZodiacAnimal(year){
    const animals = ["Rat","Ox","Tiger","Rabbit","Dragon","Snake","Horse","Goat","Monkey","Rooster","Dog","Pig"];
    const idx = ((year - 2008) % 12 + 12) % 12; // 2008 was Rat
    return animals[idx];
  }

  // Chinese element: 10-year cycle (each element lasts 2 years)
  // Reference: 1984 = Wood Rat (start of 60-year cycle)
  function chineseZodiacElement(year){
    const elements = ["Wood","Fire","Earth","Metal","Water"];
    const idx10 = ((year - 1984) % 10 + 10) % 10;
    return elements[Math.floor(idx10 / 2)];
  }

      "Cancer":"♋","Leo":"♌","Virgo":"♍","Libra":"♎","Scorpio":"♏","Sagittarius":"♐"

      "Horse":"🐎","Goat":"🐐","Monkey":"🐒","Rooster":"🐓","Dog":"🐕","Pig":"🐖"

  function westernZodiacUrl(sign){
    if(!sign || sign === "—") return "";
    // Wikipedia pages like: Leo_(astrology)
    return `https://en.wikipedia.org/wiki/${encodeURIComponent(sign)}_(astrology)`;
  }

  function chineseZodiacUrl(animal){

  function formatZodiacLineHTML(birthdateStr){
    // birthdateStr: YYYY-MM-DD
    if(!birthdateStr) return `Zodiac: — | Chinese Element: — | Chinese Zodiac: —`;
    const d = new Date(birthdateStr + "T00:00:00");
    if(Number.isNaN(d.getTime())) return `Zodiac: — | Chinese Element: — | Chinese Zodiac: —`;

    const sign = westernZodiac(d.getMonth()+1, d.getDate());
    const signEmoji = westernZodiacEmoji(sign);
    const signLabel = sign === "—" ? "—" : `${sign} ${signEmoji}`.trim();
    const signUrl = westernZodiacUrl(sign);

    const year = d.getFullYear();
    const animal = chineseZodiacAnimal(year);
    const animalEmoji = chineseZodiacEmoji(animal);
    const animalLabel = animal === "—" ? "—" : `${animal} ${animalEmoji}`.trim();
    const animalUrl = chineseZodiacUrl(animal);

    const el = chineseZodiacElement(year);
    const elEmoji = chineseElementEmoji(el);
    const elLabel = el ? `${el} ${elEmoji}`.trim() : "—";

    const signHTML = (signUrl && sign !== "—")
      ? `<a class="zodiacLink" href="${signUrl}" target="_blank" rel="noopener noreferrer">${escapeHTML(signLabel)}</a>`
      : `${escapeHTML(signLabel)}`;

    const animalHTML = (animalUrl && animal !== "—")
      ? `<a class="zodiacLink" href="${animalUrl}" target="_blank" rel="noopener noreferrer">${escapeHTML(animalLabel)}</a>`
      : `${escapeHTML(animalLabel)}`;

    return `Zodiac: ${signHTML} | Chinese Element: ${escapeHTML(elLabel)} | Chinese Zodiac: ${animalHTML}`;
  }

  let pendingImageData = null;

  function showPreview(base64, name){

  }
  function clearPendingImage(alsoInput=true){

  async function fileToCompressedBase64(file, opts={}){
    const maxW = opts.maxWidth ?? 560;
    const maxH = opts.maxHeight ?? 560;
    const quality = opts.quality ?? 0.78;
    const outType = opts.type ?? "image/jpeg";

    const dataUrl = await new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });

    const img = await new Promise((resolve, reject)=>{
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = reject;
      i.src = dataUrl;
    });

    let { width, height } = img;
    const ratio = Math.min(maxW / width, maxH / height, 1);
    width = Math.round(width * ratio);
    height = Math.round(height * ratio);

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d", { alpha: false });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, width, height);

    return canvas.toDataURL(outType, quality);
  }

  $("imageFile").addEventListener("change", async (e)=>{
    const file = e.target.files?.[0];
    if(!file){ clearPendingImage(false); return; }
    if(!file.type.startsWith("image/")){
      toast("Please select an image file");
      clearPendingImage();
      return;
    }
    try{
      toast("Preparing image…");
      pendingImageData = await fileToCompressedBase64(file, { maxWidth:560, maxHeight:560, quality:0.78, type:"image/jpeg" });
      showPreview(pendingImageData, file.name);
      toast("Image ready ✅");
    }catch{
      toast("Could not process image");
      clearPendingImage();
    }
  });

  function socialValueToHref(key, value){
    const raw = String(value||"").trim();
    if(!raw) return "";
    if(/^mailto:/i.test(raw)) return raw;
    if(/^(https?:)?\/\//i.test(raw)) return raw.startsWith('http') ? raw : ('https:' + raw);
    if(key === 'email') return /^\S+@\S+\.\S+$/.test(raw) ? ('mailto:' + raw) : '';
    if(key === 'website') return 'https://' + raw.replace(/^\/+/, '');
    const name = raw.replace(/^@/, '').trim();
    if(!name) return '';
    if(key === 'tiktok') return 'https://www.tiktok.com/@' + encodeURIComponent(name);
    if(key === 'instagram') return 'https://www.instagram.com/' + encodeURIComponent(name) + '/';
    if(key === 'telegram') return 'https://t.me/' + encodeURIComponent(name);
    if(key === 'youtube') return /^@/.test(raw) ? ('https://www.youtube.com/' + raw) : ('https://www.youtube.com/@' + encodeURIComponent(name));
    if(key === 'whatsapp') return raw.startsWith('+') ? ('https://wa.me/' + raw.replace(/\D/g,'')) : (raw.includes('wa.me') ? raw : 'https://wa.me/' + raw.replace(/\D/g,''));
    if(key === 'discord') return (/discord\.gg|discord\.com\//i.test(raw)) ? (raw.startsWith('http') ? raw : ('https://' + raw.replace(/^\/+/,''))) : '';
    return '';
  }

  const PRIVACY_PIN_KEY = "friendsmap_privacy_pin_hash_v1";

  async function sha256Hex(str){
    try{
      const enc = new TextEncoder();
      const buf = await crypto.subtle.digest("SHA-256", enc.encode(String(str||"")));
      const arr = Array.from(new Uint8Array(buf));
      return arr.map(b=>b.toString(16).padStart(2,"0")).join("");
    }catch{
      // Fallback (not cryptographically strong) – better than plain text
      let h = 0;
      const s = String(str||"");
      for(let i=0;i<s.length;i++){ h = ((h<<5)-h) + s.charCodeAt(i); h |= 0; }
      return "x"+String(h);
    }
  }

  function getPrivacyPinHash(){

    if(confirmPin.trim() !== clean){

    const hash = await sha256Hex(clean);
    setPrivacyPinHash(hash);
    toast("Privacy PIN saved ✅");
  }

  async function verifyPrivacyPin(){
    const hash = getPrivacyPinHash();
    if(!hash) return true;
    const pin = prompt("Enter privacy PIN to show notes:", "") || "";
    const h = await sha256Hex(pin.trim());
    const ok = (h === hash);
    if(!ok) toast("Wrong PIN ❌");
    return ok;
  }

  const NOTES_CATS = ["important","work","media","food","other"];
  const NOTES_LABEL = {
    important: "🚨 Important",

  function normalizeNotes(notes){
    // Backward-compat:
    // - very old saves used a single string
    // - some saves used different keys like "projects", "others", or capitalized labels
    const empty = { important:"", work:"", media:"", food:"", other:"" };
    if(notes == null) return { ...empty };
    if(typeof notes === "string"){
      return { ...empty, other: notes };
    }
    // Defensive: if it's not a plain object, fall back
    if(typeof notes !== "object") return { ...empty };

    const out = { ...empty };

    // helper to append (keeps existing content)
    const append = (key, text, prefix=null) => {
      const t = String(text||"").trim();
      if(!t) return;
      const add = prefix ? `${prefix}\n${t}` : t;
      out[key] = out[key] ? (out[key].trim() + "\n\n" + add) : add;
    };

    // map legacy keys -> current tabs
    const mapKey = (rawKey) => {
      const k = String(rawKey||"").trim().toLowerCase();
      if(!k) return null;
      if(k === "important" || k === "imp" || k === "urgent") return "important";
      if(k === "medical" || k === "health" || k === "med" || k === "meds" || k === "allergy" || k === "allergies") return "other";
      if(k === "work" || k === "job") return "work";
      if(k === "projects" || k === "project" || k === "proj") return "work"; // merged into Work & Projects
      if(k === "media" || k === "music" || k === "movies" || k === "movie" || k === "shows" || k === "show" || k === "series" || k === "games" || k === "game") return "media";
      if(k === "food" || k === "foods" || k === "meal" || k === "meals") return "food";
      if(k === "other" || k === "others" || k === "misc" || k === "miscellaneous") return "other";
      return null;
    };

    // If the object already matches current schema, prefer it
    for(const k of NOTES_CATS){
      if(typeof notes[k] === "string") out[k] = notes[k];
    }

    // Merge any legacy keys that are present but not in current schema
    for(const [rawKey, val] of Object.entries(notes)){
      if(typeof val !== "string") continue;
      const mapped = mapKey(rawKey);
      if(!mapped) {
        // unknown category: keep it under Other with a header so nothing is lost
        append("other", val, `— ${rawKey} —`);
        continue;
      }
      // If it's a legacy key different from current or the target is empty, merge safely
      if(!(rawKey in out) || !out[mapped]){
        append(mapped, val);
      }else if(rawKey.toLowerCase() !== mapped){
        // if both exist, append legacy into target
        append(mapped, val, `— ${rawKey} —`);
      }
    }

    return out;
  }

  // ==============================
  // Cycle Tracker (local-only, per person)
  // Data shape:
  // entry.cycle = { periods:[{start:"YYYY-MM-DD", end:"YYYY-MM-DD"}], cycleLength:28, periodLength:5 }
  // ==============================
  function clampInt(n, lo, hi, fallback){
    const x = Number(n);
    if(!Number.isFinite(x)) return fallback;
    const r = Math.round(x);
    return Math.min(hi, Math.max(lo, r));
  }
  function isValidFullDate(ymd){
    const p = parseDateYMD(ymd);
    return !!(p && p.hasYear && p.year >= 1900 && p.year <= 2100 && p.month >= 1 && p.month <= 12 && p.day >= 1 && p.day <= 31);
  }
  function ymdToUTCDate(ymd){
    const p = parseDateYMD(ymd);
    if(!p || !p.hasYear) return null;
    const d = new Date(Date.UTC(p.year, p.month-1, p.day));
    return Number.isNaN(d.getTime()) ? null : d;
  }
  function utcDateToYMD(d){
    const y = d.getUTCFullYear();
    const m = String(d.getUTCMonth()+1).padStart(2,"0");
    const day = String(d.getUTCDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function addDaysYMD(ymd, days){
    const d = ymdToUTCDate(ymd);
    if(!d) return "";
    d.setUTCDate(d.getUTCDate() + Number(days||0));
    return utcDateToYMD(d);
  }
  function diffDaysYMD(a, b){
    const da = ymdToUTCDate(a), db = ymdToUTCDate(b);
    if(!da || !db) return NaN;
    return Math.round((db.getTime() - da.getTime()) / 86400000);
  }
  function todayYMDUTC(){
    const now = new Date();
    const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
    return utcDateToYMD(d);
  }

  function cycleAverages(periods){
    // periods: [{start,end}] with valid YMD
    const starts = periods
      .map(p=>p.start)
      .filter(isValidFullDate)
      .map(s=>ymdToUTCDate(s))
      .filter(Boolean)
      .sort((a,b)=>a.getTime()-b.getTime());
    const diffs = [];
    for(let i=1;i<starts.length;i++){
      const dd = Math.round((starts[i].getTime() - starts[i-1].getTime())/86400000);
      if(dd>=15 && dd<=60) diffs.push(dd);
    }
    const avgCycle = diffs.length ? Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length) : null;

    const lens = periods.map(p=>{
      const s=p.start, e=p.end || p.start;
      if(!isValidFullDate(s) || !isValidFullDate(e)) return null;
      const l = diffDaysYMD(s,e) + 1;
      if(l>=1 && l<=15) return l;
      return null;
    }).filter(v=>Number.isFinite(v));
    const avgPeriod = lens.length ? Math.round(lens.reduce((a,b)=>a+b,0)/lens.length) : null;

    return { avgCycle, avgPeriod };
  }

  function normalizeCycle(cycle){
    const out = { periods: [], cycleLength: 28, periodLength: 5 };
    if(!cycle || typeof cycle !== "object") return { ...out };

    // periods
    const raw = Array.isArray(cycle.periods) ? cycle.periods : [];
    const cleaned = [];
    for(const p of raw){
      if(!p || typeof p !== "object") continue;
      let start = String(p.start||"").trim();
      const e0 = String(p.end||"").trim();
      if(!isValidFullDate(start)) continue;

      // If end is missing, infer it from the stored periodLength (fallback 5)
      const plHint = clampInt(cycle.periodLength, 1, 15, 5);
      let end = isValidFullDate(e0) ? e0 : (addDaysYMD(start, Math.max(0, plHint - 1)) || start);

      // normalize order (in case swapped)
      if(diffDaysYMD(start, end) < 0){
        const tmp = end; end = start; start = tmp;
      }
      cleaned.push({ start: start, end: end });
    }

    // sort newest first + de-dup
    cleaned.sort((a,b)=> (ymdToUTCDate(b.start)?.getTime()||0) - (ymdToUTCDate(a.start)?.getTime()||0));
    const uniq = [];
    const seen = new Set();
    for(const p of cleaned){
      const k = `${p.start}|${p.end}`;
      if(seen.has(k)) continue;
      seen.add(k);
      uniq.push(p);
      if(uniq.length>=36) break;
    }
    out.periods = uniq;

    const avgs = cycleAverages(out.periods);

    // cycle length / period length
    const cl = clampInt(cycle.cycleLength, 15, 60, avgs.avgCycle ?? 28);
    const pl = clampInt(cycle.periodLength, 1, 15, avgs.avgPeriod ?? 5);

    out.cycleLength = cl;
    out.periodLength = pl;

    return out;
  }

  function computeCycleInfo(cycle){
    const c = normalizeCycle(cycle);
    if(!c.periods.length) return null;

    const last = c.periods[0];
    const lastStart = last.start;
    const lastEnd = last.end || last.start;

    const nextStart = addDaysYMD(lastStart, c.cycleLength);
    const nextEnd = addDaysYMD(nextStart, Math.max(0, c.periodLength-1));

    // Classic estimate: ovulation ≈ cycleLength - 14 (luteal phase ≈ 14 days)
    const ovu = addDaysYMD(lastStart, Math.max(0, c.cycleLength - 14));
    const fertStart = addDaysYMD(ovu, -5);
    const fertEnd = addDaysYMD(ovu, 1);

    const today = todayYMDUTC();
    const daysToNext = Number.isFinite(diffDaysYMD(today, nextStart)) ? diffDaysYMD(today, nextStart) : null;

    return {
      cycle: c,
      lastStart, lastEnd,
      nextStart, nextEnd,
      ovulation: ovu,
      fertileStart: fertStart,
      fertileEnd: fertEnd,
      daysToNext
    };
  }

  function fmtRangeYMD(a, b){
    if(!a) return "—";
    if(!b || a===b) return fmtDate(a);
    return `${fmtDate(a)} – ${fmtDate(b)}`;
  }

  function cyclePopupLineHTML(cycle){
    if(notesHidden) return "";
    const info = computeCycleInfo(cycle);
    if(!info) return "";
    const dn = (info.daysToNext===null) ? "" : (info.daysToNext<0 ? " (overdue?)" : ` (in ${info.daysToNext}d)`);
    return `<div class="pline"><b>🩸 Next:</b> ${escapeHTML(fmtDate(info.nextStart))}${dn} · <b>🌿 Fertile:</b> ${escapeHTML(fmtDate(info.fertileStart))}–${escapeHTML(fmtDate(info.fertileEnd))} ⭐ ${escapeHTML(fmtDate(info.ovulation))}</div>`;
  }

  function cycleCardHTML(cycle){

          Avg cycle: ${info.cycle.cycleLength}d · Period: ${info.cycle.periodLength}d

      cycleViewMonth = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), 1));

    const monthForLabel = new Date(Date.UTC(cycleViewMonth.getUTCFullYear(), cycleViewMonth.getUTCMonth(), 1));

  function isWithin(ymd, a, b){
    if(!ymd || !a || !b) return false;
    const x = diffDaysYMD(a, ymd);
    const y = diffDaysYMD(ymd, b);
    return Number.isFinite(x) && Number.isFinite(y) && x>=0 && y>=0;
  }

  function renderCycleCalendar(info){
    const cal = $("cycleCal");
    if(!cal || !cycleViewMonth) return;

    const y = cycleViewMonth.getUTCFullYear();
    const m = cycleViewMonth.getUTCMonth(); // 0-based
    const first = new Date(Date.UTC(y, m, 1));
    const last = new Date(Date.UTC(y, m+1, 0));
    const daysInMonth = last.getUTCDate();

    // Monday-first: 0..6
    const dow = (first.getUTCDay() + 6) % 7;
    const prevLast = new Date(Date.UTC(y, m, 0));
    const prevDays = prevLast.getUTCDate();

    const today = todayYMDUTC();
    const periods = normalizeCycle(formCycle).periods;

    const cells = [];

    // leading (prev month)
    for(let i=0;i<dow;i++){
      const dayNum = prevDays - (dow - 1 - i);
      const d = new Date(Date.UTC(y, m-1, dayNum));
      const ymd = utcDateToYMD(d);
      cells.push({ ymd, day: dayNum, off:true });
    }
    // current month
    for(let day=1; day<=daysInMonth; day++){
      const d = new Date(Date.UTC(y, m, day));
      const ymd = utcDateToYMD(d);
      cells.push({ ymd, day, off:false });
    }
    // trailing (next month) to fill 6 rows (42 cells)
    while(cells.length < 42){
      const day = cells.length - (dow + daysInMonth) + 1;
      const d = new Date(Date.UTC(y, m+1, day));
      const ymd = utcDateToYMD(d);
      cells.push({ ymd, day, off:true });
    }

    const html = cells.map(c=>{
      const cls = [];
      if(c.off) cls.push("off");
      if(c.ymd === today) cls.push("today");

      // Selected range (from inputs/clicks)
      const s = ($("cycleStart")?.value || "").trim();
      const e0 = ($("cycleEnd")?.value || "").trim();
      let e = isValidFullDate(e0) ? e0 : "";
      if(!e && isValidFullDate(s)){
        // If no end date is provided, preview a range based on "Period length (days)"
        const pl = normalizeCycle(formCycle).periodLength || 5;
        e = addDaysYMD(s, Math.max(0, pl - 1)) || s;
      }
      if(isValidFullDate(s) && isValidFullDate(e) && isWithin(c.ymd, s, e)) cls.push("sel");

      // Recorded periods
      let inRecorded = false;
      for(const p of periods){
        if(isWithin(c.ymd, p.start, p.end || p.start)){ inRecorded = true; break; }
      }
      if(inRecorded) cls.push("period");

      // Predictions
      if(info){
        if(isWithin(c.ymd, info.nextStart, info.nextEnd) && !inRecorded) cls.push("pred");
        if(isWithin(c.ymd, info.fertileStart, info.fertileEnd)) cls.push("fert");
        if(c.ymd === info.ovulation) cls.push("ov");
      }

      return `<div class="cDay ${cls.join(" ")}" data-ymd="${c.ymd}" title="${c.ymd}">${c.day}</div>`;
    }).join("");

    cal.innerHTML = html;
  }

  (function initCycleTrackerUI(){

    const clearBtn = $("cycleClearBtn");
    const prevBtn = $("cyclePrev");
    const nextBtn = $("cycleNext");
    const startEl = $("cycleStart");
    const endEl = $("cycleEnd");
    const lenEl = $("cycleLen");

        if(!btn) return;
        if(btn.getAttribute("data-notes-tab")==="cycle"){
          setTimeout(()=>updateCycleUI(), 0);
        }
      });
