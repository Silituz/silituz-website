    // Calendar click = pick start/end
    if(cal){
      cal.addEventListener("click", (ev)=>{
        const cell = ev.target.closest("[data-ymd]");
        if(!cell) return;
        const ymd = cell.getAttribute("data-ymd");
        if(!isValidFullDate(ymd)) return;

        if(!cyclePick.start || (cyclePick.start && cyclePick.end)){
          cyclePick = { start: ymd, end: "" };
        }else{
          cyclePick.end = ymd;
          // normalize order
          if(diffDaysYMD(cyclePick.start, cyclePick.end) < 0){
            const tmp = cyclePick.end; cyclePick.end = cyclePick.start; cyclePick.start = tmp;
          }
        }

        if(startEl) startEl.value = cyclePick.start || "";
        if(endEl) endEl.value = cyclePick.end || "";
        updateCycleUI();
        try{ markDirty(); }catch{}
      });
    }

    // Remove chip
    if(list){
      list.addEventListener("click", (ev)=>{
        const x = ev.target.closest("[data-del]");
        if(!x) return;
        const key = x.getAttribute("data-del") || "";
        const [s,e] = key.split("|");
        formCycle.periods = (formCycle.periods||[]).filter(p=>!(p.start===s && p.end===e));
        formCycle = normalizeCycle(formCycle);
        updateCycleUI();
        try{ markDirty(); }catch{}
      });
    }

    // Add range
    if(addBtn){
      addBtn.addEventListener("click", ()=>{
        let start = (startEl?.value||"").trim();
        const e0 = (endEl?.value||"").trim();
        if(!isValidFullDate(start)){
          toast("Pick a valid start date");
          return;
        }

        // If no end date is provided, auto-create a range using "Period length (days)"
        const pl = normalizeCycle(formCycle).periodLength || 5;
        let end = isValidFullDate(e0) ? e0 : (addDaysYMD(start, Math.max(0, pl - 1)) || start);

        // normalize order (in case user manually reversed)
        if(diffDaysYMD(start, end) < 0){
          const tmp = end; end = start; start = tmp;
        }

        formCycle.periods = Array.isArray(formCycle.periods) ? formCycle.periods.slice() : [];
        // de-dup same range
        formCycle.periods = formCycle.periods.filter(p=>!(p.start===start && (p.end||p.start)===end));
        formCycle.periods.push({ start:start, end:end });
        formCycle = normalizeCycle(formCycle);

        // keep numbers in sync
        if(lenEl) lenEl.value = String(formCycle.cycleLength);
        if(perEl) perEl.value = String(formCycle.periodLength);

        // reset pick
        cyclePick = { start:"", end:"" };
        if(startEl) startEl.value = "";
        if(endEl) endEl.value = "";

        updateCycleUI();
        try{ markDirty(); }catch{}
        toast("Period saved ✅");
      });
    }

    // Clear
    if(clearBtn){
      clearBtn.addEventListener("click", ()=>{
        const ok = confirm("Clear all cycle data for this person?");
        if(!ok) return;
        clearCycleForm();
        try{ markDirty(); }catch{}
        toast("Cycle cleared");
      });
    }

    // Length changes
    const onNums = ()=>{
      readCycleNumsIntoState();
      formCycle = normalizeCycle(formCycle);
      updateCycleUI();
      try{ markDirty(); }catch{}
    };
    if(lenEl) lenEl.addEventListener("change", onNums);
    if(perEl) perEl.addEventListener("change", onNums);

    // Prev/Next month
    if(prevBtn){
      prevBtn.addEventListener("click", ()=>{
        if(!cycleViewMonth) return;
        cycleViewMonth = new Date(Date.UTC(cycleViewMonth.getUTCFullYear(), cycleViewMonth.getUTCMonth()-1, 1));
        updateCycleUI();
      });
    }
    if(nextBtn){
      nextBtn.addEventListener("click", ()=>{
        if(!cycleViewMonth) return;
        cycleViewMonth = new Date(Date.UTC(cycleViewMonth.getUTCFullYear(), cycleViewMonth.getUTCMonth()+1, 1));
        updateCycleUI();
      });
    }

    // initial (for new entry)
    setCycleToForm(null);
  })();

  let formFavColors = [];
  function normalizeColorInput(s){
    return String(s||"").trim().slice(0, 40);
  }

  function normalizeTagsInput(raw){
    const s = String(raw||"").trim();
    if(!s) return [];
    // split by comma, semicolon, or newline
    const parts = s.split(/[,;\n]/g).map(t=>String(t||"").trim()).filter(Boolean);
    // keep order, dedupe (case-insensitive)
    const seen = new Set();
    const out = [];
    for(const p of parts){
      const clean = p.replace(/^#/, "").trim().slice(0, 24);
      if(!clean) continue;
      const key = clean.toLowerCase();
      if(seen.has(key)) continue;
      seen.add(key);
      out.push(clean);
      if(out.length >= 12) break;
    }
    return out;
  }


  function resolveToRGB(colorStr){
    // returns [r,g,b] or null
    const test = document.createElement("span");
    test.style.color = "rgb(0,0,0)";
    test.style.color = colorStr;
    document.body.appendChild(test);
    const cs = getComputedStyle(test).color;
    document.body.removeChild(test);
    const m = cs.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
    if(!m) return null;
    return [Number(m[1]), Number(m[2]), Number(m[3])];
  }

  function glassVarsForRGB(rgb){
    const [r,g,b] = rgb;
    const lumin = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
    // dark colors: a bit more tint, less glow
    const a = lumin < 0.22 ? 0.34 : (lumin > 0.75 ? 0.36 : 0.42);
    const glow = lumin < 0.22 ? 0.55 : 0.95;
    return { a, glow };
  }

  
  function colorPillHTML(label){
    const rgb = resolveToRGB(label) || [95,140,255];
    const { a, glow } = glassVarsForRGB(rgb);
    const display = prettifyColorTokenName(label) || String(label||"");
    const safe = escapeHTML(display);
    return `<span class="colorPillGlass" style="--c:${rgb[0]},${rgb[1]},${rgb[2]};--a:${a};--g:${glow};">${safe}<span class="drops"></span></span>`;
  }

  // ==============================
  // Eye Color (NEW) — glass "eyes" with mix modes
  // ==============================
  let formEye = null;

  function eyeModeLabel(mode){
    switch(String(mode||"").toLowerCase()){
      case "solid": return "Solid";
      case "blend": return "Blend";
      case "split": return "Split";
      case "speckle": return "Speckled";
      case "ring": return "Ring";
      default: return String(mode||"");
    }
  }

  function normalizeHexColor(s){
    const raw = String(s||"").trim().toLowerCase();
    if(!raw.startsWith("#")) return "";
    let h = raw.slice(1);
    if(h.length === 3) h = h.split("").map(ch=>ch+ch).join("");
    if(!/^[0-9a-f]{6}$/.test(h)) return "";
    return "#"+h;
  }

  function rgbToHsl(r,g,b){
    r/=255; g/=255; b/=255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    let h=0, s=0;
    const l = (max+min)/2;
    const d = max-min;
    if(d !== 0){
      s = d / (1 - Math.abs(2*l - 1));
      switch(max){
        case r: h = ((g-b)/d) % 6; break;
        case g: h = (b-r)/d + 2; break;
        case b: h = (r-g)/d + 4; break;
      }
      h *= 60;
      if(h < 0) h += 360;
    }
    return { h, s, l };
  }

  function hexToRGB(hex){
    const h = normalizeHexColor(hex);
    if(!h) return null;
    const n = parseInt(h.slice(1), 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  // Friendly naming aliases are declared near the top of this <script> (EYE_HEX_NAME_ALIASES / EYE_NAME_HEX_ALIASES)

  function prettifyColorTokenName(raw){
    const s = String(raw||"").trim();
    if(!s) return "";
    // If it looks like a hex, name it via hexNaming
    const hx = normalizeHexColor(s);
    if(hx) return hexToNiceName(hx);
    // Turn "lightblue" / "deep-sky-blue" / "LightBlue" into "Light Blue"
    const spaced = s
      .replace(/[_-]+/g, " ")
      .replace(/([a-z])([A-Z])/g, "$1 $2")
      .replace(/\s+/g, " ")
      .trim();
    // Title-case words but keep small words readable
    return spaced.split(" ").map(w=>{
      const lw = w.toLowerCase();
      if(!lw) return w;
      return lw[0].toUpperCase() + lw.slice(1);
    }).join(" ");
  }

  function hexToNiceName(hex){
    const hx = normalizeHexColor(hex);
    if(!hx) return "";
    const alias = (typeof EYE_HEX_NAME_ALIASES !== "undefined" && EYE_HEX_NAME_ALIASES) ? (EYE_HEX_NAME_ALIASES[hx] || "") : "";
    if(alias) return alias;

    // If we have a larger name list loaded, prefer its nearest match.
    const dbName = nearestNameFromDB(hx);
    if(dbName) return dbName;

    // Lazy-load the big name list (optional). Fallback naming below still works offline.
    try{ ensureColorNameDB(); }catch{}

    const rgb = hexToRGB(hx);
    if(!rgb) return hx;
    const {h,s,l} = rgbToHsl(rgb[0], rgb[1], rgb[2]);

    // grayscale
    if(s < 0.10){
      if(l > 0.94) return "White";
      if(l < 0.06) return "Black";
      if(l > 0.78) return "Light Gray";
      if(l < 0.30) return "Dark Gray";
      return "Gray";
    }

    // detect brown-ish (common for eyes)
    const isBrown = (h >= 10 && h <= 55) && l < 0.55 && s < 0.70;
    let base;
    if(isBrown){
      base = "Brown";
    }else if(h < 15 || h >= 345) base = "Red";
    else if(h < 35) base = "Orange";
    else if(h < 55) base = "Amber";
    else if(h < 75) base = "Yellow";
    else if(h < 105) base = "Lime";
    else if(h < 150) base = "Green";
    else if(h < 175) base = "Teal";
    else if(h < 200) base = "Cyan";
    else if(h < 220) base = "Sky Blue";
    else if(h < 250) base = "Blue";
    else if(h < 275) base = "Indigo";
    else if(h < 295) base = "Violet";
    else if(h < 320) base = "Purple";
    else base = "Pink";

    // Lightness prefix
    let lp = "";
    if(l < 0.18) lp = "Deep";
    else if(l < 0.30) lp = "Dark";
    else if(l > 0.82) lp = "Pale";
    else if(l > 0.66) lp = "Light";

    // Saturation modifier
    let sp = "";
    if(s < 0.28) sp = "Soft";
    else if(s > 0.78) sp = "Vivid";

    const parts = [];
    if(sp) parts.push(sp);
    if(lp) parts.push(lp);
    parts.push(base);

    // compact a bit (avoid awkward combos)
    const name = parts.join(" ").replace(/\s+/g," ").trim();
    return name || base || hx;
  }

  function parseColorToken(raw, prevHex="", prevName=""){
    const s = String(raw||"").trim();
    if(!s) return null;

    // If the user didn't change the visible name, keep the previously stored hex exactly.
    if(prevHex && prevName && s === prevName) return { value: prevHex, name: prevName, fromPrev:true };

    const hx = normalizeHexColor(s);
    if(hx){
      return { value: hx, name: hexToNiceName(hx), fromHex:true };
    }

    // normalize key for alias lookup (spaces + hyphens ignored)
    const key = s.toLowerCase().replace(/[_-]+/g," ").replace(/\s+/g," ").trim();
    const keyCompact = key.replace(/\s+/g,"");

    // explicit eye-name aliases
    const aliHex = EYE_NAME_HEX_ALIASES[key] || EYE_NAME_HEX_ALIASES[keyCompact];
    if(aliHex){
      const h2 = normalizeHexColor(aliHex) || aliHex;
      return { value: h2, name: (EYE_HEX_NAME_ALIASES[h2] || prettifyColorTokenName(key)), fromName:true };
    }

    // CSS named / rgb() / hsl() etc: keep as-is for rendering
    // Also accepts spaced versions like "Light Sky Blue" by trying a compact token.
    if(document.body){
      const compact = s.replace(/\s+/g, "");
      const rgb1 = resolveToRGB(s);
      const rgb2 = (!rgb1 && compact !== s) ? resolveToRGB(compact) : null;
      const rgb = rgb1 || rgb2;
      if(rgb){
        const value = rgb1 ? s : compact;
        return { value, name: prettifyColorTokenName(s), fromCSS:true };
      }
    }

    // Fallback: store raw (won't colorize if invalid, but keeps data)
    return { value: s.slice(0,40), name: prettifyColorTokenName(s.slice(0,40)), fromRaw:true };
  }

  function normalizeEye(eye){
    if(!eye) return null;

    // legacy: plain string
    if(typeof eye === "string"){
      const tok = parseColorToken(eye);
      return tok ? { a: tok.value, aName: tok.name, b:"", bName:"", mode:"solid" } : null;
    }
    if(typeof eye !== "object") return null;

    // accept multiple shapes / legacy keys
    const rawA = (eye.a ?? eye.primary ?? eye.base ?? "");
    const rawB = (eye.b ?? eye.secondary ?? eye.mix ?? "");
    const givenAName = String(eye.aName ?? eye.an ?? eye.primaryName ?? "").trim();
    const givenBName = String(eye.bName ?? eye.bn ?? eye.secondaryName ?? "").trim();

    const aTok = parseColorToken(rawA, normalizeHexColor(eye.aHex||""), givenAName) || null;
    const bTok = parseColorToken(rawB, normalizeHexColor(eye.bHex||""), givenBName) || null;

    const a = normalizeColorInput((aTok && aTok.value) ? aTok.value : rawA);
    const b = normalizeColorInput((bTok && bTok.value) ? bTok.value : rawB);

    const aName = normalizeColorInput(givenAName || (aTok ? aTok.name : prettifyColorTokenName(a)));
    const bName = normalizeColorInput(givenBName || (bTok ? bTok.name : prettifyColorTokenName(b)));

    let mode = String(eye.mode ?? eye.pattern ?? "solid").trim().toLowerCase();
    const allowed = { solid:1, blend:1, split:1, speckle:1, ring:1 };
    if(!allowed[mode]) mode = "solid";

    // If a 2nd color is provided but mode stayed "solid", assume blend.
    if(b && mode === "solid") mode = "blend";

    if(!a) return null;
    return { a, aName, b, bName, mode };
  }

  function eyeLabel(eye){
    const e = normalizeEye(eye);

    const aTxt = e.aName || e.a;
    if(!e.b) return aTxt;
    const bTxt = e.bName || e.b;
    const suffix = (e.mode && e.mode !== "blend") ? ` (${eyeModeLabel(e.mode)})` : "";

  }

  function eyeShortLabel(eye){
    const e = normalizeEye(eye);

    const bTxt = e.bName || e.b;

    return `${base}·${eyeModeLabel(e.mode)}`;
  }
function eyePillHTML(eye, { tiny=false, showText=true }={}){

        const oy = (st.overflowY || "");
        if((oy === "auto" || oy === "scroll") && p.scrollHeight > p.clientHeight + 4){

    }

      const r = activeBtn.getBoundingClientRect();

      tabsEl.style.setProperty("--ind-left", `${left}px`);

      __notesScrollMemory.set(`${widget.getAttribute("data-notes-widget")||"widget"}|${prevTab}`, scrollParent.scrollTop || 0);
    }catch{}

    const prevBtn = widget.querySelector(`.tabBtn[data-notes-tab="${CSS.escape(prevTab)}"]`);
    const prevIdx = Number(prevBtn?.getAttribute("data-notes-idx") ?? "0");
    const nextIdx = Number(btn.getAttribute("data-notes-idx") ?? "0");
    const dir = (nextIdx >= prevIdx) ? 1 : -1;
    widget.style.setProperty("--tab-dir", String(dir));

    widget.querySelectorAll("[data-notes-tab]").forEach(b=>b.classList.toggle("active", b===btn));

    const fromPanel = widget.querySelector(`.notesPanelBox[data-notes-panel="${CSS.escape(prevTab)}"]`);
    const toPanel = widget.querySelector(`.notesPanelBox[data-notes-panel="${CSS.escape(nextTab)}"]`);

    if(!toPanel){
      widget.dataset.notesActive = nextTab;
      updateNotesIndicator(widget);
      return;
    }

    if(fromPanel){
      fromPanel.classList.remove("isActive");
      fromPanel.classList.add("isWasActive");
      fromPanel.setAttribute("aria-hidden","true");
    }

    toPanel.classList.add("isActive", "prepEnter");
    toPanel.setAttribute("aria-hidden","false");

    widget.classList.add("isSwitching");
    setNotesPanelsHeight(widget, nextTab);

    const saved = __notesScrollMemory.get(`${widget.getAttribute("data-notes-widget")||"widget"}|${nextTab}`);
    if(saved !== undefined){
      setTimeout(()=>{ try{ scrollParent.scrollTop = saved; }catch{} }, 0);
    }

    try{ toPanel.focus({preventScroll:true}); }catch{ try{ toPanel.focus(); }catch{} }
    updateNotesIndicator(widget);

    const reduced = prefersReducedMotion();
    if(!reduced){
      requestAnimationFrame(()=>{ toPanel.classList.remove("prepEnter"); });
      setTimeout(()=>{
        widget.classList.remove("isSwitching");
        if(fromPanel) fromPanel.classList.remove("isWasActive");
        widget.dataset.notesActive = nextTab;
        widget.querySelectorAll(".notesPanelBox").forEach(p=>{
          const isAct = (p === toPanel);
          p.classList.toggle("isActive", isAct);
          if(!isAct){
            p.classList.remove("prepEnter");
            p.classList.remove("isWasActive");
            p.setAttribute("aria-hidden","true");
          }else{
            p.setAttribute("aria-hidden","false");
          }
        });
      }, 220);
    }else{
      toPanel.classList.remove("prepEnter");
      widget.classList.remove("isSwitching");
      if(fromPanel) fromPanel.classList.remove("isWasActive");
      widget.dataset.notesActive = nextTab;
      setNotesPanelsHeight(widget, nextTab, true);
    }
  });

  function foldForMatch(v){
    return String(v||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }

  function entryAddressParts(e){
    const raw = String(e?.currentAddress || e?.birthplace || "");
    return raw.split(",").map(x=>foldForMatch(x)).filter(Boolean);
  }

  function entryHaystack(e){
    return [e?.currentAddress, e?.birthplace, e?.tz].map(foldForMatch).filter(Boolean).join(" | ");
  }

  function entryCountryMatchesForHoliday(e, cc){
    const code = String(cc||"").toUpperCase();
    if(!code) return false;
    const parts = entryAddressParts(e);
    const hay = entryHaystack(e);
    const labels = [countryLabel(code), ...(HOLIDAY_COUNTRY_ALIASES[code] || [])].map(foldForMatch).filter(Boolean);
    if(parts.includes(foldForMatch(code))) return true;
    if(labels.some(lbl=> parts.includes(lbl) || (lbl && hay.includes(lbl)))) return true;

    const tz = String(e?.tz || "").toLowerCase();
    if(code === "DE" && tz === "europe/berlin") return true;
    if(code === "AT" && tz === "europe/vienna") return true;
    if(code === "CH" && tz === "europe/zurich") return true;
    if(code === "JP" && tz === "asia/tokyo") return true;
    if(code === "KR" && tz === "asia/seoul") return true;
    if(code === "US" && tz.startsWith("america/")) return true;
    if(code === "CA" && tz.startsWith("america/")) return true;
    return false;
  }

  function entryRegionMatchesForHoliday(e, scope){
    const sc = String(scope||"").toUpperCase();
    if(!sc || !sc.includes("-")) return false;
    const parts = entryAddressParts(e);
    const hay = entryHaystack(e);
    const suffix = sc.split("-").slice(1).join("-");
    const labels = [regionLabel(sc), ...(HOLIDAY_SCOPE_ALIASES[sc] || [])].map(foldForMatch).filter(Boolean);
    if(parts.includes(foldForMatch(sc))) return true;
    if(suffix && parts.includes(foldForMatch(suffix))) return true;
    if(labels.some(lbl=> parts.includes(lbl) || (lbl && hay.includes(lbl)))) return true;
    return false;
  }

  function entryMatchesNextHolidayItem(e, h){
    if(!e || typeof e.lat !== "number" || typeof e.lon !== "number" || !h) return false;
    const cc = String(h.__cc || "").toUpperCase();
    const scope = String(h.__scope || cc || "").toUpperCase();
    const countryHit = entryCountryMatchesForHoliday(e, cc);
    if(scope && scope !== cc){
      if(entryRegionMatchesForHoliday(e, scope)) return true;
      if(!countryHit) return false;
      return entryRegionMatchesForHoliday(e, scope);
    }
    return countryHit;
  }

  async function computeHolidaySnapshotForMap({ preview=false } = {}){
    const settings = loadHolidaySettings();
    const selected = Array.isArray(settings.countries) ? settings.countries : [];
    if(!selected.length) return { empty:true, reason:"no_countries" };

    const selectedRegions = Array.isArray(settings.regions) ? settings.regions : [];
    const includeNationwide = settings.includeNationwide !== false;
    const typesState = (settings.types && typeof settings.types === "object") ? settings.types : null;

    const year = (new Date()).getFullYear();
    const years = preview ? [year, year + 1] : [year];
    const today = parseISODateLocal(todayISO());

    let all = [];
    for(const cc of selected){
      for(const y of years){
        try{
          const list = await getPublicHolidays(y, cc);
          for(const h of (Array.isArray(list) ? list : [])){
            all.push(Object.assign({}, h, { __cc: String(cc||"").toUpperCase() }));
          }
        }catch{}
      }
    }

    all = addExtraObservances(all, years, selected);

    let filtered = all.filter(h=>{
      if(!h || !h.date) return false;
      if(typesState && !matchesTypeFilter(h, typesState)) return false;
      if(!matchesRegionFilter(h, selectedRegions, includeNationwide)) return false;
      return true;
    });

    if(!preview){
      const todayStr = todayISO();
      const todays = expandHolidaysForDisplay(filtered.filter(h=> String(h.date) === todayStr), selectedRegions, includeNationwide);
      if(!todays.length) return { empty:true, reason:"none_today", date: todayStr, items: [] };
      return { empty:false, date: todayStr, items: todays, inDays: 0, isToday:true };
    }

    filtered = filtered.filter(h=>{
      try{ return parseISODateLocal(h.date) >= today; }catch{ return false; }
    }).sort((a,b)=>{
      if(a.date !== b.date) return String(a.date).localeCompare(String(b.date));
      const na = String(a.name || a.localName || "").toLowerCase();
      const nb = String(b.name || b.localName || "").toLowerCase();
      if(na !== nb) return na.localeCompare(nb);
      return String(a.__cc||"").localeCompare(String(b.__cc||""));
    });

    if(!filtered.length) return { empty:true, reason:"none" };

    const expanded = expandHolidaysForDisplay(filtered, selectedRegions, includeNationwide);
    if(!expanded.length) return { empty:true, reason:"none" };

    const nextDate = expanded[0]?.date || "";
    const items = nextDate ? expanded.filter(x=>x.date === nextDate) : [];
    if(!items.length) return { empty:true, reason:"none" };

    let inDays = null;
    try{
      const d1 = parseISODateLocal(nextDate);
      inDays = Math.max(0, daysBetweenDates(today, d1));
    }catch{}
    return { empty:false, date: nextDate, items, inDays, isToday: inDays === 0 };
  }

      const previewRes = await computeHolidaySnapshotForMap({ preview:true });

        ? {

      __mapHolidayNowCache = { inDays: null, date: todayISO(), items: [], isToday:false };

function solarPosition(date){
  // Approximate solar position (good for day/night visualization)
  const jd = toJulian(date);
  const n = jd - 2451545.0; // days since J2000.0
  const L = (280.46 + 0.9856474 * n) % 360; // mean longitude
  const g = (357.528 + 0.9856003 * n) % 360; // mean anomaly
  const gRad = g * Math.PI/180;
  const lambda = (L + 1.915*Math.sin(gRad) + 0.020*Math.sin(2*gRad)) * Math.PI/180; // ecliptic longitude
  const eps = (23.439 - 0.0000004 * n) * Math.PI/180; // obliquity
  const sinDelta = Math.sin(eps) * Math.sin(lambda);
  const delta = Math.asin(sinDelta); // declination

  // Right ascension
  const alpha = Math.atan2(Math.cos(eps)*Math.sin(lambda), Math.cos(lambda)); // radians

  // Greenwich Mean Sidereal Time (deg)
  const T = (jd - 2451545.0) / 36525.0;
  let GMST = 280.46061837 + 360.98564736629*(jd - 2451545.0) + 0.000387933*T*T - (T*T*T)/38710000.0;
  GMST = ((GMST % 360) + 360) % 360;

  // Subsolar lon: RA - GMST
  let lon = (alpha * 180/Math.PI) - GMST;
  lon = ((lon + 540) % 360) - 180; // normalize to [-180,180]
  const lat = delta * 180/Math.PI;

  return { lat, lon };
}

function nightPolygonLatLngs(date){
  const sun = solarPosition(date);
  const lat0 = sun.lat * Math.PI/180;
  const lon0 = sun.lon;

  const pts = [];

  // Special case near equinox (subsolar lat ~ 0): terminator is approximately a meridian
  if(Math.abs(Math.sin(lat0)) < 1e-6){
    const meridian = ((lon0 + 90 + 540) % 360) - 180;
    // Build a straight line from south to north at that longitude
    for(let lat=-89; lat<=89; lat+=2){
      pts.push([lat, meridian]);
    }
  }else{
    for(let lon=-180; lon<=180; lon+=2){
      const dLon = (lon - lon0) * Math.PI/180;
      const phi = Math.atan( -(Math.cos(dLon)) / Math.tan(lat0) ); // radians
      pts.push([phi * 180/Math.PI, lon]);
    }
  }

  // Determine which pole is in night
  // If dot(sunVector, northPoleNormal) < 0 => north pole is night
  const northDot = Math.sin(lat0); // sun vector dot with north pole normal
  const northPoleIsNight = northDot < 0;

  if(northPoleIsNight){
    // Night includes north pole
    return [[90, -180], [90, 180], ...pts.slice().reverse()];
  }else{
    // Night includes south pole
    return [[-90, -180], [-90, 180], ...pts];
  }
}

  // ==============================
  function getLocalSeconds(tz){
    if(!tz) return null;
    try{
      const dtf = new Intl.DateTimeFormat("en-US", {
        timeZone: tz,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });
      const parts = dtf.formatToParts(new Date());
      const h0 = Number(parts.find(p=>p.type==="hour")?.value);
      const m = Number(parts.find(p=>p.type==="minute")?.value);
      const s = Number(parts.find(p=>p.type==="second")?.value);
      const h = (h0 === 24 ? 0 : h0);
      if(!Number.isFinite(h) || !Number.isFinite(m) || !Number.isFinite(s)) return null;
      return h*3600 + m*60 + s;
    }catch{
      return null;
    }
  }

  function heartForTimezone(tz){
    const sec = getLocalSeconds(tz);
    if(sec === null) return "🤍";

    // ❤️ 02:00:00 – 05:59:59
    if(sec >= 2*3600 && sec <= 5*3600 + 59*60 + 59) return "❤️";

    // 💛 06:00:00 – 08:59:59
    if(sec >= 6*3600 && sec <= 8*3600 + 59*60 + 59) return "💛";

    // 💚 09:00:00 – 21:59:59
    if(sec >= 9*3600 && sec <= 21*3600 + 59*60 + 59) return "💚";

    // 💛 22:00:00 – 01:59:59 (wraps over midnight)
    if(sec >= 22*3600 || sec <= 1*3600 + 59*60 + 59) return "💛";

    return "🤍";
  }

  function joinShort(list, max=3){
    const a = Array.isArray(list) ? list.filter(Boolean) : [];
    if(a.length <= max) return a.join(", ");
    return a.slice(0,max).join(", ") + ` +${a.length-max}`;
  }

  function weekdayShort(iso){
    try{
      const d = parseISODateLocal(iso);
      return d.toLocaleDateString("de-DE", { weekday:"short" });
    }catch{
      return "";
    }
  }

  function dateLabelWithWeekday(iso){

  function todayISO(){
    const d = new Date();
    // build local YYYY-MM-DD
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const da = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${da}`;
  }

  function parseISODateLocal(iso){
    // iso = YYYY-MM-DD -> local date at midnight
    return new Date(iso + "T00:00:00");

  function loadHolidaySettings(){
    try{
      const raw = localStorage.getItem(LS_HOL_COUNTRIES);
      const ccRaw = raw ? JSON.parse(raw) : [];
      const cc = Array.isArray(ccRaw)
        ? Array.from(new Set(ccRaw.map(x=>String(x||"").toUpperCase()).filter(Boolean)))
        : [];
      const rawT = localStorage.getItem(LS_HOL_TYPES);
      const types = rawT ? JSON.parse(rawT) : null;

      const rawR = localStorage.getItem(LS_HOL_REGIONS);
      const regions = rawR ? JSON.parse(rawR) : [];

      const rawN = localStorage.getItem(LS_HOL_INC_NATIONWIDE);
      const includeNationwide = (rawN === null) ? true : (String(rawN) === "true");

      const rawS = localStorage.getItem(LS_HOL_SHOW);
      const showCount = rawS ? parseInt(rawS,10) : NaN;
      if(Number.isFinite(showCount) && showCount>0) __holidayShowCount = showCount;

      return {
        countries: Array.isArray(cc) ? cc : [],
        types: (types && typeof types==="object") ? types : null,
        regions: Array.isArray(regions) ? regions : [],
        includeNationwide
      };
    }catch{
      return { countries: [], types: null, regions: [], includeNationwide: true };
    }
  }
  function saveHolidaySettings(countries, types, regions, includeNationwide){
    try{
      localStorage.setItem(LS_HOL_COUNTRIES, JSON.stringify(countries||[]));
      if(types) localStorage.setItem(LS_HOL_TYPES, JSON.stringify(types));
      localStorage.setItem(LS_HOL_REGIONS, JSON.stringify(regions||[]));
      localStorage.setItem(LS_HOL_INC_NATIONWIDE, String(includeNationwide !== false));
      localStorage.setItem(LS_HOL_SHOW, String(__holidayShowCount));
    }catch{}
  }

  async function fetchJSON(url){
    const res = await fetch(url, { method:"GET" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }

  async function getAvailableCountries(){
    if(__availableCountries) return __availableCountries;
    const data = await fetchJSON(`${HOLIDAY_API}/AvailableCountries`);
    // normalize
    __availableCountries = (Array.isArray(data) ? data : []).map(x=>({
      countryCode: (x.countryCode||"").toUpperCase(),
      name: x.name || x.countryCode || "—"
    })).filter(x=>x.countryCode);
    // sort
    __availableCountries.sort((a,b)=>a.name.localeCompare(b.name));
    return __availableCountries;
  }

  async function getPublicHolidays(year, countryCode){
    const cc = (countryCode||"").toUpperCase();
    const key = `${year}|${cc}`;
    if(__holidayCache[key]) return __holidayCache[key];
    const data = await fetchJSON(`${HOLIDAY_API}/PublicHolidays/${year}/${cc}`);
    __holidayCache[key] = Array.isArray(data) ? data : [];
    return __holidayCache[key];
  }

  // Extra observances (non-public) that Nager.Date does not include for some countries.
  // Keep this list small + explicit to avoid wrong duplicates.
  const EXTRA_OBSERVANCES_BY_CC = {
    // United States: International Women's Day is widely observed, but not a federal/public holiday.
    "US": [
      { mmdd: "03-08", localName: "International Women's Day", name: "International Women's Day",
        types:["Observance"], global:true, fixed:true,
        __note:"Observed in the U.S., but not a federal/public holiday." }
    ],

    // Germany: celebrated broadly; public holiday only in Berlin.
    // We always surface a nationwide Observance entry so it also appears when a different state is selected.
    "DE": [
      { mmdd: "03-08", localName: "Internationaler Frauentag", name: "International Women's Day",
        types:["Observance"], global:true, fixed:true, forceIfRegional:true,
        __note:"Unofficial in most of Germany (Public holiday only in Berlin)." }
    ],

    // Russia: official public holiday.
    "RU": [
      { mmdd: "03-08", localName: "Международный женский день", name: "International Women's Day",
        types:["Public"], global:true, fixed:true }
    ]
  };

  function addExtraObservances(allList, years, selectedCountries){
    const out = Array.isArray(allList) ? allList : [];
    const yrs = Array.isArray(years) ? years.map(n=>Number(n)).filter(n=>Number.isFinite(n)) : [];
    const sels = Array.isArray(selectedCountries) ? selectedCountries.map(c=>String(c||"").toUpperCase()).filter(Boolean) : [];

    for(const cc of sels){
      const extras = EXTRA_OBSERVANCES_BY_CC[cc];
      if(!Array.isArray(extras) || !extras.length) continue;

      for(const y of yrs){
        for(const ex of extras){
          const date = `${y}-${ex.mmdd}`;

          // Avoid duplicates if something with the same (date + name/localName) already exists for this country.
          // BUT: if the existing holiday is regional-only (has counties) and the extra is meant to be nationwide,
          // allow adding the extra (e.g., DE Women's Day: Berlin is public, nationwide is observance).
          const exists = out.some(h=>{
            if(String(h.__cc||"").toUpperCase() !== cc) return false;
            if(h.date !== date) return false;

            const sameName = (String(h.name||"")===String(ex.name||"")) || (String(h.localName||"")===String(ex.localName||""));
            if(!sameName) return false;

            const hasCounties = Array.isArray(h.counties) && h.counties.length > 0;
            if(ex.forceIfRegional && hasCounties) return false; // treat as not existing -> add extra
            return true;
          });
          if(exists) continue;

          out.push(Object.assign({
            date,
            localName: ex.localName,
            name: ex.name,
            types: ex.types || ["Observance"],
            global: !!ex.global,
            fixed: !!ex.fixed,
            __cc: cc
          }, ex));
        }
      }
    }
    return out;
  }

  function buildRegionSuggestions(query){
    const box = $("calRegionSuggestions");
    if(!box) return;

    const q = (query||"").trim().toLowerCase();
    if(!__holidayRegionPool || !__holidayRegionPool.length){
      box.innerHTML = '<span class="hint">Select countries to load regions.</span>';
      return;
    }
    if(q.length < 1){
      box.innerHTML = '<span class="hint">Start typing to search regions/states.</span>';
      return;
    }

    const list = __holidayRegionPool.filter(r=>{
      return r.code.toLowerCase().includes(q) || (r.label||"").toLowerCase().includes(q);
    }).slice(0, 12);

    if(!list.length){
      box.innerHTML = '<span class="hint">No matches.</span>';
      return;
    }

    box.innerHTML = list.map(r=>{
      return `<button type="button" class="secondary" style="padding:6px 10px; margin:4px 6px 0 0;" data-reg="${escapeHTML(r.code)}" title="Add ${escapeHTML(r.label)}">${escapeHTML(r.label)} <span class="hint">(${escapeHTML(r.code)})</span></button>`;
    }).join("");

    box.querySelectorAll("button[data-reg]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const code = String(btn.getAttribute("data-reg")||"").toUpperCase();
        const s = loadHolidaySettings();
        const cur = (s.regions||[]).map(x=>String(x||"").toUpperCase()).filter(Boolean);
        if(!cur.includes(code)){

          refreshHolidays(false);
        }
        const inp = $("calRegionSearch");
        if(inp){ inp.value = ""; inp.focus(); }
        buildRegionSuggestions("");
      });
    });
  }

  // Build a lookup so we can mark holidays that occur in multiple selected countries
  function buildHolidayShareMap(list){
    const m = new Map(); // groupKey -> Set(countryCodes)
    for(const h of (Array.isArray(list)?list:[])){
      const k = groupKey(h);
      if(!m.has(k)) m.set(k, new Set());
      const cc = String(h.__cc || "").toUpperCase();
      if(cc) m.get(k).add(cc);

    return m;

  function flagEmojiFromCountryCode(cc){
    const c = String(cc||"").toUpperCase();
    if(c.length !== 2) return "🏳️";
    const a = c.charCodeAt(0);
    const b = c.charCodeAt(1);
    // Regional Indicator Symbols start at 0x1F1E6 ("A")
    return String.fromCodePoint(0x1F1E6 + (a - 65), 0x1F1E6 + (b - 65));
  }

  function holidayTitleParts(h){

  function slugifyId(s){
    return String(s||"")
      .toLowerCase()
      .replace(/['"]/g,"")
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-+|-+$/g,"")
      .slice(0, 60) || "x";
  }

  function cssEsc(s){
    try{ return CSS && CSS.escape ? CSS.escape(String(s)) : String(s).replace(/[^a-zA-Z0-9_-]/g, "\\$&"); }catch{
      return String(s).replace(/[^a-zA-Z0-9_-]/g, "\\$&");

  }

      let row = null;
      if(preferScope){
        row = day.querySelector(`.calHolidayRow[data-scope="${cssEsc(preferScope)}"]`);

    }
  }

  function renderDateGroupHTML(dateISO, items, shareMap=null, openFirst=false){
    const dateHTML = (dateISO && dateISO !== "—") ? datePillHTML(dateISO) : `<span class="pill">—</span>`;
    const list = Array.isArray(items) ? items : [];
    const out = list.map((h, idx)=>{
      const sharedCountries = shareMap ? Array.from(shareMap.get(groupKey(h))||[]).sort() : null;
      return renderHolidayItemHTML(h, openFirst && idx===0, sharedCountries);
    }).join("");

    const gid = (dateISO && dateISO !== "—") ? `calDay-${dateISO}` : "";
    const idAttr = gid ? ` id="${escapeHTML(gid)}"` : "";
    const dataAttr = (dateISO && dateISO !== "—") ? ` data-date="${escapeHTML(dateISO)}"` : "";

    return `<div class="calDayGroup"${idAttr}${dataAttr}>
      <div class="calDayHead">${dateHTML}</div>
      <div class="calDayItems">${out || '<span class="hint">—</span>'}</div>
    </div>`;

  // Expand holidays so each selected region (e.g. US-CA, DE-NI) becomes its own row.
  function expandHolidaysForDisplay(list, selectedRegions, includeNationwide){
    const regs = Array.isArray(selectedRegions) ? selectedRegions.map(x=>String(x||"").toUpperCase()).filter(Boolean) : [];
    const incNation = includeNationwide !== false;
    const out = [];
    const seen = new Set();

    for(const h of (Array.isArray(list)?list:[])){
      if(!h || !h.date) continue;
      const cc = String(h.__cc || "").toUpperCase();
      const selFor = regs.filter(r=> r.startsWith(cc + "-"));
      const counties = Array.isArray(h.counties) ? h.counties.map(c=>String(c||"").toUpperCase()) : [];

      let scopes = [];
      if(selFor.length){
        if(counties.length){
          scopes = selFor.filter(r=> counties.includes(r));
        }else{
          if(incNation) scopes = selFor.slice();
        }
      }else{
        scopes = [cc];
      }

      if(!scopes.length) continue;

      for(const sc of scopes){
        const key = `${h.date}|${cc}|${sc}|${String(h.localName||"")}|${String(h.name||"")}|${Array.isArray(h.types)?h.types.join(","):""}`;
        if(seen.has(key)) continue;
        seen.add(key);
        out.push(Object.assign({}, h, { __scope: sc }));
      }
    }

    out.sort((a,b)=>{
      if(a.date !== b.date) return String(a.date).localeCompare(String(b.date));
      const na = String(a.localName || a.name || "").toLowerCase();
      const nb = String(b.localName || b.name || "").toLowerCase();
      if(na !== nb) return na.localeCompare(nb);
      return String(a.__scope || a.__cc || "").localeCompare(String(b.__scope || b.__cc || ""));
    });

    return out;
  }

  function groupKey(h){

    const base = String((h.name || h.localName || "—")).trim().toLowerCase();
    return `${h.date || "—"}|${base}`;
  }

  function buildHolidayGroups(list){
    const map = new Map();
    for(const h of (Array.isArray(list)?list:[])){
      const key = groupKey(h);
      if(!map.has(key)){
        map.set(key, {
          key,
          date: h.date || "—",
          // prefer English/common name for grouping display
          name: (h.name || h.localName || "—"),
          items: []
        });
      }
      map.get(key).items.push(h);
    }
    const groups = Array.from(map.values());
    groups.forEach(g=> g.items.sort((a,b)=>(a.__cc||"").localeCompare(b.__cc||"")));
    groups.sort((a,b)=>{
      if(a.date !== b.date) return String(a.date).localeCompare(String(b.date));
      return String(a.name||"").localeCompare(String(b.name||""));
    });
    return groups;
  }

  function groupBadgesHTML(g){
    const items = g.items || [];
    if(items.length <= 1) return "";
    const countries = Array.from(new Set(items.map(x=>x.__cc).filter(Boolean)));

    const mixed = (items.some(x=>Array.isArray(x.counties)&&x.counties.length) && items.some(x=>!(Array.isArray(x.counties)&&x.counties.length)));
    const shared = `<span class="calBadge" title="Shared holiday across multiple selections">Shared · ${escapeHTML(String(items.length))}</span>`;
    const mixedB = mixed ? `<span class="tagMini" title="Some selections are nationwide, others regional">Mixed coverage</span>` : "";
    const cPill = countries.length ? `<span class="tagMini" title="${escapeHTML(countries.join(", "))}">Countries: ${escapeHTML(cTxt)}</span>` : "";
    return `${shared} ${mixedB} ${cPill}`;
  }

  async function buildSuggestions(query){
    const box = $("calSuggestions");
    if(!box) return;
    const q = (query||"").trim().toLowerCase();
    if(q.length < 1){
      box.innerHTML = '<span class="hint">Start typing to search countries.</span>';
      return;
    }
    let list = [];
    try{
      const all = await getAvailableCountries();
      list = all.filter(c=>{
        return c.name.toLowerCase().includes(q) || c.countryCode.toLowerCase().includes(q);
      }).slice(0, 10);
    }catch(err){
      box.innerHTML = '<span class="hint">Could not load countries. Check your connection.</span>';
      return;
    }

    if(!list.length){
      box.innerHTML = '<span class="hint">No matches.</span>';
      return;
    }
    box.innerHTML = list.map(c=>{
      return `<button type="button" class="secondary" style="padding:6px 10px; margin:4px 6px 0 0;" data-cc="${escapeHTML(c.countryCode)}" title="Add ${escapeHTML(c.name)}">${escapeHTML(c.name)} <span class="hint">(${escapeHTML(c.countryCode)})</span></button>`;
    }).join("");

    box.querySelectorAll("button[data-cc]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const cc = btn.getAttribute("data-cc");
        const s = loadHolidaySettings();
        const cur = s.countries || [];
        if(!cur.includes(cc)){
          const next = cur.concat([cc]);
          saveHolidaySettings(next, s.types || null, s.regions||[], s.includeNationwide);
          renderSelectedCountries();
          refreshHolidays(true);
        }
        const inp = $("calCountrySearch");
        if(inp){ inp.value = ""; inp.focus(); }
        buildSuggestions("");
    buildRegionSuggestions("");
    renderSelectedRegions();
      });
    });
  }

  async function refreshHolidays(resetShow){
    const nextBox = $("calNextHoliday");
    const listBox = $("calHolidayList");
    if(!nextBox || !listBox) return;

    if(resetShow){
      __holidayShowCount = 20;
      try{ localStorage.setItem(LS_HOL_SHOW, String(__holidayShowCount)); }catch{}
    }

    const settings = loadHolidaySettings();
    const selected = settings.countries || [];
    const typesState = settings.types || null;
    const selectedRegions = (settings.regions || []).map(x=>String(x||"").toUpperCase()).filter(Boolean);
    const includeNationwide = settings.includeNationwide !== false;

    renderSelectedCountries();

    if(!selected.length){
      nextBox.innerHTML = '<span class="hint">Select at least one country.</span>';
      listBox.innerHTML = '<span class="hint">No countries selected.</span>';
      __holidayRegionPool = [];
      renderTypeFilters([], typesState);
      renderSelectedRegions();
      buildRegionSuggestions("");
      return;
    }

    const today = parseISODateLocal(todayISO());
    const year = today.getFullYear();

    // load this year (and next year if needed)
    let all = [];
    try{
      for(const cc of selected){
        const a = await getPublicHolidays(year, cc);
        a.forEach(h=> all.push(Object.assign({}, h, { __cc: cc })));
      }
      // also prefetch next year so "Load more" can extend smoothly near year end
      for(const cc of selected){
        const b = await getPublicHolidays(year+1, cc);
        b.forEach(h=> all.push(Object.assign({}, h, { __cc: cc })));
      }

      // Add explicit non-public observances for selected countries (e.g., US International Women's Day)
      all = addExtraObservances(all, [year, year+1], selected);
    }catch(err){
      nextBox.innerHTML = '<span class="hint">Could not load holidays. Please try refresh.</span>';
      listBox.innerHTML = '<span class="hint">—</span>';
      return;
    }

    // gather known types
    const typeSet = new Set();
    all.forEach(h=>{
      (Array.isArray(h.types) ? h.types : []).forEach(t=> typeSet.add(t));
    });
    const knownTypes = Array.from(typeSet).sort((a,b)=>a.localeCompare(b));
    // gather known regions (ISO 3166-2 codes) from counties
    const regSet = new Set();
    all.forEach(h=>{
      (Array.isArray(h.counties) ? h.counties : []).forEach(c=>{
        const code = String(c||"").toUpperCase();
        if(code) regSet.add(code);
      });
    });
    __holidayRegionPool = Array.from(regSet).sort((a,b)=>a.localeCompare(b)).map(code=>({ code, label: `${code} · ${regionLabel(code)}` }));
    renderSelectedRegions();
    buildRegionSuggestions(($("calRegionSearch")?.value || ""));
    // set default type state if none stored: enable all by default
    let effTypes = typesState;
    if(!effTypes){
      effTypes = {};
      knownTypes.forEach(t=> effTypes[t] = true);
      saveHolidaySettings(selected, effTypes, settings.regions||[], settings.includeNationwide);
    }
    renderTypeFilters(knownTypes, effTypes);

    // filter and sort
    const filtered = all.filter(h=>{
      if(!h || !h.date) return false;
      const d = parseISODateLocal(h.date);
      if(d < today) return false;
      if(!matchesTypeFilter(h, effTypes)) return false;
      if(!matchesRegionFilter(h, selectedRegions, includeNationwide)) return false;
      return true;
    }).sort((a,b)=>{
      if(a.date !== b.date) return a.date.localeCompare(b.date);
      const na = String(a.name || a.localName || "").toLowerCase();
      const nb = String(b.name || b.localName || "").toLowerCase();
      if(na !== nb) return na.localeCompare(nb);
      return (a.__cc||"").localeCompare(b.__cc||"");
    });

    if(!filtered.length){
      nextBox.innerHTML = '<span class="hint">No upcoming holidays for current filters.</span>';
      listBox.innerHTML = '<span class="hint">—</span>';
      return;
    }

    const shareMap = buildHolidayShareMap(filtered);

    // Expand list so each selected region becomes its own row
    const expanded = expandHolidaysForDisplay(filtered, selectedRegions, includeNationwide);

    // Next holiday (global): earliest date, show ALL holidays on that date (not merged)
    const nextDate = expanded[0]?.date || "";
    const nextItems = nextDate ? expanded.filter(h=>h.date === nextDate) : [];
    nextBox.innerHTML = nextItems.length
      ? renderDateGroupHTML(nextDate, nextItems, shareMap, false)
      : '<span class="hint">No upcoming holidays for current filters.</span>';

    // Upcoming: everything AFTER the next date (keeps overview clean)
    const rest = nextDate ? expanded.filter(h=>h.date !== nextDate) : expanded.slice();
    const shown = rest.slice(0, __holidayShowCount);

    // Group shown items by date
    const byDate = new Map();
    for(const h of shown){
      const d = h.date || "—";
      if(!byDate.has(d)) byDate.set(d, []);
      byDate.get(d).push(h);
    }
    const dates = Array.from(byDate.keys()).sort((a,b)=> String(a).localeCompare(String(b)));

    listBox.innerHTML = dates.length
      ? dates.map(d=> renderDateGroupHTML(d, byDate.get(d) || [], shareMap, false)).join("")
      : '<span class="hint">—</span>';

    const moreBtn = $("calLoadMoreBtn");
    if(moreBtn){
      moreBtn.disabled = rest.length <= __holidayShowCount;
      const left = Math.max(0, rest.length - __holidayShowCount);
      moreBtn.textContent = moreBtn.disabled ? "No more" : `Load more (${left} left)`;
    }
  
    // If we arrived via Quick "Holiday" chip, scroll/highlight the next holiday entry.
    try{ applyHolidayFocusTarget(); }catch{}
  }

  function calcOverdueDays(lastContactISO, remindEveryDays){
    const r = Number(remindEveryDays || 0);
    if(!r || r <= 0) return 0;
    const p = parseDateYMD(lastContactISO);
    if(!p || !p.hasYear) return 0;
    const d = new Date(p.year, p.month-1, p.day);
    if(Number.isNaN(d.getTime())) return 0;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = Math.floor((today.getTime() - d.getTime()) / 86400000);
    return Math.max(0, diff - r);
  }

  function renderDashboard(){
    const row = document.getElementById("dashRow");
    if(!row) return;

    function nameKey(e){
      const nm = (displayNames(e)?.main || e.nickname || e.realName || "").toString().trim();
      return nm.toLowerCase();
    }
    const bdays = entries
      .map(e=>({ e, d: daysUntilNextBirthday(e.birthdate) }))
      .filter(x=>x.d !== null)
      .sort((a,b)=> (a.d - b.d) || nameKey(a.e).localeCompare(nameKey(b.e), undefined, {sensitivity:"base"}))
      .slice(0, 3);

    const fr = entries
      .map(e=>({ e, m: nextFriendshipMilestone(e.metOn) }))
      .filter(x=>x.m)
      .sort((a,b)=> (a.m.days - b.m.days) || nameKey(a.e).localeCompare(nameKey(b.e), undefined, {sensitivity:"base"}))
      .slice(0, 3);

    const overdue = entries
      .map(e=>({ e, od: calcOverdueDays(e.lastContact, e.remindEveryDays) }))
      .filter(x=>x.od > 0)
      .sort((a,b)=> (b.od - a.od) || nameKey(a.e).localeCompare(nameKey(b.e), undefined, {sensitivity:"base"}))
      .slice(0, 3);

    const cards = [];
    // Summary: Active tag filter

      });

    for(const x of bdays){
      const nm = displayNames(x.e)?.main || x.e.nickname || x.e.realName || "—";

      cards.push({
        id: x.e.id,
        k: "🎈 Friendship",
        badge: when,
        v: nm,
        sub: `Next: ${x.m.label}`
      });
    }

    for(const x of overdue){
      const nm = displayNames(x.e)?.main || x.e.nickname || x.e.realName || "—";
      cards.push({
        id: x.e.id,
        k: "⏰ Check‑in",

      });

    row.innerHTML = cards.map(c=>`
      <div class="dashCard" ${c.id?`data-id="${escapeHTML(c.id)}"`:""} ${c.action?`data-action="${escapeHTML(c.action)}"`:""}>
        <div class="dashK">
          <span>${escapeHTML(c.k)}</span>

        </div>
        <div class="dashV">${escapeHTML(String(c.v||"—"))}</div>
        ${c.sub?`<div class="dashSub">${escapeHTML(String(c.sub))}</div>`:""}
      </div>
    `).join("");

    if(!row.__dashBound){
      row.__dashBound = true;
      row.addEventListener("click", async (ev)=>{
        const card = ev.target.closest(".dashCard");
        if(!card) return;
        const act = card.getAttribute("data-action");

  function openCmdk(){

    const input = document.getElementById("cmdkInput");

  function closeCmdk(){
    const root = document.getElementById("cmdk");
    if(!root) return;
    root.classList.remove("open");
    root.setAttribute("aria-hidden", "true");

  function isCmdkOpen(){
    const root = document.getElementById("cmdk");

  function renderCmdk(query){
    const list = document.getElementById("cmdkList");
    if(!list) return;

    const q = String(query||"").trim().toLowerCase();

    const cmds = [
      { key:"map", title:"🗺️ Show Map", sub:"Switch right panel to Map", run: ()=>{ showMapView(); scrollRightCardIntoView(); } },
      { key:"card", title:"🪪 Show Card", sub:"Switch right panel to Card (selected person)", run: ()=>{ if(selectedId){ openProfileAndScrollTop(selectedId); } else { toast("Select a person first"); } } },
      { key:"privacy", title:"🔒 Toggle Privacy mode", sub:"Hide / show notes + private fields", run: async ()=>{ const nl = $("notesLock"); if(nl){ nl.checked = !nl.checked; nl.dispatchEvent(new Event("change")); } } },
      { key:"filters", title:"⋯ Open Advanced Filters", sub:"Smart filters + tags", run: ()=>{ openAdvancedFilters(true); } },
      { key:"clear", title:"🧹 Clear filters", sub:"Reset chips + advanced filters", run: ()=>{ syncFilterChipsToAll(); clearAdvancedFilters(); renderList(); renderDashboard(); } },
      { key:"export", title:"Export JSON", sub:"Download your data", run: ()=>{ exportJSON(); } },
      { key:"import", title:"Import JSON", sub:"Load data from a file", run: ()=>{ try{ openImportPicker(); }catch{ $("importFile")?.click(); } } },
      { key:"new", title:"New entry", sub:"Clear editor for a new person", run: ()=>{ guardedAction(clearForm); } },
    ];

    // Special parsing: "tag xxx"
    if(q.startsWith("tag ")){
      const t = q.slice(4).trim();
      const all = collectAllTags();
      const hit = all.find(x=>x.toLowerCase() === t) || all.find(x=>x.toLowerCase().includes(t));
      if(hit){
        setTagFilter([hit]);
        syncFilterChipsToAll();
        renderList();
        renderDashboard();
        closeCmdk();
        toast(`Tag filter: #${hit}`);
        return;
      }
    }

    const shownCmds = q ? cmds.filter(c=> (c.key.includes(q) || c.title.toLowerCase().includes(q) || c.sub.toLowerCase().includes(q))).slice(0,6) : cmds.slice(0,6);

    // People results
    const people = entries
      .map(e=>{
        const nm = displayNames(e)?.main || e.nickname || e.realName || "";
        const hay = [
          nm, e.nickname, e.realName,
          (Array.isArray(e.tags)? e.tags.join(" "):""),
          e.currentAddress, e.tz
        ].filter(Boolean).join(" ").toLowerCase();
        const ok = q ? hay.includes(q) : false;
        return { e, nm, ok };
      })
      .filter(x=> q ? x.ok : false)
      .sort((a,b)=> a.nm.toLowerCase().localeCompare(b.nm.toLowerCase(), undefined, {sensitivity:"base"}))
      .slice(0, 12);

    const htmlParts = [];

    if(shownCmds.length){
      htmlParts.push(`<div class="cmdkItem" style="cursor:default; opacity:.75"><div class="cmdkLeft"><div class="cmdkTitle">Commands</div><div class="cmdkSub">Type to search people or commands</div></div><div class="cmdkKbd">↵</div></div>`);
      for(const c of shownCmds){
        htmlParts.push(`
          <div class="cmdkItem" data-cmd="${escapeHTML(c.key)}">
            <div class="cmdkLeft">
              <div class="cmdkTitle">${escapeHTML(c.title)}</div>
              <div class="cmdkSub">${escapeHTML(c.sub)}</div>
            </div>
            <div class="cmdkKbd">Enter</div>
          </div>
        `);
      }
    }

    if(people.length){
      htmlParts.push(`<div class="cmdkItem" style="cursor:default; opacity:.75; margin-top:6px;"><div class="cmdkLeft"><div class="cmdkTitle">People</div><div class="cmdkSub">${escapeHTML(String(people.length))} match(es)</div></div><div class="cmdkKbd">↵</div></div>`);
      for(const p of people){
        const sub = (p.e.currentAddress || "").toString().trim();
        htmlParts.push(`
          <div class="cmdkItem" data-id="${escapeHTML(p.e.id)}">
            <div class="cmdkLeft">
              <div class="cmdkTitle">${escapeHTML(p.nm || "—")}</div>
              <div class="cmdkSub">${escapeHTML(sub || (p.e.tz||""))}</div>
            </div>
            <div class="cmdkKbd">Open</div>
          </div>
        `);
      }
    }

    if(!htmlParts.length){
      htmlParts.push(`<div class="cmdkItem" style="cursor:default; opacity:.75"><div class="cmdkLeft"><div class="cmdkTitle">No results</div><div class="cmdkSub">Try: export · privacy · tag juju</div></div><div class="cmdkKbd">Esc</div></div>`);
    }

    list.innerHTML = htmlParts.join("");

    // Bind click handler once via delegation
    if(!list.__cmdkBound){
      list.__cmdkBound = true;
      list.addEventListener("click", async (ev)=>{
        const it = ev.target.closest(".cmdkItem");
        if(!it) return;
        const cmd = it.getAttribute("data-cmd");
        const id = it.getAttribute("data-id");
        if(cmd){
          const c = cmds.find(x=>x.key === cmd);
          if(c){
            try{ await c.run(); }catch{ try{ c.run(); }catch{} }
            closeCmdk();
          }
          return;
        }
        if(id){
          try{
            const ok = await guardedSelectEntry(id, { panMap:false, toast:false });
            if(ok){
              openProfile(id);
              scrollRightCardIntoView();
            }
          }catch{
            try{ openProfileAndScrollTop(id); }catch{}
          }
          closeCmdk();
        }
      });
    }
  }

  function focusEntryOnMap(id, opts={}){
    const e = entries.find(x=>x.id===id);
    if(!e) return;
    const wasHidden = (()=>{
      try{ return getComputedStyle($("mapView")).display === "none"; }catch{ return $("mapView").style.display === "none"; }
    })();
    showMapView();

    if(!(typeof e.lat === "number" && typeof e.lon === "number")) return;

    const m = markerById.get(id);
    const latlng = L.latLng(e.lat, e.lon);

    // Zoom target: never zoom OUT (important when coming out of clusters)
    const minZoom = 8;
    const desiredZoom = 10;

    // Helper: open popup, then pan so the popup itself is centered in the visible map.
    function openAndCenterPopup(marker){
      if(!marker) return;
      try{ marker.openPopup(); }catch{}
    }

    function flyAndOpen(){
      // Smooth zoom/pan (never zoom OUT — especially after cluster reveal)
      let z = map.getZoom();
      // ensure a noticeable zoom-in from far out, but NEVER reduce current zoom
      z = Math.max(z, minZoom, desiredZoom);

      // Offset center upward so popup opens centered without later camera drift
      const size = map.getSize();
      const offsetY = Math.round(Math.min(200, Math.max(120, size.y * 0.22)));

      const p = map.project(latlng, z);
      const center = map.unproject(L.point(p.x, p.y - offsetY), z);

      map.flyTo(center, z, { animate:true, duration: 0.85, easeLinearity: 0.25 });

      // Open popup after movement finishes so it doesn't jump
      map.once("moveend", ()=>{
        if(m){ openAndCenterPopup(m); }
      });
    }

    // If marker is in cluster, reveal it first (this also may zoom in).
    const run = ()=>{
      // If marker is in cluster, reveal it first (this also may zoom in).
      if(m && clusteringEnabled && map.hasLayer(clusterLayer) && clusterLayer.zoomToShowLayer){
        clusterLayer.zoomToShowLayer(m, ()=>{
          // After it's visible, do a smooth fly to our preferred zoom (won't zoom out)
          flyAndOpen();
        });
      }else{
        flyAndOpen();
      }
    };

    // If we just switched from Profile->Map, give Leaflet a tick to settle sizes
    if(wasHidden) setTimeout(run, 90);
    else run();
  }

  let __formDirty = false;
  let __formFilling = false;

  function setFormDirty(v){
    __formDirty = !!v;
    const pill = $("saveStatePill");
    const undo = $("undoEditBtn");
    if(pill){
      pill.classList.toggle("dirty", __formDirty);
      pill.classList.toggle("saved", !__formDirty);
      pill.textContent = __formDirty ? "Unsaved…" : "Saved ✓";
    }
    if(undo) undo.hidden = !__formDirty;
  }

  function markDirty(){
    if(__formFilling) return;
    if(!__formDirty) setFormDirty(true);
  }

  function revertUnsaved(){
    if(!__formDirty) return;
    const id = selectedId;
    __formFilling = true;
    try{
      if(id && entries.some(x=>x.id===id)){
        selectEntry(id, { panMap:false, toast:false });
      }else{
        clearForm();
      }
    }finally{
      __formFilling = false;
      setFormDirty(false);
    }
    toast("Reverted");
  }

  function flashField(el){
    if(!el || !el.classList) return;
    el.classList.remove("flashField");
    void el.offsetWidth;

  function bindDirtyTracking(){
    const panel = $("saveBtn")?.closest(".panel");
    if(!panel || panel.__dirtyBound) return;
    panel.__dirtyBound = true;

    const handler = (ev)=>{
      const t = ev.target;
      if(!t || !t.matches) return;
      if(t.matches("input, textarea, select")) markDirty();
    };
    panel.addEventListener("input", handler, true);
    panel.addEventListener("change", handler, true);

    panel.addEventListener("click", (ev)=>{
      const t = ev.target;
      if(!t) return;
      if(t.closest && (t.closest("#addConnBtn") || t.closest("#cycleAddBtn") || t.closest("#cycleClearBtn") || t.closest("#eyeClearBtn") || t.closest("#addFavColorBtn") || t.closest("#removeImgBtn"))) markDirty();
      if(t.closest && (t.closest("[data-conn-remove]") || t.closest(".colorPillGlass .x") || t.closest(".cycleList [data-del]"))) markDirty();
    }, true);

    const undoBtn = $("undoEditBtn");

      undoBtn.__bound = true;
      undoBtn.addEventListener("click", revertUnsaved);

  }

  

  function initEditorAccordion(){

  function bindProfileJumpLinks(){
    const pb = $("profileBody");
    if(!pb) return;

    const rules = [
      { re: /Birthday/i, field: "birthdate" },
      { re: /Friendship/i, field: "metOn" },
      { re: /Connections?/i, field: "connSelect" },
      { re: /Blood type/i, field: "bloodType" },
      { re: /Height/i, field: "heightCm" },
      { re: /Allergies|Intolerances/i, field: "allergies" },
      { re: /Medical Notes/i, field: "medicalNotes" },
      { re: /Eye/i, field: "eyeColorA" },
      { re: /Favorite Colors/i, field: "favColorInput" },
      { re: /Notes/i, field: "notes_important", tab: "important" },
      { re: /Cycle/i, field: "cycleStart", tab: "cycle" },
    ];

    pb.querySelectorAll(".profileCard .k").forEach(k=>{
      const txt = (k.textContent || "").trim();
      const rule = rules.find(r=>r.re.test(txt));
      if(!rule) return;
      if(k.__jumpBound) return;
      k.__jumpBound = true;
      k.classList.add("jumpK");
      k.title = "Edit this section";
      k.addEventListener("click", ()=>{
        const e = entries.find(x=>x.id===selectedId);
        if(!e) return;
        // Keep current edit state; don't overwrite unsaved edits here.
        if(rule.tab) openFormNotesTab(rule.tab);
        const el = $(rule.field);
        // If the target field is inside a collapsed editor section, open it first
        try{
          const det = el?.closest?.("details.accSec");
          if(det && !det.open) det.open = true;
        }catch{}
        const beh = prefersReducedMotion() ? "auto" : "smooth";
        if(el && el.scrollIntoView){
          el.scrollIntoView({ behavior: beh, block: "start" });
          setTimeout(()=>{ try{ el.focus({ preventScroll:true }); }catch{ try{ el.focus(); }catch{} } }, 130);
          flashField(el);
        }
        toast("Edit section");
      });
    });
  }

  async function handleSave(){
    const nickname = $("nickname").value.trim();
    const realName = $("realName").value.trim();
    const showRealName = $("showRealName").checked;
    const connections = getConnectionsFromForm();
    const birthdate = $("birthdate").value;
    const birthplace = $("birthplace").value.trim();
    const currentAddress = $("currentAddress").value.trim();
    const metOn = $("metOn").value;
    const nativeLang = $("nativeLang").value.trim();
    const otherLangs = $("otherLangs").value.trim();
    const tags = normalizeTagsInput($("tags")?.value || "");
    const lastContact = ($("lastContact")?.value || "").trim();
    const _reRaw = ($("remindEvery")?.value || "").trim();
    const remindEveryDays = Math.max(0, parseInt(_reRaw || "0", 10) || 0);
    const _btEl = $("bloodType");
    const bloodType = _btEl ? String(_btEl.value || "").trim() : "";
    const _hcRaw = ($("heightCm")?.value || "").trim();
    const heightCm = Math.max(0, parseInt(_hcRaw || "0", 10) || 0);
    const allergies = ($("allergies")?.value || "").trim();
    const medicalNotes = ($("medicalNotes")?.value || "").trim();
    const socials = getSocialsFromForm();
    const tz = $("timezone").value.trim();
    const notes = getNotesFromForm();
    const favColors = getFavColorsFromForm();
    // Eye colors: always re-read directly from inputs right before saving (fixes "not saved" cases)
    try{ readEyeFromFormInputs({ forceNameSwap:true }); }catch{}
    const eye = getEyeFromForm();
    const cycle = getCycleFromForm();

    if(!nickname){ toast("Please enter a nickname"); return; }
    if(!tz){ toast("Please enter an IANA timezone"); return; }
    if(!validateForm({ onSave:true })){ toast("Please fix the highlighted fields"); return; }



    // Overwrite confirmation (same nickname)
    const nickKey = nickname.toLowerCase();
    let overwriteTargetId = null;
    let deleteAfterOverwriteId = null;

    const conflictIdx = entries.findIndex(x=>{
      const nk = (x.nickname||"").trim().toLowerCase();
      return nk === nickKey && (!selectedId || x.id !== selectedId);
    });

    if(conflictIdx >= 0){
      const target = entries[conflictIdx];
      const ok = confirm(`Overwrite existing entry?\n\n${target.nickname}\n\nThe current data will be replaced.`);
      if(!ok) return;
      overwriteTargetId = target.id;
      if(selectedId) deleteAfterOverwriteId = selectedId; // merging two entries
    }

    if(!overwriteTargetId){
      const dup = possibleDuplicateEntry({ nickname, realName, socials }, selectedId || "");
      if(dup){
        const ok = confirm(`Possible duplicate found:

${dup.nickname}${dup.realName ? ' (' + dup.realName + ')' : ''}

Continue saving anyway?`);
        if(!ok) return;
      }
    }

    let [lat, lon] = parseCoords($("coords").value);

    if((!Number.isFinite(lat) || !Number.isFinite(lon)) && currentAddress){
      toast("Finding current address…");
      try{
        const g = await geocodeAddress(currentAddress);
        if(g){
          lat = g.lat; lon = g.lon;
          $("coords").value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
        }
      }catch{}
    }

    if(!Number.isFinite(lat) || !Number.isFinite(lon)){
      toast("Please set coordinates (map click) or enter a current address");
      return;
    }

    const now = new Date().toISOString();
    const removeImage = $("removeImgBtn").dataset.remove === "1";

    if(!selectedId && overwriteTargetId) selectedId = overwriteTargetId;

    if(selectedId){
      const idx = entries.findIndex(x=>x.id===selectedId);
      if(idx >= 0){
        const prev = entries[idx];
        const newImageData = removeImage ? null : (pendingImageData ?? prev.imageData ?? null);

        entries[idx] = {
          ...prev,
          nickname, realName, showRealName, connections,
          birthdate, birthplace, currentAddress, metOn,
          bloodType,
          heightCm, allergies, medicalNotes,
          nativeLang, otherLangs, socials, tz, tags, lastContact, remindEveryDays, notes,
          favoriteColors: favColors,
          eye: eye,
          cycle: cycle,
          lat: Number(lat), lon: Number(lon),
          imageData: newImageData,
          updatedAt: now
        };
        toast("Updated");
      }
    } else {
      entries.unshift({
        id: uuid(),
        nickname, realName, showRealName, connections,
        birthdate, birthplace, currentAddress, metOn,
        bloodType,
        heightCm, allergies, medicalNotes,
        nativeLang, otherLangs, tz, tags, lastContact, remindEveryDays, notes,
        favoriteColors: favColors,
        eye: eye,
        cycle: cycle,
        fav: false,
        lat: Number(lat), lon: Number(lon),
        imageData: pendingImageData ?? null,
        createdAt: now, updatedAt: now
      });
      toast("Saved");
    }

    pendingImageData = null;
    $("imageFile").value = "";
    $("removeImgBtn").dataset.remove = "0";

    save();
    try{ setFormDirty(false); }catch{}
    // If a merge deletes the Special person, keep Special on the surviving entry
    if(deleteAfterOverwriteId && specialId === deleteAfterOverwriteId){
      specialId = selectedId || overwriteTargetId || "";
      try{ if(specialId) localStorage.setItem(SPECIAL_STORAGE_KEY, specialId); else localStorage.removeItem(SPECIAL_STORAGE_KEY); }catch{}
    }
    if(deleteAfterOverwriteId && deleteAfterOverwriteId !== selectedId){
      entries = entries.filter(x=>x.id!==deleteAfterOverwriteId);
      save();
    }

    // Remove temporary pin
    try{ if(tempPin){ tempLayer.removeLayer(tempPin); tempPin = null; } }catch{}
    renderMarkers();

    const current = selectedId ? entries.find(x=>x.id===selectedId) : entries[0];
    if(current?.imageData) showPreview(current.imageData, "Saved image");
    else showPreview(null, null);
  }

  function handleDelete(){
    if(!selectedId) return;
    const delId = selectedId;
    const idx = entries.findIndex(x=>x.id===delId);
    const e = (idx>=0 ? entries[idx] : entries.find(x=>x.id===delId));
    const ok = confirm(`Really delete this entry?\n\n${e?.nickname ?? ""}`);
    if(!ok) return;

    const wasSpecial = (specialId === delId);
    const removed = e ? safeParseJSON(JSON.stringify(e)) : null;

    // keep Special consistent
    if(wasSpecial){
      specialId = "";
      try{ localStorage.removeItem(SPECIAL_STORAGE_KEY); }catch{}
    }

    if(idx>=0) entries.splice(idx, 1);
    else entries = entries.filter(x=>x.id!==delId);

    selectedId = null;
    save();
    clearForm();

    toast("Deleted", {
      actionText: "Undo",
      duration: 4200,
      onAction: ()=>{
        if(!removed) return;
        const insertAt = Math.min(Math.max(idx, 0), entries.length);
        entries.splice(insertAt, 0, removed);

        if(wasSpecial){
          specialId = removed.id;
          try{ localStorage.setItem(SPECIAL_STORAGE_KEY, specialId); }catch{}
        }

        selectedId = removed.id;
        save();
        try{ selectEntry(removed.id, { panMap:false, toast:false }); }catch{}
        toast("Restored");
      }
    });
  }

  function firstLetter(name){
    const s = String(name || "").trim();
    if(!s) return "#";
    const ch = s[0].toUpperCase();
    return (ch >= "A" && ch <= "Z") ? ch : "#";
  }

  function renderAlphabet(sorted){
    const alpha = $("alpha");
    alpha.innerHTML = "";

    const firstIdByLetter = new Map();
    for(const e of sorted){
      const L = firstLetter(e.nickname);
      if(!firstIdByLetter.has(L)) firstIdByLetter.set(L, e.id);
    }

    const letters = [];
    for(let i=0;i<26;i++) letters.push(String.fromCharCode(65+i));
    letters.push("#");

    for(const L of letters){
      const btn = document.createElement("button");
      btn.className = "aBtn";
      btn.textContent = L;
      btn.disabled = !firstIdByLetter.has(L);
      btn.addEventListener("click", ()=>{
        const id = firstIdByLetter.get(L);
        if(!id) return;
        const ul = $("list");
        const li = ul.querySelector(`li[data-id="${CSS.escape(id)}"]`);
        if(li){
          li.scrollIntoView({ behavior:"smooth", block:"start", inline:"nearest" });
        }
      });
      alpha.appendChild(btn);
    }
  }

  function countryGuess(e){
    const s = (e.currentAddress || e.birthplace || "").trim();
    if(!s) return "";
    const parts = s.split(",").map(x=>x.trim()).filter(Boolean);
    return parts.length ? parts[parts.length-1] : "";
  }

  function formatYMDShort(ymd){
    if(!ymd) return "—";
    const y = ymd.years || 0, m = ymd.months || 0;
    if(y<=0 && m<=0) return "0m";
    if(y>0 && m>0) return `${y}y ${m}m`;
    if(y>0) return `${y}y`;
    return `${m}m`;
  }

  function updateStats(){
    const el = document.getElementById("statsText");
    if(!el) return;

    const friends = entries.length;

    const countries = new Set();
    for(const e of entries){
      const c = countryGuess(e);
      if(c) countries.add(c);
    }

    let longest = null;
    for(const e of entries){
      const ymd = yearsMonthsDaysSince(e.metOn);
      if(!ymd) continue;
      const score = (ymd.years||0)*1000 + (ymd.months||0)*10 + (ymd.days||0);
      if(!longest || score > longest.score){
        longest = { score, ymd };
      }
    }

    el.textContent = `Friends: ${friends} · Countries: ${countries.size} · Longest friendship: ${longest ? formatYMDShort(longest.ymd) : "—"}`;
