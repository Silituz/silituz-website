let __quickHolidayToken = 0;

async function computeNextHolidayForQuick(){
  const settings = loadHolidaySettings();
  const selected = Array.isArray(settings.countries) ? settings.countries : [];
  if(!selected.length) return { empty:true, reason:"no_countries", perCountry:[] };

  const selectedRegions = Array.isArray(settings.regions) ? settings.regions : [];
  const includeNationwide = settings.includeNationwide !== false;

  // If types were never stored, treat as "all types enabled"
  const typesState = (settings.types && typeof settings.types === "object") ? settings.types : null;

  const now = new Date();
  const year = now.getFullYear();
  const years = [year, year + 1];

  const today = parseISODateLocal(todayISO());

  // Gather holidays per country and compute "next per country"
  const perCountry = [];
  let globalNextDate = null;

  for(const ccRaw of selected){
    const cc = String(ccRaw||"").toUpperCase();
    let all = [];
    for(const y of years){
      try{
        const list = await getPublicHolidays(y, cc);
        for(const h of (Array.isArray(list) ? list : [])){
          all.push(Object.assign({}, h, { __cc: cc }));
        }
      }catch{}
    }

    // Extra observances (keeps behavior consistent)
    all = addExtraObservances(all, years, [cc]);

    const filtered = all.filter(h=>{
      if(!h || !h.date) return false;
      const d = parseISODateLocal(h.date);
      if(d < today) return false;
      if(typesState && !matchesTypeFilter(h, typesState)) return false;
      if(!matchesRegionFilter(h, selectedRegions, includeNationwide)) return false;
      return true;
    }).sort((a,b)=>{
      if(a.date !== b.date) return String(a.date).localeCompare(String(b.date));
      const na = String(a.name || a.localName || "").toLowerCase();
      const nb = String(b.name || b.localName || "").toLowerCase();
      return na.localeCompare(nb);
    });

    if(filtered.length){
      const nextDate = filtered[0].date;
      const items = filtered.filter(x=>x.date === nextDate);
      const first = items[0] || filtered[0];
      const en = String(first.name || "").trim();
      const nm = en || String(first.localName || first.name || "—").trim() || "—";
      perCountry.push({ cc, date: nextDate, name: nm, item:first });
      if(!globalNextDate || String(nextDate).localeCompare(String(globalNextDate)) < 0){
        globalNextDate = nextDate;
      }
    }else{
      perCountry.push({ cc, date: "", name: "—", item:null });
    }
  }

  // Build a global "next date" summary (for the top pill)
  const itemsOnGlobal = [];
  if(globalNextDate){
    for(const pc of perCountry){
      if(pc.date === globalNextDate && pc.item) itemsOnGlobal.push(pc.item);
    }
  }

  return {
    empty: !globalNextDate,
    date: globalNextDate || "",
    items: itemsOnGlobal,
    perCountry
  };
}


function formatHolidayQuickLabel(result){
  if(!result || result.empty) return null;

  const items = Array.isArray(result.items) ? result.items : [];

  const t0 = parseISODateLocal(todayISO());
  const t1 = parseISODateLocal(result.date || todayISO());
  const days = Math.max(0, daysBetweenDates(t0, t1));
  const when = (days === 0) ? "today" : `in ${days}d`;

  const show = items.slice(0,3).map(h=>{
    const cc = String(h.__cc || "").toUpperCase();
    const scope = String(h.__scope || h.__cc || "").toUpperCase();
    const flag = flagEmojiFromCountryCode(cc);
    const tp = holidayTitleParts(h);
    const nm = tp.en ? `${tp.local} - ${tp.en}` : tp.local;
    return `${flag} ${scope}: ${nm}`;
  });

  const more = Math.max(0, items.length - show.length);
  return `🎉 Holiday (${when}): ${show.join(" · ")}${more ? ` · +${more}` : ""}`;
}

async function updateHolidayQuickChip(btn){
  if(!btn) return;

  const hs = loadHolidaySettings();
  const selected = Array.isArray(hs.countries) ? hs.countries : [];
  if(!selected.length){
    btn.classList.add("qchipMulti");
    btn.innerHTML = `<div class="qcTop">Holiday</div><div class="qcCountries"><div>(select countries in 📅 Holidays)</div></div>`;
    try{ window.__quickHolidayLast = null; }catch{}
    return;
  }

  const token = ++__quickHolidayToken;
  btn.classList.add("qchipMulti");
  btn.innerHTML = `<div class="qcTop">Holiday <span class="pill">(…)</span>:</div><div class="qcCountries">${selected.map((cc,i)=>`<div>${i+1}. ${escapeHTML(String(cc||"").toUpperCase())} — …</div>`).join("")}</div>`;

  try{
    const res = await computeNextHolidayForQuick();
    if(token !== __quickHolidayToken) return;

    const d0 = parseISODateLocal(todayISO());
    const d1 = res && res.date ? parseISODateLocal(res.date) : null;
    const inDays = (d1 ? Math.max(0, daysBetweenDates(d0, d1)) : null);

    const top = (inDays !== null) ? `Holiday <span class="pill">(in ${inDays}d)</span>:` : `Holiday <span class="pill">(…)</span>:`;

    const per = (res && Array.isArray(res.perCountry)) ? res.perCountry : [];
    const getName = (cc)=>{
      const CC = String(cc||"").toUpperCase();
      const it = per.find(x=>String(x.cc||"").toUpperCase()===CC);
      return it && it.name ? String(it.name) : "—";
    };

    btn.innerHTML = `<div class="qcTop">${top}</div><div class="qcCountries">${selected.map((cc,i)=>`<div>${i+1}. ${escapeHTML(String(cc||"").toUpperCase())} — ${escapeHTML(getName(cc))}</div>`).join("")}</div>`;

    try{ window.__quickHolidayLast = res; }catch{}
  }catch(err){
    if(token !== __quickHolidayToken) return;
    btn.innerHTML = `<div class="qcTop">Holiday</div><div class="qcCountries"><div>—</div></div>`;
    try{ window.__quickHolidayLast = null; }catch{}
    try{ console.error("Holiday quick failed:", err); }catch{}
  }
}


function updateQuickWidgets(){
  const chips = document.getElementById("quickChips");
  if(!chips) return;

  function nameKey(e){
    const nm = (displayNames(e)?.main || e.nickname || e.realName || "").toString().trim();
    return nm.toLowerCase();
  }

  // ---- Birthday next (nearest upcoming birthday, show ALL ties) ----
  let minBdayDays = null;
  const bdayList = []; // {e, days}
  for(const e of entries){
    const d = daysUntilNextBirthday(e.birthdate);
    if(d === null) continue;
    if(minBdayDays === null || d < minBdayDays){
      minBdayDays = d;
      bdayList.length = 0;
      bdayList.push({ e, days: d });
    }else if(d === minBdayDays){
      bdayList.push({ e, days: d });
    }
  }
  bdayList.sort((a,b)=> nameKey(a.e).localeCompare(nameKey(b.e), undefined, {sensitivity:"base"}));

  // ---- Helpers for friendship milestones ----
  function parseISODateStrict(iso){
    const p = parseDateYMD(iso);
    if(!p || !p.hasYear) return null;
    const dt = new Date(p.year, p.month-1, p.day);
    if(Number.isNaN(dt.getTime())) return null;
    if(dt.getFullYear() !== p.year || dt.getMonth() !== (p.month-1) || dt.getDate() !== p.day) return null;
    return dt;
  }

  function addMonthsClamped(dt, months){
    const y = dt.getFullYear();
    const m = dt.getMonth();
    const d = dt.getDate();

    const total = m + months;
    const ty = y + Math.floor(total / 12);
    const tm = ((total % 12) + 12) % 12;

    const last = new Date(ty, tm + 1, 0).getDate();
    const td = Math.min(d, last);
    return new Date(ty, tm, td);
  }

  function fullMonthsSince(start, end){
    let months = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
    if(months < 0) return 0;
    let cand = addMonthsClamped(start, months);
    if(cand > end) months -= 1;
    if(months < 0) months = 0;
    return months;
  }

  function nextFriendshipMilestone(metISO){
    const met = parseISODateStrict(metISO);
    if(!met) return null;

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const m0 = new Date(met.getFullYear(), met.getMonth(), met.getDate());

    if(m0 > today) return null; // ignore future dates

    const full = fullMonthsSince(m0, today);

    // If TODAY is exactly a rounded month/year milestone, surface it (days=0),
    // otherwise show the next upcoming rounded milestone.
    const fullDate = addMonthsClamped(m0, full);
    const isExact = (full >= 1) && (fullDate.getTime() === today.getTime());

    const n = isExact ? full : (full + 1);
    if(n < 1) return null;

    const milestone = addMonthsClamped(m0, n);
    const days = Math.max(0, daysBetweenDates(today, milestone));

    const isYear = (n % 12 === 0);
    const years = Math.round(n / 12);
    const label = isYear
      ? `${years} year${years===1?"":"s"}`
      : `${n} month${n===1?"":"s"}`;

    return { days, label, months: n, date: milestone };
  }

  // ---- Friendship next (rounded month/year milestones)
// If there are milestones within the next FRIEND_WINDOW_DAYS, show all of them.
// Otherwise, show the nearest milestone date (and all ties).
  const FRIEND_WINDOW_DAYS = 7;
  let minFriendDays = null;
  const allFriendMilestones = []; // {e, info}

  for(const e of entries){
    const info = nextFriendshipMilestone(e.metOn);
    if(!info) continue;
    allFriendMilestones.push({ e, info });
    if(minFriendDays === null || info.days < minFriendDays) minFriendDays = info.days;
  }

  const friendList = [];
  if(allFriendMilestones.length && minFriendDays !== null){
    if(minFriendDays <= FRIEND_WINDOW_DAYS){
      for(const it of allFriendMilestones){
        if(it.info.days <= FRIEND_WINDOW_DAYS) friendList.push(it);
      }
    }else{
      for(const it of allFriendMilestones){
        if(it.info.days === minFriendDays) friendList.push(it);
      }
    }
  }

  // Sort: soonest date first, then LONGER milestone first (e.g., 8 months before 3 months),
  // then alphabetical.
  friendList.sort((a,b)=>
    (a.info.days - b.info.days) ||
    (b.info.months - a.info.months) ||
    nameKey(a.e).localeCompare(nameKey(b.e), undefined, {sensitivity:"base"})
  );

  // Existing shortcuts
const favCount = entries.reduce((acc,e)=> acc + (e && e.fav ? 1 : 0), 0);

  chips.innerHTML = "";

  let hasHolidaySel = false;
  try{ hasHolidaySel = (loadHolidaySettings().countries || []).length > 0; }catch{ hasHolidaySel = false; }

  const hasAny = (bdayList.length > 0) || (friendList.length > 0) || (favCount>0) || hasHolidaySel;

  // Next holiday (for the countries/regions you selected in 📅 Holidays)
  if(hasHolidaySel){
    const hchip = document.createElement("button");
    hchip.type = "button";
    hchip.className = "qchip";
    hchip.textContent = "🎉 Holiday: …";
    hchip.addEventListener("click", (ev)=>{
      ev.stopPropagation();
      try{
        const t = (window.__quickHolidayPrimary || null);
        if(t && t.date){
          setHolidayFocusTarget({ date: t.date, scope: t.scope || "" });
        }
      }catch{}
      try{ showCalendarView(); }catch{}
      closeQuickPopover();
    });
    chips.appendChild(hchip);
    updateHolidayQuickChip(hchip);
  }

  if(!hasAny){
    const d = document.createElement("div");
    d.className = "quickEmpty";
    d.textContent = "No highlights right now";
    chips.appendChild(d);
    return;
  }

  function makeChip(label, key, selectId){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "qchip";
    b.dataset.action = key;
    if(selectId) b.dataset.selectId = selectId;
    b.textContent = label;

    b.addEventListener("click", async (ev)=>{
      ev.stopPropagation();
      applyFilterFromQuick(key);

      if(selectId){
        try{
          const ok = await guardedSelectEntry(selectId, { panMap:false, toast:false });
          if(ok){
            setTimeout(()=>{
              const li = document.querySelector(`#list .item[data-id="${CSS.escape(selectId)}"]`);
              li?.scrollIntoView({behavior:"smooth", block:"center"});
              if(li){
                try{ li.classList.remove("flash"); void li.offsetWidth; li.classList.add("flash"); }catch{ li.classList.add("flash"); }
              }
            }, 0);
          }
        }catch{}
      }

      closeQuickPopover();
      try{ document.getElementById("list")?.scrollIntoView({behavior:"smooth", block:"start"}); }catch{}
    });

    return b;
  }

  // Birthdays (stacked, centered)
  if(bdayList.length > 0){
    const stack = document.createElement("div");
    stack.className = "quickStack";
    for(const it of bdayList){
      const nm = displayNames(it.e).main || (it.e.nickname || "—");
      const when = (it.days === 0) ? "today" : `in ${it.days}d`;
      stack.appendChild(makeChip(`🎂 Birthday next: ${nm} (${when})`, "bday", it.e.id));
    }
    chips.appendChild(stack);
  }

  // Friendships (stacked, centered)
  if(friendList.length > 0){
    const stack = document.createElement("div");
    stack.className = "quickStack";
    for(const it of friendList){
      const nm = displayNames(it.e).main || (it.e.nickname || "—");
      const when = (it.info.days === 0) ? "today" : `in ${it.info.days}d`;
      stack.appendChild(makeChip(`🤝 Friendship next: ${nm} (${it.info.label} ${when})`, "friend", it.e.id));
    }
    chips.appendChild(stack);
  }

  // Shortcuts (green/yellow + favorites) under the last friendship
  const shortcuts = [];
if(favCount > 0) shortcuts.push({ key:"fav",   label:`⭐ ${favCount} favorite${favCount===1?"":"s"}` });

  if(shortcuts.length > 0){
    const row = document.createElement("div");
    row.className = "quickShortcuts";
    for(const it of shortcuts){
      row.appendChild(makeChip(it.label, it.key, null));
    }
    chips.appendChild(row);
  }
}

        e.lastContact, (e.remindEveryDays!=null ? String(e.remindEveryDays) : "")
      ].filter(Boolean).join(" | ").toLowerCase();

    }) : [...entries];

    // Filters (only those that truly filter)
    if(activeFilter === "fav"){
      filtered = filtered.filter(e => !!e.fav);
    }// NOTE: bday/friend are *sort modes* (no filtering)

    // Advanced filters (popover)
    try{
      if(advFilters){
        if(advFilters.hasNotes){
          filtered = filtered.filter(e=>{
            const mn = String(e.medicalNotes||"").trim();
            if(mn.length>0) return true;
            const n = e.notes;
            if(typeof n === "string") return n.trim().length>0;
            if(n && typeof n === "object"){
              return Object.values(n).some(v=> String(v||"").trim().length>0);

            return false;
          });

    // Sorting

      // Keep "My Special One" pinned, even in sort modes
      const aS = (specialId && a.id===specialId);

      // In sort-modes (Birthday / Friendship), do NOT pin favorites above the sort metric

        const aF = !!a.fav, bF = !!b.fav;
        if(aF !== bF) return aF ? -1 : 1;

      // Birthday sort: nearest next birthday first
      if(activeFilter === "bday"){
        const da = daysUntilNextBirthday(a.birthdate);
        const db = daysUntilNextBirthday(b.birthdate);
        const va = (da === null ? Number.POSITIVE_INFINITY : da);
        const vb = (db === null ? Number.POSITIVE_INFINITY : db);
        if(va !== vb) return va - vb;
        return (a.nickname||"").localeCompare(b.nickname||"", undefined, {sensitivity:"base"});

      // Friendship sort: longest friendship first (oldest metOn date first)

        if(va !== vb) return va - vb; // earlier date (smaller) = longer friendship => on top
        return (a.nickname||"").localeCompare(b.nickname||"", undefined, {sensitivity:"base"});

  // Live clock nodes (cached) to keep the UI snappy
  let __liveTimeNodesSec = [];
  let __liveTimeNodesMin = [];
  function refreshLiveClockNodes(){
    const all = Array.from(document.querySelectorAll(".js-time"));
    __liveTimeNodesSec = [];
    __liveTimeNodesMin = [];
    for(const el of all){
      if(!el) continue;
      const gran = String(el.getAttribute("data-gran") || "s").toLowerCase();
      if(gran === "m") __liveTimeNodesMin.push(el);
      else __liveTimeNodesSec.push(el);
    }
  }

  function updateTimesInUI(now){
    now = now || new Date();

    // Update all time strings (fast: cached nodes + cached formatters)
    if(!__liveTimeNodesSec.length && !__liveTimeNodesMin.length) refreshLiveClockNodes();

    // Per-second nodes (profile / popup)
    const nextSec = [];
    for(const el of __liveTimeNodesSec){
      if(!el || !el.isConnected) continue;
      const tz = el.getAttribute("data-tz");
      const mode = String(el.getAttribute("data-mode") || "").toLowerCase();
      if(!tz){
        el.textContent = "—";
      }else if(mode === "clock"){
        el.textContent = personLocalClock(tz, now) || "—";
      }else if(mode === "date"){
        el.textContent = personLocalDateLine(tz, now) || "—";
      }else{
        el.textContent = personLocalTime(tz, now) || "—";
      }
      nextSec.push(el);
    }
    __liveTimeNodesSec = nextSec;

    // Per-minute nodes (list) — update only on the minute
    const sec = now.getSeconds();
    if(sec === 0){
      const nextMin = [];
      for(const el of __liveTimeNodesMin){
        if(!el || !el.isConnected) continue;
        const tz = el.getAttribute("data-tz");
        const mode = String(el.getAttribute("data-mode") || "").toLowerCase();
        if(!tz){
          el.textContent = "—";
        }else if(mode === "date"){
          el.textContent = personLocalDateLine(tz, now) || "—";
        }else{
          el.textContent = personLocalTimeMin(tz, now) || "—";
        }
        nextMin.push(el);
      }
      __liveTimeNodesMin = nextMin;
    }else{
      // prune detached nodes without doing expensive formatting
      __liveTimeNodesMin = __liveTimeNodesMin.filter(el=>el && el.isConnected);
    }
  }

  const EXPORT_PREFIX = "SO"; // Social Organizer
  function makeExportFilename(prefix = EXPORT_PREFIX){
    const d = new Date(); // local time (your PC timezone)
    const pad = (n)=> String(n).padStart(2,"0");
    const dd = pad(d.getDate());
    const mm = pad(d.getMonth() + 1);
    const yy = pad(d.getFullYear() % 100);
    const hh = pad(d.getHours());
    const mi = pad(d.getMinutes());
    return `${prefix} • ${yy}-${mm}-${dd} • ${hh}_${mi}.json`;
  }

  function parseImportPayload(parsed){
    // Supports:
    //  - legacy array of entries
    //  - v2 object: {version, specialId, holidaySettings, entries:[...]}
    let incomingEntries = parsed;
    let incomingSpecialId = "";
    let incomingHolidaySettings = null;

    if(parsed && typeof parsed === "object" && !Array.isArray(parsed)){
      if(Array.isArray(parsed.entries)) incomingEntries = parsed.entries;
      else if(Array.isArray(parsed.people)) incomingEntries = parsed.people;
      else if(Array.isArray(parsed.friends)) incomingEntries = parsed.friends;
      else if(parsed.data && Array.isArray(parsed.data.entries)) incomingEntries = parsed.data.entries;
      else if(parsed.data && Array.isArray(parsed.data.people)) incomingEntries = parsed.data.people;

      if(typeof parsed.specialId === "string") incomingSpecialId = parsed.specialId;

      // Holiday settings (Calendar) — optional
      if(parsed.holidaySettings && typeof parsed.holidaySettings === "object"){
        incomingHolidaySettings = parsed.holidaySettings;
      }else if(parsed.holidays && typeof parsed.holidays === "object"){
        // backward/alternative key
        incomingHolidaySettings = parsed.holidays;
      }
    }

    // If entries are stored as an object map, accept values
    if(incomingEntries && !Array.isArray(incomingEntries) && typeof incomingEntries === "object"){
      const vals = Object.values(incomingEntries);
      if(vals.length && vals.every(v=>v && typeof v === "object")) incomingEntries = vals;
    }

    const cleaned = sanitizeEntriesArray(incomingEntries);
    return { cleaned, incomingSpecialId, incomingHolidaySettings };
  }

  function sanitizeEntries(data){
    // Backward-compat: old imports called sanitizeEntries()
    return sanitizeEntriesArray(data);
  }

  function mergeImported(current, incoming){
    // Merge by id: if same id exists -> update it, else add new.
    const mapById = new Map(current.map(e => [e.id, e]));
    for(const inc of incoming){
      if(mapById.has(inc.id)){
        const prev = mapById.get(inc.id);
        mapById.set(inc.id, { ...prev, ...inc, updatedAt: new Date().toISOString() });
      }else{
        mapById.set(inc.id, inc);
      }
    }
    // Return array (keep some reasonable ordering: most recently updated first)
    return Array.from(mapById.values()).sort((a,b)=> String(b.updatedAt).localeCompare(String(a.updatedAt)));
  }

  let __unsavedResolve = null;

  function initUnsavedModal(){
    const m = $("unsavedModal");
    const btnSave = $("unsavedSave");
    const btnDiscard = $("unsavedDiscard");
    const btnStay = $("unsavedStay");
    if(!m || !btnSave || btnSave.__bound) return;
    btnSave.__bound = true;

    btnSave.addEventListener("click", ()=> resolveUnsavedModal("save"));
    btnDiscard && btnDiscard.addEventListener("click", ()=> resolveUnsavedModal("discard"));
    btnStay && btnStay.addEventListener("click", ()=> resolveUnsavedModal("stay"));

    // click outside = stay
    m.addEventListener("click", (ev)=>{ if(ev.target === m) resolveUnsavedModal("stay"); });

    // Esc = stay
    document.addEventListener("keydown", (ev)=>{
      if(ev.key === "Escape" && m.classList.contains("open")) resolveUnsavedModal("stay");
    });
  }

  function openUnsavedModal(){
    const m = $("unsavedModal");
    if(!m) return Promise.resolve("discard");
    m.classList.add("open");
    m.setAttribute("aria-hidden","false");
    setTimeout(()=>{ try{ $("unsavedSave")?.focus(); }catch{} }, 0);
    return new Promise((resolve)=>{ __unsavedResolve = resolve; });
  }

  function closeUnsavedModal(){
    const m = $("unsavedModal");
    if(!m) return;
    m.classList.remove("open");
    m.setAttribute("aria-hidden","true");
  }

  function resolveUnsavedModal(choice){
    const r = __unsavedResolve;
    __unsavedResolve = null;
    closeUnsavedModal();
    if(r) r(choice);
  }

  async function guardUnsaved(){
    if(!__formDirty) return "ok";
    const choice = await openUnsavedModal();
    if(choice === "stay") return "stay";
    if(choice === "discard"){
      setFormDirty(false);
      return "ok";
    }
    // save
    await handleSave();
    return __formDirty ? "stay" : "ok";
  }

  async function guardedSelectEntry(id, opts={}){

    // same entry: never overwrite unsaved edits
    if(id === selectedId){
      if(__formDirty) return false;

    if(__formDirty && !__formFilling){
      const res = await guardUnsaved();
      if(res === "stay") return false;

    selectEntry(id, opts);
    return true;
  }

  async function guardedAction(fn){
    if(typeof fn !== "function") return false;

    fn();

    const bdEl = $("birthdate");

    if((onSave || __touched.birthdate) && bd){
      const d = new Date(bd + "T00:00:00");
      const now = new Date();
      now.setHours(0,0,0,0);
      if(!Number.isNaN(d.getTime()) && d.getTime() > now.getTime()){
        setFieldMsg("birthdateMsg", "Birthdate is in the future.", "warn");
        if(onSave) ok = false;
      }else{
        setFieldMsg("birthdateMsg", "", "");
      }
    }else{
      setFieldMsg("birthdateMsg", "", "");
    }

    // Met on (warn; blocks on save)
    const moEl = $("metOn");
    const mo = moEl ? String(moEl.value||"").trim() : "";
    if((onSave || __touched.metOn) && mo){
      const d = new Date(mo + "T00:00:00");
      const now = new Date();
      now.setHours(0,0,0,0);
      if(!Number.isNaN(d.getTime()) && d.getTime() > now.getTime()){
        setFieldMsg("metOnMsg", "Met on is in the future.", "warn");
        if(onSave) ok = false;
      }else{
        setFieldMsg("metOnMsg", "", "");
      }
    }else{
      setFieldMsg("metOnMsg", "", "");
    }

    // Coords
    const coEl = $("coords");
    const coords = coEl ? String(coEl.value||"").trim() : "";
    if((onSave || __touched.coords) && coords){
      const [lat, lon] = parseCoords(coords);
      const addr = String($("currentAddress")?.value || "").trim();
      const valid = Number.isFinite(lat) && Number.isFinite(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180;
      if(!valid){
        if(addr){
          setFieldMsg("coordsMsg", "Coords look invalid — address will be used to locate instead.", "warn");
        }else{
          setFieldMsg("coordsMsg", "Invalid coordinates. Use: lat, lon", "error");
          ok = false;
        }
      }else{
        setFieldMsg("coordsMsg", "", "");
      }
    }else{
      setFieldMsg("coordsMsg", "", "");
    }

    return ok;

  function tzOffsetMinutes(tz, date=new Date()){
    try{
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: tz,
        year:"numeric", month:"2-digit", day:"2-digit",
        hour:"2-digit", minute:"2-digit", second:"2-digit",
        hour12:false
      }).formatToParts(date);

      const m = {};
      for(const p of parts){
        if(p.type !== "literal") m[p.type] = p.value;
      }

      const utcMs = Date.UTC(
        Number(m.year),
        Number(m.month) - 1,
        Number(m.day),
        Number(m.hour),
        Number(m.minute),
        Number(m.second)
      );

      return (utcMs - date.getTime()) / 60000;
    }catch{
      return null;
    }
  }

  function formatTimeOnly(tz, date, hour12){
    try{
      const fmt = new Intl.DateTimeFormat("en-US", { timeZone: tz, hour:"2-digit", minute:"2-digit", hour12: !!hour12 });
      return fmt.format(date);
    }catch{
      return "—";
    }
  }

  function openTimeCompare(tz, name="Friend"){

    const now = new Date();
    const userTz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Local";

    const youTime = formatTimeOnly(userTz, now, __timeFmt12);
    const themTime = formatTimeOnly(tz, now, __timeFmt12);

    const oYou = tzOffsetMinutes(userTz, now);
    const oThem = tzOffsetMinutes(tz, now);

    let delta = "—";
    if(oYou != null && oThem != null){
      const dh = (oThem - oYou) / 60;
      const sign = dh > 0 ? "+" : "";
      delta = `${sign}${Math.round(dh*10)/10}h`;
    }
const fmtLabel = __timeFmt12 ? "12h" : "24h";

    body.innerHTML = `
      <div class="timeCompareGrid">
        <div class="timeCompareCard">
          <div class="timeCompareK">You</div>
          <div class="timeCompareV">${escapeHTML(youTime)}</div>

        </div>

      let target = null;
      cards.forEach(c=>{
        const k = c.querySelector(".k");
        const txt = (k?.textContent||"").toLowerCase();
        if(txt.includes("connections")) target = c;
      });
      if(target){
        target.scrollIntoView({ behavior: "smooth", block: "start" });
        target.classList.add("pulseOutline");
        setTimeout(()=> target.classList.remove("pulseOutline"), 1200);
      }
    }catch(e){}
  }


function distClear(){
  distancePoints = [];
  try{ if(distLine) map.removeLayer(distLine); }catch{}
  try{ if(distLabel) map.removeLayer(distLabel); }catch{}
  try{ if(distMid) map.removeLayer(distMid); }catch{}
  try{ if(distFreePoint) map.removeLayer(distFreePoint); }catch{}
  try{ if(distPoint1Badge) map.removeLayer(distPoint1Badge); }catch{}
  try{ if(distPoint2Badge) map.removeLayer(distPoint2Badge); }catch{}
  try{ if(distInfoPopup) map.closePopup(distInfoPopup); }catch{}
  try{ if(distNearestPlaceMarker) map.removeLayer(distNearestPlaceMarker); }catch{}
  distLine = distLabel = distMid = distFreePoint = distPoint1Badge = distPoint2Badge = distInfoPopup = distNearestPlaceMarker = null;
}

function distAddPoint(lat, lon, label){
  distancePoints.push({lat, lon, label: label || ""});
  if(distancePoints.length === 1){
    distHint('📏 <b>Distance mode</b>: choose the <b>2nd point</b> (profile pin or map).');
  }
  if(distancePoints.length === 2){
    distDraw();
    distHint('📏 <b>Done</b>. Click another pin/map to start a new measurement, or tap 📏 to exit.');
  }
}


function fmtHMS(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  const pad = (n)=> String(n).padStart(2,'0');
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

function travelSeconds(km, vehicle){
  // simple model: car ~ 85 km/h, plane ~ 800 km/h
  const speed = (vehicle === 'plane') ? 800 : 85;
  return (km / speed) * 3600;
}

const __midpointCache = new Map();
async function reverseGeocodeMidpoint(lat, lon){
  // Cache by rounded coords to avoid spamming API
  const key = `${lat.toFixed(3)},${lon.toFixed(3)}`;
  if(__midpointCache.has(key)) return __midpointCache.get(key);

  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=10&addressdetails=1&accept-language=en`;
  try{
    const res = await fetch(url, { method: "GET" });
    if(!res.ok) throw new Error("bad response");
    const data = await res.json();
    const addr = data.address || {};

    const placeName =
      addr.city || addr.town || addr.village || addr.hamlet ||
      addr.county || addr.state || data.name || "Unknown";

    const postcode = addr.postcode || "";
    const display = postcode ? `${postcode}, ${placeName}` : placeName;

    const plLat = data.lat ? parseFloat(data.lat) : lat;
    const plLon = data.lon ? parseFloat(data.lon) : lon;

    const deltaKm = Math.round(haversineKm(lat, lon, plLat, plLon));
    const out = { text: `${display} (± ${deltaKm} km)`, placeLat: plLat, placeLon: plLon };
    __midpointCache.set(key, out);
    return out;
  }catch(e){
    const out = { text: "Unknown (± — km)", placeLat: lat, placeLon: lon };
    __midpointCache.set(key, out);
    return out;
  }
}




function buildDistInfo(aLabel, bLabel, km, vehicle, midPlaceText){
  const half = km/2;
  const tAll = travelSeconds(km, vehicle);
  const tHalf = travelSeconds(half, vehicle);
  const selId = "distVehicleSelect";
  const placeLine = midPlaceText || "Loading…";
  return `
    <div class="distInfo">
      <div class="title">📏 Distance</div>
      <div class="controls">
        <span class="k">Vehicle:</span>
        <select id="${selId}">
          <option value="car"${vehicle==='car'?' selected':''}>Car</option>
          <option value="plane"${vehicle==='plane'?' selected':''}>Plane</option>
        </select>
      </div>
      <div class="row"><span class="k">Marker 1:</span><span class="v">${escapeHtml(aLabel||'—')}</span></div>
      <div class="row"><span class="k">Marker 2:</span><span class="v">${escapeHtml(bLabel||'—')}</span></div>
      <div class="row"><span class="k">Total distance:</span><span class="v">${km.toLocaleString()} km</span></div>
      <div class="row"><span class="k">Half distance:</span><span class="v">${Math.round(half).toLocaleString()} km</span></div>
      <div class="row"><span class="k">Time (total):</span><span class="v">${fmtHMS(tAll)}</span></div>
      <div class="row"><span class="k">Time (half):</span><span class="v">${fmtHMS(tHalf)}</span></div>
      <div class="row"><span class="k">Midpoint (nearest place):</span><span class="v">${placeLine}</span></div>
    </div>
  `;
}


function hookDistPopupEvents(){
  // delegate once per popup open: when the select changes, re-render
  const sel = document.getElementById("distVehicleSelect");
  if(!sel) return;
  sel.addEventListener("change", async ()=>{
    distVehicle = sel.value === 'plane' ? 'plane' : 'car';
    // re-render popup content keeping same midpoint
    if(distancePoints.length === 2){
      const a = distancePoints[0], b = distancePoints[1];
      const km = Math.round(haversineKm(a.lat, a.lon, b.lat, b.lon));
      if(distInfoPopup){
        const key = `${((a.lat+b.lat)/2).toFixed(3)},${((a.lon+b.lon)/2).toFixed(3)}`;
      let placeObj = (__midpointCache && __midpointCache.get(key)) ? __midpointCache.get(key) : null;
      if(!placeObj){
        // trigger fetch (will cache), so it doesn't get stuck on Loading
        placeObj = await reverseGeocodeMidpoint((a.lat+b.lat)/2, (a.lon+b.lon)/2);
      }
      distInfoPopup.setContent(buildDistInfo(a.label, b.label, km, distVehicle, placeObj ? placeObj.text : null));
      // keep marker in sync
      try{ if(distNearestPlaceMarker) map.removeLayer(distNearestPlaceMarker); }catch{}
      if(placeObj && isFinite(placeObj.placeLat) && isFinite(placeObj.placeLon)){
        distNearestPlaceMarker = L.marker([placeObj.placeLat, placeObj.placeLon],{
          interactive: false,
          icon: nearestPlaceIcon('#ef4444'),
          zIndexOffset: 1200
        }).addTo(map);
      }
        setTimeout(hookDistPopupEvents, 0);
      }
    }
  });
}

function distDraw(){
  const a = distancePoints[0], b = distancePoints[1];
  const km = Math.round(haversineKm(a.lat, a.lon, b.lat, b.lon));

  // Screen-space midpoint so the label stays centered on the visible line
  const p1 = map.latLngToLayerPoint([a.lat, a.lon]);
  const p2 = map.latLngToLayerPoint([b.lat, b.lon]);
  const midP = L.point((p1.x + p2.x)/2, (p1.y + p2.y)/2);

  // Perpendicular offset: push label further away (avoid covering)
  const dx = (p2.x - p1.x), dy = (p2.y - p1.y);
  const len = Math.max(1, Math.hypot(dx, dy));
  const nx = -dy/len, ny = dx/len;
  const labelP = L.point(midP.x + nx*34, midP.y + ny*34); // was 18

  const midLatLng = map.layerPointToLatLng(midP);
  const labelLatLng = map.layerPointToLatLng(labelP);

  distLine = L.polyline([[a.lat,a.lon],[b.lat,b.lon]],{
    color: "rgba(220,90,90,.82)",
    weight: 2,
    dashArray: "6 6",
    interactive: false
  }).addTo(map);

  // small km label (optional, now out of the way)

  // Midpoint target marker
  distMid = L.marker(midLatLng,{
    interactive: false,
    icon: L.divIcon({ className:"", html: `<div class="distanceMid"></div>`, iconSize:[16,16], iconAnchor:[8,8] })
  }).addTo(map);

  // Endpoint badges (1 and 2)
  distPoint1Badge = L.marker([a.lat, a.lon],{
    interactive: false,
    icon: L.divIcon({ className:"", html:`<div class="distPointBadge">1</div>`, iconSize:[18,18], iconAnchor:[9,9] })
  }).addTo(map);
  distPoint2Badge = L.marker([b.lat, b.lon],{
    interactive: false,
    icon: L.divIcon({ className:"", html:`<div class="distPointBadge">2</div>`, iconSize:[18,18], iconAnchor:[9,9] })
  }).addTo(map);

  // Info popup (red glow)
  const content = buildDistInfo(a.label, b.label, km, distVehicle, null);
  distInfoPopup = L.popup({
    className: "distInfoPopup",
    closeButton: true,
    autoClose: false,
    closeOnClick: false,
    maxWidth: 360
  }).setLatLng(midLatLng).setContent(content);

  map.openPopup(distInfoPopup);

  // update midpoint place (async)
  (async ()=>{
    const placeObj = await reverseGeocodeMidpoint(midLatLng.lat, midLatLng.lng);
    if(distInfoPopup){
      distInfoPopup.setContent(buildDistInfo(a.label, b.label, km, distVehicle, placeObj ? placeObj.text : null));
      setTimeout(hookDistPopupEvents, 0);
      // nearest place marker (red)
      try{ if(distNearestPlaceMarker) map.removeLayer(distNearestPlaceMarker); }catch{}
      if(placeObj && isFinite(placeObj.placeLat) && isFinite(placeObj.placeLon)){
        distNearestPlaceMarker = L.marker([placeObj.placeLat, placeObj.placeLon],{
          interactive: false,
          icon: L.divIcon({ className:'', html:`<div class="nearestPlacePin"></div>`, iconSize:[14,14], iconAnchor:[7,7] })
        }).addTo(map);
      }
    }
  })();


  // hook select events after popup is in DOM
  setTimeout(hookDistPopupEvents, 0);
}


function distToggle(){
  const btn = document.getElementById("distanceFloatingBtn");
  distanceMode = !distanceMode;
  btn && btn.classList.toggle("active", distanceMode);

    toast && toast("Distance tool enabled");

    distHint("");
    toast && toast("Distance tool disabled");

}

  // ==============================
  // Notes Import Repair (v2)
  // ==============================
  // This OVERRIDES the earlier normalizeNotes() with a smarter version that can repair
  // "packed" notes where everything ended up in notes.other with headers like:
  //   [🚨 Important], [💼 Work & 🚀 Projects], [🍕 Food & More], [📦 Other]
  function splitNotesPackedIntoOther(otherText){
    const empty = { important:"", work:"", media:"", food:"", other:"" };
    const text = String(otherText||"").replace(/\r\n/g,"\n").trim();
    if(!text) return { ...empty };

    const headerRe = /^\s*\[([^\]]+)\]\s*$/gm;
    const matches = [];
    let m;
    while((m = headerRe.exec(text)) !== null){
      matches.push({ idx: m.index, header: (m[1]||"").trim() });
    }
    if(matches.length === 0){
      return { ...empty, other: text };
    }
    matches.push({ idx: text.length, header: "__END__" });

    const out = { ...empty };

    const mapHeaderToKey = (h) => {
      const s = String(h||"").toLowerCase();

      // emojis + english
      if(s.includes("important") || s.includes("urgent") || s.includes("🚨")) return "important";
      if(s.includes("medical") || s.includes("health") || s.includes("🩺")) return "medical";
      if(s.includes("work") || s.includes("project") || s.includes("💼") || s.includes("🚀")) return "work";
      if(s.includes("media") || s.includes("music") || s.includes("movie") || s.includes("show") || s.includes("series") || s.includes("game") || s.includes("👾")) return "media";
      if(s.includes("food") || s.includes("🍕") || s.includes("drink") || s.includes("restaurant")) return "food";
      if(s.includes("other") || s.includes("misc") || s.includes("📦")) return "other";

      // german fallbacks
      if(s.includes("wichtig")) return "important";
      if(s.includes("medizin") || s.includes("gesund")) return "medical";
      if(s.includes("arbeit") || s.includes("projekte")) return "work";
      if(s.includes("medien") || s.includes("media") || s.includes("musik") || s.includes("film") || s.includes("spiele")) return "media";
      if(s.includes("essen") || s.includes("trinken")) return "food";
      if(s.includes("sonst") || s.includes("anderes")) return "other";

      return "other";
    };

    const append = (key, chunk) => {
      const t = String(chunk||"").trim();
      if(!t) return;
      out[key] = out[key] ? (out[key].trim() + "\n\n" + t) : t;
    };

    for(let i=0; i<matches.length-1; i++){
      const cur = matches[i];
      const next = matches[i+1];

      const lineEnd = text.indexOf("\n", cur.idx);
      const start = (lineEnd === -1) ? cur.idx : (lineEnd + 1);
      const chunk = text.slice(start, next.idx).trim();

      const key = mapHeaderToKey(cur.header);
      append(key, chunk);
    }

    // If split produced nothing (headers only), keep original in other
    const any = Object.values(out).some(v => String(v||"").trim());
    if(!any) return { ...empty, other: text };

    return out;
  }

  function normalizeNotes(notes){
    const empty = { important:"", work:"", media:"", food:"", other:"" };

    const append = (obj, key, txt, prefix=null) => {
      const t = String(txt||"").trim();
      if(!t) return;
      const add = prefix ? (String(prefix) + "\n" + t) : t;
      obj[key] = obj[key] ? (obj[key].trim() + "\n\n" + add) : add;
    };

    const mapKey = (rawKey) => {
      const k = String(rawKey||"").trim().toLowerCase();
      if(!k) return null;
      if(k === "important" || k === "imp" || k === "urgent") return "important";
      if(k === "medical" || k === "health" || k === "med" || k === "meds" || k === "allergy" || k === "allergies") return "other";
      if(k === "work" || k === "job") return "work";
      if(k === "projects" || k === "project" || k === "proj") return "work";
      if(k === "media" || k === "music" || k === "movies" || k === "movie" || k === "shows" || k === "show" || k === "series" || k === "games" || k === "game") return "media";
      if(k === "food" || k === "foods" || k === "meal" || k === "meals") return "food";
      if(k === "other" || k === "others" || k === "misc" || k === "miscellaneous") return "other";
      return null;
    };

    if(notes == null) return { ...empty };
    if(typeof notes === "string") return { ...empty, other: String(notes||"") };
    if(typeof notes !== "object") return { ...empty };

    const out = { ...empty };

    // keep current schema if present
    for(const k of Object.keys(empty)){
      if(typeof notes[k] === "string") out[k] = notes[k];
    }

    // merge legacy keys
    for(const [rawKey, val] of Object.entries(notes)){
      if(typeof val !== "string") continue;
      if(rawKey in empty) continue;
      const mapped = mapKey(rawKey);
      if(mapped) append(out, mapped, val);
      else append(out, "other", val, `— ${rawKey} —`);
    }

    // smart repair: all packed into other
    const onlyOtherFilled =
      !String(out.important||"").trim() &&
      !String(out.work||"").trim() &&
      !String(out.food||"").trim() &&
      !!String(out.other||"").trim();

    if(onlyOtherFilled){
      return splitNotesPackedIntoOther(out.other);
    }

    return out;
  }



  // ==============================
  // Bottom quick bar (liquid actions)
  // ==============================
  function quickBarPress(btn){
    try{
      if(!btn) return;
      btn.classList.remove('isPressed');
      void btn.offsetWidth;
      btn.classList.add('isPressed');
      clearTimeout(btn.__pressTimer);
      btn.__pressTimer = setTimeout(()=> btn.classList.remove('isPressed'), 520);
    }catch{}
  }

  function setQuickBarActive(which){
    try{
      const root = $('mobileQuickBar');
      if(!root) return;
      root.querySelectorAll('button[data-mqa]').forEach(btn=>{
        const on = (btn.getAttribute('data-mqa') === which);
        btn.classList.toggle('isActive', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }catch{}
  }

  function showMapForCurrentSelection(){
    try{
      if(selectedId) focusEntryOnMap(selectedId);
      else showMapView();
      setQuickBarActive('map');
    }catch{
      try{ $('tabMap')?.click(); }catch{}
      setQuickBarActive('map');
    }
  }

  function openCurrentCardAtTop(){
    try{
      if(selectedId) openProfileAndScrollTop(selectedId);
      else{
        showProfileView();
        scrollProfileTopIntoView();
      }
      setQuickBarActive('card');
    }catch{
      try{ $('tabCard')?.click(); }catch{}
      setQuickBarActive('card');
    }
  }

  function runQuickBarAction(act, btn){
    quickBarPress(btn);
    setQuickBarActive(act);
    try{
      if(act === 'new'){
        $('newBtn')?.click();
        setTimeout(()=>{ try{ scrollEditorIntoView({ focus:true }); }catch{} }, 30);
        return;
      }
      if(act === 'save'){
        $('saveBtn')?.click();
        return;
      }
      if(act === 'search'){
        const s = $('search');
        if(s){
          try{ scrollWindowToElementTop(s, 12); }catch{}
          try{ s.focus({ preventScroll:true }); }catch{ try{ s.focus(); }catch{} }
          try{ s.select?.(); }catch{}
        }
        return;
      }
      if(act === 'import'){
        try{ openImportPicker(); }catch{ $('importFile')?.click(); }
        return;
      }
      if(act === 'export'){
        $('exportBtn')?.click();
        return;
      }
      if(act === 'map'){
        showMapForCurrentSelection();
        return;
      }
      if(act === 'card'){
        openCurrentCardAtTop();
        return;
      }
    }catch(err){
      try{ console.error('quick bar action failed:', act, err); }catch{}
    }
  }

  (function initBottomQuickBar(){
    const root = $('mobileQuickBar');
    if(!root || root.__quickReady) return;
    root.__quickReady = true;

    root.addEventListener('click', (ev)=>{
      const btn = ev.target.closest('#mobileQuickBar button[data-mqa]');
      if(!btn) return;
      ev.preventDefault();
      ev.stopPropagation();
      runQuickBarAction(btn.getAttribute('data-mqa'), btn);
    });

    const tMap = $('tabMap');
    const tCard = $('tabCard');
    if(tMap && !tMap.__quickBound){
      tMap.__quickBound = true;
      tMap.addEventListener('click', ()=> setQuickBarActive('map'));
    }
    if(tCard && !tCard.__quickBound){
      tCard.__quickBound = true;
      tCard.addEventListener('click', ()=> setQuickBarActive('card'));
    }

    try{
      const profileVisible = $('profileView') && getComputedStyle($('profileView')).display !== 'none';
      setQuickBarActive(profileVisible ? 'card' : 'map');
    }catch{
      setQuickBarActive('map');
    }
  })();
