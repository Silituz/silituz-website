<script>
(function(){
  const root = document.getElementById('soApp');
  if(!root) return;

  const lang = (document.documentElement.getAttribute('lang') || navigator.language || 'en').toLowerCase();
  const isDe = lang.startsWith('de');
  const appName = 'Social Organizer';

  function upsertMeta(name, content){
    let el = document.head.querySelector('meta[name="' + name + '"]');
    if(!el){
      el = document.createElement('meta');
      el.setAttribute('name', name);
      document.head.appendChild(el);
    }
    el.setAttribute('content', content);
  }
  function upsertLink(rel, href, attrs){
    let el = document.head.querySelector('link[rel="' + rel + '"][data-so-app="1"]');
    if(!el){
      el = document.createElement('link');
      el.rel = rel;
      el.dataset.soApp = '1';
      document.head.appendChild(el);
    }
    el.href = href;
    Object.entries(attrs || {}).forEach(([k,v])=>el.setAttribute(k,v));
  }

  upsertMeta('theme-color', '#071018');
  upsertMeta('application-name', appName);
  upsertMeta('mobile-web-app-capable', 'yes');
  upsertMeta('apple-mobile-web-app-capable', 'yes');
  upsertMeta('apple-mobile-web-app-title', appName);
  upsertMeta('apple-mobile-web-app-status-bar-style', 'black-translucent');
  upsertLink('manifest', '/assets/friendsmap/manifest.webmanifest');
  upsertLink('apple-touch-icon', '/assets/friendsmap/icon.svg', { sizes:'512x512' });

  let deferredPrompt = null;
  const installBtn = document.createElement('button');
  installBtn.id = 'soInstallBtn';
  installBtn.className = 'soInstallBtn';
  installBtn.type = 'button';
  installBtn.hidden = true;
  installBtn.textContent = isDe ? 'Installieren' : 'Install';
  installBtn.title = isDe ? 'Als App installieren' : 'Install as app';

  const headerSlot = root.querySelector('.hdrTitle') || root.querySelector('header');
  if(headerSlot && !document.getElementById('soInstallBtn')) headerSlot.appendChild(installBtn);

  window.addEventListener('beforeinstallprompt', (event)=>{
    event.preventDefault();
    deferredPrompt = event;
    installBtn.hidden = false;
  });
  window.addEventListener('appinstalled', ()=>{
    deferredPrompt = null;
    installBtn.hidden = true;
  });
  installBtn.addEventListener('click', async ()=>{
    if(!deferredPrompt) return;
    installBtn.disabled = true;
    try{
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
    }catch{}
    deferredPrompt = null;
    installBtn.hidden = true;
    installBtn.disabled = false;
  });

  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('/friendsmap-sw.js', { scope:'/' }).catch(()=>{});
    });
  }

  function invalidateMapSoon(){
    window.setTimeout(()=>{
      try{
        if(window.map && typeof window.map.invalidateSize === 'function') window.map.invalidateSize();
      }catch{}
    }, 80);
  }
  window.addEventListener('resize', invalidateMapSoon);
  window.addEventListener('orientationchange', invalidateMapSoon);
  document.addEventListener('click', (event)=>{
    if(event.target.closest('#tabMap, #tabCard, #tabCal, .rtTab, #profilePin, #calBackToMapBtn, #mobileQuickBar button')){
      invalidateMapSoon();
    }
  }, true);
  invalidateMapSoon();
})();
</script>
