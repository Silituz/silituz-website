<!-- Social Organizer (scoped include) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>







#soApp{--special-band-height: var(--special-band-height);}

    #soApp{
      --bg:#0b0f1a;
      --text:#e9eefc;
      --muted:#a9b4d0;
      --accent:#7aa7ff;
      --danger:#ff6b6b;
      --emerald:#10b981;
      --line:rgba(255,255,255,.08);
      --shadow: 0 14px 40px rgba(0,0,0,.35);
      --radius:18px;
    }
    #soApp *{box-sizing:border-box}
    #soApp, #soApp{height:100%}
    #soApp{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 600px at 15% 10%, rgba(122,167,255,.18), transparent 55%),
                  radial-gradient(900px 500px at 80% 20%, rgba(125,255,178,.12), transparent 55%),
                  linear-gradient(180deg, #070a12, #0b0f1a 40%, #070a12);
      color:var(--text);
    }
    #soApp header{
      padding:18px 18px 10px;
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
    }
    #soApp .brand{display:flex; align-items:center; gap:10px; user-select:none;}
    #soApp .dot{
      width:14px;height: var(--special-band-height);border-radius:999px;
      background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,.2) 32%, transparent 60%),
                  linear-gradient(135deg, rgba(122,167,255,1), rgba(125,255,178,1));
      box-shadow: 0 0 20px rgba(122,167,255,.35);
    }
    #soApp h1{font-size:16px; margin:0; letter-spacing:.2px; color: rgb(16, 185, 129)}
    #soApp .sub{font-size:12px;color:var(--muted); margin-top:2px}

    #soApp .wrap{
      display:grid;
      grid-template-columns: 480px 1fr;
      gap:14px;
      padding:0 18px 18px;
      height: calc(100% - 64px);
    }
    @media (max-width: 980px){
      #soApp .wrap{grid-template-columns:1fr; height:auto}
      #soApp #map{height:55vh}
    }

    #soApp .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    #soApp .panel{
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    #soApp .row{display:flex; gap:10px}
    #soApp .row > *{flex:1}

    #soApp label{display:block; font-size:12px; color:var(--muted); margin:0 0 6px;}
    #soApp input, #soApp textarea, #soApp select{
      width:100%;
      padding:10px 10px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(10,14,24,.65);
      color: var(--text);
      outline:none;
    }
    #soApp textarea{min-height: var(--special-band-height); resize: vertical}
    #soApp .hint{font-size:12px; color: var(--muted); line-height:1.35;}

    #soApp .zodiacBox{
      margin-top:8px;
      padding:10px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.12);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
    }
    #soApp .zodiacLink{
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dashed rgba(122,167,255,.45);
    }
    #soApp .zodiacLink:hover{ text-decoration: underline; }
    #soApp .zodiacItem{
      font-size:12px;
      color: var(--muted);
      white-space:nowrap;
    }
    #soApp .zodiacItem b{color:var(--text)}

    #soApp .btns{display:flex; gap:10px; flex-wrap:wrap}
    #soApp button, #soApp .btnLike{
      border:none;
      border-radius: 999px;
      padding:10px 14px;
      background: rgba(122,167,255,.16);
      color: var(--text);
      cursor:pointer;
      transition: .15s ease;
      border:1px solid rgba(122,167,255,.28);
    }
    #soApp .btnLike{
      user-select:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    #soApp button:hover, #soApp .btnLike:hover{transform: translateY(-1px); background: rgba(122,167,255,.24)}
    #soApp button.secondary, #soApp .btnLike.secondary{background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.10)}
    #soApp button.danger, #soApp .btnLike.danger{background: rgba(255,107,107,.16); border-color: rgba(255,107,107,.28)}
    #soApp button:disabled{opacity:.5; cursor:not-allowed; transform:none}

    /* Hidden file input (keep in DOM; Safari/embedded pages can block click when display:none) */
    #soApp .soHiddenFile{
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    #soApp .pill{
      padding:6px 10px;
      border-radius:999px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      font-size:12px;
      color: var(--muted);
      white-space:nowrap;
    }

    #soApp .hr{height: var(--special-band-height); background: var(--line); margin: 2px 0}

    /* Alphabet bar */
    #soApp .alphaBar{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      padding:10px 14px;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      background: rgba(0,0,0,.05);
    }
    #soApp .alphaBar .aBtn{
      padding:6px 9px;
      font-size:12px;
      border-radius:999px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color: var(--muted);
    }
    #soApp .alphaBar .aBtn:hover{transform:none; background: rgba(255,255,255,.10)}
    #soApp .alphaBar .aBtn:disabled{opacity:.35; cursor:not-allowed}

    /* List */
    #soApp .list{
      padding:0;
      margin:0;
      list-style:none;
      max-height: 34vh;
      overflow:auto;
    }
    #soApp .item{
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
      background: rgba(0,0,0,.05);
    }
    #soApp .item:hover{background: rgba(0,0,0,.12)}
    #soApp .item.selected{outline: 1px solid rgba(122,167,255,.35); outline-offset:-1px}

    #soApp .meta{min-width:0}
    #soApp .nick{font-weight:700; font-size:14px; display:flex; gap:6px; align-items:flex-start;}
    #soApp .nameBlock{min-width:0; display:flex; flex-direction:column; line-height:1.1; flex:1;}
    #soApp .nameMain{color: var(--emerald) !important; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.15px;}
    #soApp .nameSub{color: var(--muted) !important; font-weight:600; font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.95;}

    /* Name line: keep icons right after the name (not pushed to the far right) */
    #soApp .nameLine{ display:flex; align-items:center; gap:6px; min-width:0; }
    #soApp .nameText{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #soApp .nameIcons{ display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; }

    #soApp .listHeart{
      display:inline-flex;
      width: 18px;
      justify-content:center;
      margin-right: 0;
      font-size: 14px;
      line-height: 1;
      transform: translateY(1px);
      filter: drop-shadow(0 0 1px rgba(0,0,0,.35));
      flex: 0 0 auto;
    }
    #soApp .starInline, #soApp .diamondInline{ margin-left:0 !important; }
    #soApp .profileTitle .pheart{ margin-right:6px; }

    #soApp .tiny{font-size:12px; color:var(--muted); margin-top:3px}

    #soApp .actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end}

    #soApp .iconBtn{
      padding:8px 10px;
      border-radius:999px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color: var(--text);
      cursor:pointer;
    }
    #soApp .iconBtn:hover{transform: translateY(-1px); background: rgba(255,255,255,.10)}

    #soApp .avatar{
      width:34px;
      height: var(--special-band-height);
      border-radius: 10px;
      object-fit: cover;
      border:1px solid rgba(255,255,255,.12);
      cursor:pointer;
    }
    #soApp .avatarPh{
      width:34px;
      height: var(--special-band-height);
      border-radius: 10px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      color: var(--muted);
      font-size:14px;
      user-select:none;
    }

    /* Map & right panel */
    #soApp #map{height:100%; min-height: 420px}

    #soApp .rightView{height:100%}
    #soApp #mapView{height:100%}

    #soApp #profileView{
      height:100%;
      display:none;
      overflow:auto;
    }
    #soApp .profileHead{
      position: sticky;
      top: 0;
      z-index: 2;
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      background: rgba(8,12,20,.82);
      backdrop-filter: blur(10px);
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
    }
    #soApp .profileTitle{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    #soApp .profileTitle b{
      font-size:14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    #soApp .profileTitle span{font-size:12px; color:var(--muted)}
    #soApp .profileBody{padding:14px; display:flex; flex-direction:column; gap:12px}
    #soApp .profileGrid{display:grid; grid-template-columns: 1fr; gap:10px}

    #soApp .profileCard{
      padding:12px;
      border:1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      background: rgba(0,0,0,.14);
    }
    #soApp .profileCard .k{font-size:12px; color:var(--muted); margin-bottom:4px}

/* Visit Card: green section headers */
#soApp #profileView .profileCard > .k{
  color: var(--emerald) !important;
  font-weight: 800;
}

/* Calendar: green section headers */
#soApp #calendarView .profileCard > .k{
  color: var(--emerald) !important;
  font-weight: 800;
}

    #soApp .profileCard .v{font-size:13px; color:var(--text); white-space:pre-wrap; word-break:break-word}

    #soApp .profileImg{
      width:110px;
      height: var(--special-band-height);
      border-radius: 16px;
      object-fit: cover;
      border:1px solid rgba(255,255,255,.12);
      cursor:pointer;
    }
    #soApp .profileTop{position: relative;
      display:flex;
      gap:12px;
      align-items:flex-start;
    }

    #soApp .footer-tools{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      padding:10px 14px;
      border-top:1px solid var(--line);
      background: rgba(0,0,0,.06);
    }

    #soApp .toast{
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      background: rgba(18,26,43,.92);
      border:1px solid rgba(255,255,255,.12);
      color: var(--text);
      padding:10px 12px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      font-size: 13px;
      opacity:0;
      pointer-events:none;
      transition: .18s ease;
      z-index: 50;

      display:flex;
      align-items:center;
      gap:10px;
      max-width: min(92vw, 620px);
    }
    #soApp .toastMsg{
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #soApp .toastAction{
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      padding:6px 10px;
      border-radius:999px;
      cursor:pointer;
      font-size:12px;
      line-height:1;
    }
    #soApp .toastAction:hover{ filter: brightness(1.08); }
    #soApp .toastAction:active{ transform: translateY(1px) scale(0.99); }

#soApp .toast.show{opacity:1; transform:translateX(-50%) translateY(-2px)}

    #soApp .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size:12px;
      padding:2px 6px;
      border-radius: 8px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.25);
      color: var(--text);
    }

    /* Leaflet popup (match dark theme) */
    #soApp .leaflet-popup-content-wrapper{
      background: rgba(0,0,0,.52);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      /* wider but visually smaller */
      max-width: min(680px, 94vw);
    }
    #soApp .leaflet-popup-content{
      /* smaller padding + better use of width */
      margin: 10px 12px;
      min-width: 320px;
      font-size: 12.5px;
      line-height: 1.35;
    }
    @media (max-width: 420px){
      #soApp .leaflet-popup-content{ min-width: 0; margin: 10px 10px; }
    }
    #soApp .leaflet-popup-tip{
      background: rgba(0,0,0,.52);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #soApp .leaflet-container a.leaflet-popup-close-button{
      color: var(--muted);
      width: 28px;
      height: var(--special-band-height);
      line-height: var(--special-band-height);
      font-size: 18px;
    }
    #soApp .leaflet-container a.leaflet-popup-close-button:hover{
      color: var(--text);
      background: transparent;
    }
    #soApp .popup{
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    #soApp .popup .pnotes{ white-space: pre-line; }
    #soApp .popup .pname{font-weight:800; font-size:13.5px; margin:0 0 6px; display:flex; align-items:flex-start; gap:6px}
    #soApp .popup .pnameBlock{display:flex; flex-direction:column; min-width:0}
    #soApp .popup .pMain{font-weight:800; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    #soApp .popup .pline{font-size:12px; margin:3px 0; color: var(--muted)}
    #soApp .popup .ptime{font-weight:700; color: var(--text)}
    #soApp .popup .thumbRow{display:flex; gap:10px; align-items:center; margin-top:8px}
    #soApp .popup img.thumb{width:72px;height: var(--special-band-height);border-radius:12px;object-fit:cover;cursor:pointer;display:block; border:1px solid rgba(255,255,255,.12)}
    #soApp .popup .thumbHint{font-size:12px; color: var(--muted); opacity:.9}

    /* Compact map popup (minimal info) */
    #soApp .popup-compact .pline{ margin: 4px 0; }
    #soApp .popup-compact .pSub{ font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #soApp .popup-openCard{ padding: 8px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.12); color: var(--text); cursor: pointer; }
    #soApp .popup-openCard:hover{ border-color: rgba(16,185,129,.25); box-shadow: 0 0 0 1px rgba(16,185,129,.10), 0 0 14px rgba(16,185,129,.10); }

/* Preview in form */
    #soApp .preview{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:6px;
    }
    #soApp .preview img{
      width:48px;height: var(--special-band-height);border-radius:12px; object-fit:cover;
      border:1px solid rgba(255,255,255,.12);
    }

    #soApp .toggleRow{
      display:flex; align-items:center; gap:10px;
      padding:8px 10px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:12px;
      background: rgba(0,0,0,.10);
      color: var(--muted);
      font-size:12px;
    }
    #soApp .toggleRow input{width:auto; margin:0}


    #soApp .miniToggle{
      display:flex; align-items:center; gap:10px;
      color: var(--muted);
      font-size:12px;
    }
    #soApp .miniToggle input{ width:auto; margin:0; }

    #soApp .realNameLine{
      margin-top:4px;
      font-size:12px;
      color: var(--muted);
      opacity:.95;
    }
    #soApp .realNameLine.locked{
      filter: blur(6px);
      opacity:.55;
    }
    #soApp .profileRealName{
      margin-top:6px;
      font-size:13px;
      color: var(--muted);
      opacity:.95;
    }
    #soApp .profileRealName.locked{
      filter: blur(7px);
      opacity:.55;
    }

    #soApp .connPills{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    #soApp .connPill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.10);
      font-size:12px;
      color: rgba(255,255,255,.92);
    }
    #soApp .connPill .open{
      cursor:pointer;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
    #soApp .connPill .xbtn{
      border:0;
      background:transparent;
      color: rgba(255,255,255,.70);
      cursor:pointer;
      font-size:14px;
      line-height:1;
      padding:0;
    }

    /* Image modal */
    #soApp .imgModal{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:22px;
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(8px);
      z-index: 9999;
    }
    #soApp .imgModal.show{display:flex}
    #soApp .imgModalInner{
      position: relative;
      z-index: 10000;
      max-width: min(920px, 92vw);
      max-height: 86vh;
      background: rgba(18,26,43,.92);
      border:1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    #soApp .imgModalInner img{
      max-width: 100%;
      max-height: 74vh;
      border-radius: 14px;
      display:block;
      object-fit: contain;
      background: rgba(0,0,0,.2);
    }
    #soApp .imgModalHint{
      font-size:12px;
      color: var(--muted);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
  

    /* Network modal (graph view) */
    #soApp .netModal{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:22px;
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(8px);
      z-index: 9998;
    }
    #soApp .netModal.show{display:flex;}
    #soApp .netModalInner{
      width:min(1200px, 96vw);
      max-height: 88vh;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background: radial-gradient(900px 420px at 20% 10%, rgba(122,167,255,.14), transparent 60%),
                  radial-gradient(800px 420px at 80% 0%, rgba(16,185,129,.10), transparent 60%),
                  rgba(7,10,18,.88);
      box-shadow: var(--shadow);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    #soApp .netTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:4px 4px 2px;
      flex-wrap:wrap;
    }
    #soApp .netTitle{
      font-weight:800;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    #soApp .netTitle .pill{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      font-size:12px;
      color: rgba(255,255,255,.86);
    }
    #soApp .netControls{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    #soApp .netControls input[type="text"]{
      width: min(320px, 55vw);
      padding:9px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      color: var(--text);
      outline:none;
    }
    #soApp .netControls label{
      display:flex;
      align-items:center;
      gap:8px;
      margin:0;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      font-size:12px;
      color: rgba(255,255,255,.84);
      cursor:pointer;
      user-select:none;
      white-space:nowrap;
    }
    #soApp .netControls label input{ accent-color: var(--emerald); }
    #soApp .netCanvasWrap{
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      background: rgba(0,0,0,.18);
      overflow:auto;
      padding:10px;
      flex:1;
      min-height: 260px;
    }
    #soApp #netSvg{
      display:block;

/* ============================
   Premium UI polish (no new features)
   ============================ */
#soApp, #soApp{ text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
#soApp{
  --card: rgba(255,255,255,.055);
  --card2: rgba(255,255,255,.075);
  --cardBorder: rgba(255,255,255,.12);
  --cardBorder2: rgba(255,255,255,.18);
  --shadowSoft: 0 10px 26px rgba(0,0,0,.32);
  --shadowLift: 0 18px 50px rgba(0,0,0,.44);
  --glowGreen: rgba(87, 255, 170, .35);
  --glowYellow: rgba(255, 220, 90, .35);
  --glowRed: rgba(255, 106, 130, .35);
}

/* subtle background depth */
#soApp::before{
  content:"";
  position:fixed;
  inset:-20vh -10vw;
  background:
    radial-gradient(900px 600px at 20% 10%, rgba(122,167,255,.12), transparent 60%),
    radial-gradient(700px 520px at 80% 12%, rgba(255,120,180,.09), transparent 62%),
    radial-gradient(900px 620px at 55% 90%, rgba(80,255,190,.08), transparent 65%);
  pointer-events:none;
  z-index:-1;
  filter: blur(0px);
}

/* list feels like premium cards */
#soApp .list{ padding: 6px; }
#soApp .item{
  margin: 8px 6px;
  border-bottom: none;
  border-radius: 16px;
  background: linear-gradient(180deg, var(--card2), var(--card));
  border: 1px solid var(--cardBorder);
  box-shadow: var(--shadowSoft), 0 0 0 1px rgba(80,255,190,.10) inset, 0 0 22px rgba(80,255,190,.16);
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
  will-change: transform;
  position: relative;
  overflow: hidden;
}
#soApp .item::before{
  content:"";
  position:absolute;
  inset:-2px;
  background: radial-gradient(420px 120px at 18% 0%, rgba(122,167,255,.10), transparent 60%);
  opacity:.9;
  pointer-events:none;
}
#soApp .item:hover{
  transform: translateY(-1px);
  box-shadow: var(--shadowLift);
  border-color: var(--cardBorder2);
}
#soApp .item:active{ transform: translateY(0px) scale(.995); }

/* heart glow accents (purely visual) */
#soApp .item.heartGreen::after, #soApp .item.heartYellow::after, #soApp .item.heartRed::after{
  content:"";
  position:absolute;
  inset:-40px -40px auto auto;
  width:180px;
  height: var(--special-band-height);
  border-radius: 999px;
  filter: blur(18px);
  opacity:.55;
  pointer-events:none;
}
#soApp .item.heartGreen::after{ background: radial-gradient(circle, var(--glowGreen), transparent 60%); }
#soApp .item.heartYellow::after{ background: radial-gradient(circle, var(--glowYellow), transparent 60%); }
#soApp .item.heartRed::after{ background: radial-gradient(circle, var(--glowRed), transparent 60%); }

  box-shadow: 0 10px 22px rgba(0,0,0,.22);

/* =============================
   SMOOTH TABS PACK (v1)
   - crossfade + mini-slide
   - animated indicator
   - height transition
   - reduced motion support
============================= */
#soApp .notesWidget{ --tab-dir: 1; }

#soApp .notesTabs{
  position:relative;
  padding-bottom: 6px;
  scroll-behavior: smooth;
}

#soApp .notesTabs .tabIndicator{
  position:absolute;
  left:0;
  bottom:0;
  height:2px;
  width: var(--ind-width, 24px);
  border-radius:999px;
  background: rgba(16,185,129,0.85);
  box-shadow: 0 0 14px rgba(16,185,129,0.18);
  transform: translateX(var(--ind-left, 0px));
  transition: transform 180ms ease, width 180ms ease;
  pointer-events:none;
}

#soApp .notesPanels{
  position:relative;
  transition: height 190ms ease;
}

#soApp .notesPanelBox{
  position:absolute;
  left:0;
  right:0;
  top:0;
  opacity:0;
  transform: translateX(calc(var(--tab-dir) * 6px)) translateY(2px);
  transition: opacity 180ms ease, transform 180ms ease;
  pointer-events:none;
}

#soApp .notesPanelBox.isActive{
  opacity:1;
  transform: translateX(0px) translateY(0px);
  pointer-events:auto;
}

#soApp .notesPanelBox.isWasActive{
  opacity:1;
  transform: translateX(0px) translateY(0px);
  pointer-events:none;
}

#soApp .notesWidget.isSwitching .notesPanelBox.isWasActive{
  opacity:0;
  transform: translateX(calc(var(--tab-dir) * -6px)) translateY(2px);
}

#soApp .notesPanelBox.prepEnter{
  opacity:0;
  transform: translateX(calc(var(--tab-dir) * 6px)) translateY(2px);
}

#soApp .notesWidget.isSwitching .notesPanels::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:100%;
  border-radius: 10px;
  background: linear-gradient(90deg, rgba(255,255,255,0.00), rgba(255,255,255,0.06), rgba(255,255,255,0.00));
  transform: translateX(-45%);
  animation: soShimmer 520ms ease-in-out 1;
  pointer-events:none;
}
@keyframes soShimmer{
  from{ transform:translateX(-45%); }
  to{ transform:translateX(45%); }
}

/* Make active tab style match the emerald theme a bit more */
#soApp .notesTabs .tabBtn.active{
  background: rgba(16,185,129,0.14) !important;
  border-color: rgba(16,185,129,0.30) !important;
  box-shadow: 0 0 0 1px rgba(16,185,129,0.10), 0 0 18px rgba(16,185,129,0.12) !important;
}

@media (prefers-reduced-motion: reduce){
  #soApp .notesPanels,
  #soApp .notesPanelBox,
  #soApp .notesTabs .tabIndicator{
    transition:none !important;
    animation:none !important;
  }
}

/* Liquid rain-glass color pills (readable) */
#soApp .colorPillGlass{
  --c: 95,140,255;
  --a: 0.42;
  --g: 0.95;
  position:relative;
  display:inline-flex;
  align-items:center;
  padding:10px 16px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  letter-spacing:0.25px;
  line-height:1;
  color: rgba(255,255,255,0.98);
  text-shadow: 0 1px 2px rgba(0,0,0,0.55), 0 0 10px rgba(0,0,0,0.25);
  overflow:hidden;
  user-select:none;

  background:
    radial-gradient(140% 160% at 18% 18%, rgba(255,255,255,0.60), rgba(255,255,255,0.10) 48%, rgba(255,255,255,0) 74%),
    radial-gradient(160% 160% at 80% 30%, rgba(var(--c), 0.64), rgba(var(--c), 0.14) 52%, rgba(var(--c), 0) 76%),
    linear-gradient(135deg,
      rgba(var(--c), var(--a)) 0%,
      rgba(var(--c), 0.26) 35%,
      rgba(255,255,255,0.11) 55%,
      rgba(var(--c), 0.30) 100%
    );
  border: 1px solid rgba(255,255,255,0.26);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.50),
    inset 0 -14px 18px rgba(0,0,0,0.40),
    0 10px 22px rgba(0,0,0,0.55),
    0 0 0 1px rgba(255,255,255,0.06);
  -webkit-backdrop-filter: blur(14px) saturate(155%);
  backdrop-filter: blur(14px) saturate(155%);
}
#soApp .colorPillGlass::before{
  content:"";
  position:absolute;
  top:-18%;
  left:-16%;
  width:72%;
  height:155%;
  transform: rotate(16deg);
  background: linear-gradient(to bottom,
    rgba(255,255,255,0.82),
    rgba(255,255,255,0.30),
    rgba(255,255,255,0.10),
    rgba(255,255,255,0)
  );
  opacity:0.60;
  pointer-events:none;
}
#soApp .colorPillGlass::after{
  content:"";
  position:absolute;
  inset:-7px;
  border-radius:999px;
  background:
    radial-gradient(circle at 28% 28%, rgba(255,255,255,0.22), transparent 55%),
    radial-gradient(circle at 72% 62%, rgba(var(--c), 0.70), transparent 62%);
  filter: blur(12px);
  opacity: var(--g);
  z-index:-1;
}

  position:absolute;
  inset:-2px;
  pointer-events:none;
  opacity:0.90;
  mix-blend-mode: screen;
  background:
    radial-gradient(circle at 14% 58%, rgba(255,255,255,0.62) 0 1.8px, rgba(255,255,255,0.14) 3px, rgba(255,255,255,0) 7px),
    radial-gradient(circle at 22% 36%, rgba(255,255,255,0.52) 0 1.4px, rgba(255,255,255,0.14) 2.7px, rgba(255,255,255,0) 6.5px),

/* =============================
   FIX: Nothing should overflow on 390px
   ============================= */

/* Always include padding/border in width calculations */
#soApp *, #soApp *::before, #soApp *::after{ box-sizing: border-box; }

/* Avoid horizontal scrolling */
#soApp, #soApp{ overflow-x: hidden; }
#soApp .wrap, #soApp main, #soApp header, #soApp .panel, #soApp .list, #soApp #profileView{ max-width: 100%; }

/* Ensure all images / cards never exceed container */
#soApp img, #soApp video, #soApp canvas, #soApp svg{ max-width: 100%; height: auto; }

/* Wrap long text gracefully */
#soApp .nick, #soApp .infoBlock, #soApp .meta, #soApp .metaLine, #soApp .small, #soApp .statLine, #soApp .notePreview, #soApp .popup *{
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* Buttons/rows: allow wrapping instead of pushing layout wider */
#soApp .actions, #soApp .badgeRow, #soApp .badges, #soApp .tagRow, #soApp .pillRow, #soApp .notesTabs{
  max-width: 100%;
}

/* Some flex rows may force overflow; allow wrap on narrow screens */
@media (max-width: 560px){
  #soApp .row{ flex-wrap: wrap !important; }
  #soApp .row > *{ min-width: 0; } /* critical for flex text overflow */
  #soApp .actions{ flex-wrap: wrap; gap: 8px; }
  #soApp .actions > *{ min-width: 0; }

  /* Inputs: full width, no weird min widths */
  #soApp input, #soApp select, #soApp textarea{
    max-width: 100%;
    width: 100%;
    min-width: 0;
  }
}


/* =============================
   MOBILE WIDTH CLIP FIXES (390px)
   ============================= */
@media (max-width: 560px){

  /* Cards should not clip inner content/shadows on mobile */
  #soApp .card{ overflow: visible !important; }

  /* Zodiac line in editor: allow wrapping + slightly smaller */
  #soApp #zodiacLine{
    display:block;
    white-space: normal !important;
    overflow: visible !important;
    text-overflow: clip !important;
    line-height: 1.25;
    font-size: 12px;
  }

  /* Profile cards value lines: wrap instead of overflowing */
  #soApp #profileView .profileCard .v{
    white-space: normal !important;
    overflow: visible !important;
    text-overflow: clip !important;
    overflow-wrap: anywhere;
    word-break: break-word;
    line-height: 1.25;
    font-size: 13px;
    min-width: 0;
  }

  /* Notes tabs: keep inside the card, no clipping at right edge */
  #soApp .notesTabs{
    padding-right: 10px;
  }

  /* Buttons inside rows shouldn't force width */
  #soApp .notesTabs .tabBtn{
    max-width: 100%;
  }
}


/* =============================
   LAYOUT SHIFT FIX (Profile open makes page "wider")
   - reserve scrollbar gutter to prevent width jump
   - kill any hidden overflow widths on mobile
   ============================= */
#soApp{
  scrollbar-gutter: stable both-edges; /* Firefox/Chromium: prevents width jump */
}
#soApp{
  overflow-y: scroll; /* always reserve vertical scrollbar space */
}

/* Safety: nothing in views should exceed viewport */
#soApp #listView, #soApp #profileView, #soApp #mapView, #soApp .wrap, #soApp main, #soApp header{
  width: 100%;
  max-width: 100%;
}

/* Leaflet popup / dist info must not enforce min-width on mobile */
@media (max-width: 560px){
  #soApp .leaflet-popup-content{
    min-width: 0 !important;
    max-width: 260px !important;
  }
  #soApp .distInfo{
    min-width: 0 !important;
    max-width: 100% !important;
  }
}


/* =============================
   FIX: Width jump when opening Profile (nested scrollbars / gutter)
   ============================= */

/* Do NOT reserve both edges (causes big right gutter when scrollbar appears) */
#soApp{ scrollbar-gutter: stable; }

/* Mobile: avoid nested scroll container in #profileView that triggers width recalculation */
@media (max-width: 560px){
  #soApp #profileView{
    overflow: visible !important;
    height: auto !important;
    max-width: 100%;
  }
  #soApp #mapView{
    height: auto !important;
  }
  #soApp .rightView{
    height: auto !important;
    overflow: visible !important;
  }
}


/* =============================
   FIX: Clicking Visitenkarte causes horizontal overflow (nowrap text)
   ============================= */
@media (max-width: 560px){

  /* Allow long info/zodiac strings to wrap instead of forcing wider layout */
  #soApp .infoBlock, #soApp .zodiacItem, #soApp #zodiacLine, #soApp #profileView .profileTitle, #soApp #profileView .profileTitle b, #soApp #profileView .profileCard .v{
    white-space: normal !important;
    overflow-wrap: anywhere !important;
    word-break: break-word !important;
    min-width: 0 !important;
    max-width: 100% !important;
  }

  /* Badges: prevent them from pushing width; keep single line with ellipsis if needed */
  #soApp #profileView .badgeRow, #soApp #profileView .badges, #soApp #profileView .tagRow{
    min-width: 0 !important;
    max-width: 100% !important;
  }
  #soApp #profileView .specialOneBadge, #soApp #profileView .favBadge{
    max-width: 100% !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
  }

  /* As a final safety net: no element may exceed viewport width */
  #soApp #profileView *{
    max-width: 100%;
  }
}


/* =============================
   FIX: Opening Profile causes whole page to overflow (glows/shadows)
   Reason: .card overflow: visible makes box-shadows count into scrollWidth in Firefox.
   Solution: keep cards clipped, and handle tabs/lines inside.
   ============================= */
@media (max-width: 560px){

  /* Revert card overflow to avoid horizontal scroll from glows */
  #soApp .card, #soApp .panel, #soApp .profileCard, #soApp #profileView{
    overflow: hidden !important;
  }

  /* Keep notes tabs inside the card without needing overflow:visible */
  #soApp .notesTabs{
    padding-right: 14px !important;
  }

  /* Ensure inner content doesn't sit flush to the edge */
  #soApp .card .sectionTitle, #soApp .card .row, #soApp .card .notesTabs, #soApp .card .pillRow{
    max-width: 100%;
  }
}

   ============================== */

/* Card depth (slightly more premium) */

  border: 1px solid rgba(255,255,255,.10);
  box-shadow: var(--shadowSoft), 0 0 0 1px rgba(80,255,190,.10) inset;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
@media (hover:hover){
  #soApp .card:hover{
    transform: translateY(-1px);
    border-color: rgba(255,255,255,.16);
    box-shadow: var(--shadowLift), 0 0 0 1px rgba(80,255,190,.14) inset;

/* Micro animations for common interactive elements */
#soApp .btn, 
#soApp .btn2, 
#soApp .fChip,
#soApp .chip,
#soApp .pill,
#soApp .starBtn{
  transition: transform .14s ease, filter .14s ease, background .14s ease, border-color .14s ease, box-shadow .14s ease;
  will-change: transform;
}
@media (hover:hover){
  #soApp .btn:hover, 
  #soApp .btn2:hover, 
  #soApp .fChip:hover,
  #soApp .chip:hover,
  #soApp .pill:hover,
  #soApp .starBtn:hover{
    transform: translateY(-1px);
    filter: brightness(1.05);
  }
}
#soApp .btn:active, 
#soApp .btn2:active, 
#soApp .fChip:active,
#soApp .chip:active,
#soApp .pill:active,
#soApp .starBtn:active{
  transform: translateY(0px) scale(.99);
}

@media (prefers-reduced-motion: reduce){
  #soApp .btn, #soApp .btn2, #soApp .fChip, #soApp .chip, #soApp .pill, #soApp .starBtn,
  #soApp .card, #soApp .quickBtn, #soApp .qchip{
