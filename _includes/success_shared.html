<!-- ==========================
Shared: success page (Netlify thank-you)
========================== -->

<style>
  :root{
    --bg1:#020617; /* slate-950 */
    --bg2:#0f172a; /* slate-900 */
  }
  .success-bg{background: radial-gradient(1200px 800px at 50% 20%, var(--bg2) 0%, var(--bg1) 60%);}
  .glass{
    backdrop-filter: blur(14px) saturate(160%);
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(94,234,212,.25);
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 30px rgba(16,185,129,.12);
  }
  .snake{
    filter: drop-shadow(0 0 10px rgba(16,185,129,.55)) drop-shadow(0 0 24px rgba(6,182,212,.35));
    animation: floatY 4s ease-in-out infinite, glow 2.4s ease-in-out infinite;
    display:inline-block;
  }
  @keyframes floatY{ 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-8px) } }
  @keyframes glow{
    0%,100%{ filter: drop-shadow(0 0 6px rgba(16,185,129,.35)) drop-shadow(0 0 16px rgba(6,182,212,.25)); }
    50%{   filter: drop-shadow(0 0 18px rgba(16,185,129,.75)) drop-shadow(0 0 36px rgba(6,182,212,.55)); }
  }
  .neon-line{ position:absolute; inset:0; pointer-events:none; z-index:0; }
  .neon-line::before,
  .neon-line::after{
    content:""; position:absolute; left:10%; right:10%; height:2px;
    background: linear-gradient(90deg, transparent, rgba(16,185,129,.0), rgba(16,185,129,.85), rgba(6,182,212,.85), rgba(16,185,129,.85), rgba(16,185,129,.0), transparent);
    filter: drop-shadow(0 0 10px rgba(16,185,129,.7)) blur(.3px);
    animation: flicker 2.2s infinite steps(1,end);
  }
  .neon-line::before{ top:18%; animation-delay:.2s; opacity:.85 }
  .neon-line::after{ bottom:18%; animation-delay:1.1s; opacity:.7 }
  @keyframes flicker{
    0%, 7%, 100% { opacity: .9 }
    3% { opacity: .4 }
    5% { opacity: .75 }
    60% { opacity: .95 }
    62% { opacity: .5 }
    64% { opacity: .9 }
  }
  .btn-glow:hover{ box-shadow: 0 0 20px rgba(16,185,129,.45), 0 0 40px rgba(6,182,212,.25); }
  .dot{ animation: pop 1.4s ease-out infinite; }
  @keyframes pop{
    0%{ transform: translateY(0) scale(0.9); opacity:.0 }
    30%{ opacity:.9 }
    100%{ transform: translateY(-14px) scale(1); opacity:0 }
  }
  .title{ letter-spacing:.02em }
</style>

<!-- Seite -->
<section class="success-bg min-h-[70vh] relative flex items-center justify-center text-white overflow-hidden">
  <div class="neon-line" aria-hidden="true"></div>

  <main class="relative z-10 mx-4 w-full max-w-xl glass rounded-3xl p-8 sm:p-10 text-center">
    <div class="flex items-center justify-center gap-3">
      <div class="text-6xl sm:text-7xl snake" aria-hidden="true">🐍</div>
      <svg class="w-16 h-16 sm:w-20 sm:h-20 snake" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
        <rect x="8" y="16" width="48" height="32" rx="6" stroke="url(#g)" stroke-width="2" fill="rgba(255,255,255,.06)"/>
        <path d="M10 20l22 16L54 20" stroke="url(#g)" stroke-width="2" fill="none"/>
        <circle cx="48" cy="44" r="10" fill="rgba(16,185,129,.18)" stroke="url(#g)" stroke-width="2"/>
        <path d="M42.5 44l3.8 3.8 7.2-7.2" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="title mt-5 text-3xl md:text-4xl font-extrabold text-emerald-400 drop-shadow-[0_0_12px_rgba(16,185,129,.45)]">
      {{ page.headline }}
    </h1>
    <p class="mt-3 text-slate-300">{{ page.subline }}</p>

    <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
      <a href="{{ page.home_href | relative_url }}" class="btn-glow inline-flex items-center justify-center px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 font-semibold">
        {{ page.btn_home }}
      </a>
      <a href="{{ page.socials_href | relative_url }}" class="btn-glow inline-flex items-center justify-center px-6 py-3 rounded-xl bg-cyan-600 hover:bg-cyan-700 font-semibold">
        {{ page.btn_socials }}
      </a>
    </div>

    <p class="mt-6 text-xs text-slate-500" aria-live="polite">
      {{ page.redirect_text_before }}
      <span id="count" class="text-emerald-400 font-semibold drop-shadow-[0_0_6px_rgba(16,185,129,.8)] animate-pulse">10</span>
      {{ page.redirect_text_after }}
      <span class="text-emerald-400 font-semibold drop-shadow-[0_0_6px_rgba(16,185,129,.8)] animate-pulse">{{ page.redirect_target_label }}</span> …
    </p>

    <!-- Deko-Punkte -->
    <div class="absolute inset-0 -z-10 pointer-events-none" aria-hidden="true">
      <div class="dot absolute left-10 top-6 w-2 h-2 rounded-full bg-emerald-300/80"></div>
      <div class="dot absolute right-12 top-3 w-1.5 h-1.5 rounded-full bg-cyan-300/80" style="animation-delay:.2s"></div>
      <div class="dot absolute left-1/2 bottom-6 w-2 h-2 rounded-full bg-emerald-200/70" style="animation-delay:.4s"></div>
      <div class="dot absolute left-6 bottom-10 w-1.5 h-1.5 rounded-full bg-cyan-200/70" style="animation-delay:.6s"></div>
    </div>
  </main>

  <!-- leichte Körnung -->
  <svg class="pointer-events-none absolute inset-0 opacity-[.07]" width="100%" height="100%" aria-hidden="true">
    <filter id="n">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.3"/></feComponentTransfer>
    </filter>
    <rect width="100%" height="100%" filter="url(#n)"></rect>
  </svg>
</section>

<!-- Noscript-Hinweis (kein Meta-Refresh hier, aber Link) -->
<noscript>
  <p class="sr-only">
    {{ page.noscript_text }}
    <a href="{{ page.contact_href | relative_url }}">{{ page.redirect_target_label }}</a>
  </p>
</noscript>

<!-- Auto-Redirect + sichtbarer Countdown -->
<script>
  (function () {
    var secs = 10, el = document.getElementById('count');
    var target = "{{ page.contact_href | relative_url }}";
    var tick = setInterval(function(){
      secs--; if (el) el.textContent = secs;
      if (secs <= 0) {
        clearInterval(tick);
        window.location.href = target;
      }
    }, 1000);
  })();
</script>
