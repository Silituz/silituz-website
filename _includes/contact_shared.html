<!-- Hero -->
<section class="relative h-64">
  <img src="/assets/images/contact-head.svg" alt="{{ page.hero_img_alt | default: 'Contact' }}"
       class="absolute inset-0 w-full h-full object-cover" />

  <div class="absolute inset-0 flex items-center justify-center">
    <div class="max-w-xl bg-white/70 dark:bg-gray-900/60 backdrop-blur-sm 
                rounded-2xl p-4 sm:p-6 shadow-md text-center">
      <h1 class="text-3xl md:text-4xl font-extrabold text-emerald-500">{{ page.hero_title }}</h1>
      <p class="mt-2 text-base md:text-lg text-slate-700 dark:text-slate-300 opacity-90">
        {{ page.hero_sub }}
      </p>
    </div>
  </div>
</section>

<!-- Main -->
<main class="py-16">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <section class="mt-6 rounded-2xl">
      <h2 class="text-xl font-bold mb-4">{{ page.form_title }}</h2>

     <!-- Kontaktformular (Formspree aktiv) -->
<form
  action="https://formspree.io/f/mqaygong"
  method="POST"
  class="space-y-5">

  <!-- Weiterleitung nach Erfolg -->
  <input type="hidden" name="_next" value="https://silituz.de/danke/">
  <!-- Betreff deiner E-Mail -->
  <input type="hidden" name="_subject" value="Kontakt über silituz.de">
  <!-- Honeypot gegen Bots -->
  <input type="text" name="_honeypot" class="hidden" tabindex="-1" autocomplete="off">

  <div class="grid sm:grid-cols-2 gap-4">
    <div>
      <label for="name" class="block text-sm mb-1">{{ page.label_name }}</label>
      <input id="name" name="name" type="text" required autocomplete="name"
             class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-emerald-500 focus:ring-emerald-500" />
    </div>
    <div>
      <label for="email" class="block text-sm mb-1">{{ page.label_email }}</label>
      <input id="email" name="email" type="email" required inputmode="email" autocomplete="email"
             class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-emerald-500 focus:ring-emerald-500" />
    </div>
  </div>

  <div>
    <label for="subject" class="block text-sm mb-1">{{ page.label_subject }}</label>
    <input id="subject" name="subject" type="text" required
           class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-emerald-500 focus:ring-emerald-500" />
  </div>

  <div>
    <label for="message" class="block text-sm mb-1">{{ page.label_message }}</label>
    <textarea id="message" name="message" rows="6" required
              class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-emerald-500 focus:ring-emerald-500"></textarea>
  </div>

  <div class="flex items-start gap-3">
    <input id="privacy" name="privacy" type="checkbox" required
           class="mt-1 h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-600" />
    <label for="privacy" class="text-sm text-slate-700 dark:text-slate-300">
      {{ page.label_privacy | markdownify }}
    </label>
  </div>

  <div class="pt-2">
    <button type="submit"
            class="inline-flex items-center gap-2 rounded-lg bg-emerald-500 px-5 py-2.5 text-white font-semibold hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      {{ page.btn_send }}
    </button>
  </div>
</form>


      <!-- Mailto fallback -->
      <div class="mt-6 text-sm text-slate-700 dark:text-slate-300">
        <button id="mailtoBtn" class="underline decoration-emerald-500 hover:text-emerald-700">{{ page.btn_mailto }}</button>
      </div>
    </section>
  </div>
</main>

<script>
  (function(){
    const btn = document.getElementById('mailtoBtn');
    btn && btn.addEventListener('click', ()=> {
      window.location.href = 'mailto:info@silituz.de?subject=Contact%20via%20silituz.de';
    });
  })();
</script>
