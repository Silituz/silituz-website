<div class="lil-sili" data-lil-sili>
  <section
    class="lil-sili__panel"
    id="lilSiliPanel"
    role="dialog"
    aria-modal="false"
    aria-labelledby="lilSiliTitle"
    hidden>
    <header class="lil-sili__header">
      <div>
        <span class="lil-sili__eyebrow">SILITUZ GUIDE</span>
        <h2 id="lilSiliTitle">Lil Sili</h2>
      </div>
      <button class="lil-sili__close" type="button" data-lil-sili-close aria-label="Helfer schließen">×</button>
    </header>

    <div class="lil-sili__body">
      <p class="lil-sili__intro" data-helper-copy></p>
      <div class="lil-sili__languages" role="group" aria-label="Choose your language">
        <button type="button" data-helper-lang="de" aria-pressed="false">DE</button>
        <button type="button" data-helper-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-helper-lang="es" aria-pressed="false">ES</button>
      </div>

      <div data-helper-content>
        <nav class="lil-sili__routes" data-helper-routes aria-label="Schnellziele"></nav>

        <form class="lil-sili__search" data-helper-form>
          <label class="sr-only" for="lilSiliQuery" data-helper-label>What are you looking for?</label>
          <input id="lilSiliQuery" type="search" autocomplete="off" data-helper-input>
          <button type="submit" data-helper-submit aria-label="Find destination">→</button>
        </form>
        <p class="lil-sili__answer" data-helper-answer aria-live="polite"></p>
      </div>
    </div>
  </section>

  <button
    class="lil-sili__trigger"
    type="button"
    data-lil-sili-trigger
    aria-controls="lilSiliPanel"
    aria-expanded="false">
    <span class="lil-sili__status" aria-hidden="true"></span>
    <img
      src="{{ '/assets/images/lil-sili-cute-v2.png' | relative_url }}"
      alt=""
      width="512"
      height="512">
    <span class="lil-sili__hint" data-helper-hint>Ready to help</span>
    <span class="sr-only">Open Lil Sili</span>
  </button>
</div>

<script src="{{ '/assets/js/lil-silituz-helper.js' | relative_url }}" defer></script>
