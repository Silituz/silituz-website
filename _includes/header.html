<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SILITUZ – Header mit Menü-Video</title>
  <meta name="description" content="Demo-Seite: Header mit Video im Menü-Button und Slide-out-Menü." />

  <!-- Tailwind über CDN (falls du schon Tailwind bundlest, kannst du das rausnehmen) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-slate-900">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-slate-200 relative">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between relative z-10">
        <!-- Marke links -->
        <a href="{{ '/' | relative_url }}" class="flex items-center gap-3 font-black tracking-wide text-xl">
          <img src="{{ '/assets/images/logo.svg' | relative_url }}" alt="SILITUZ Logo" class="h-10 w-10" />
          <span class="flex flex-col leading-tight">
            <span>SILITUZ</span>
            <span class="text-xs font-normal text-slate-500">KI • Musik • Anime</span>
          </span>
        </a>

        <!-- Menü-Button rechts mit Video -->
        <button id="snakeBtn"
                class="inline-flex items-center gap-2 justify-center text-slate-900 hover:text-emerald-600 text-base md:text-lg font-semibold"
                aria-controls="sideMenu" aria-expanded="false">
          <!-- Animiertes Logo mit echtem transparenten Hintergrund -->
          <img id="menuVideo"
               src="{{ '/assets/images/menu-logo-transparent.svg?v=1' | relative_url }}"
               class="menu-logo h-8 w-8 object-contain"
               width="58"
               height="58"
               alt=""
               aria-hidden="true">
          <!-- Schriftzug -->
          <span>Menü</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Overlay -->
  <div id="sideOverlay" class="fixed inset-0 bg-black/40 opacity-0 pointer-events-none transition-opacity z-40"></div>

  <!-- Slide-out-Menü -->
  <aside id="sideMenu"
         class="fixed right-0 top-0 h-full w-72 max-w-[80%] bg-white shadow-2xl translate-x-full transition-transform z-50"
         aria-hidden="true" aria-label="Hauptmenü">

    <!-- Kopf -->
    <div class="h-16 px-4 flex items-center justify-between border-b">
      <div class="font-extrabold">SILITUZ</div>
      <button id="sideClose" class="p-2 rounded-lg hover:bg-slate-100" aria-label="Menü schließen">✕</button>
    </div>

    <!-- Sprache / Language -->
    <div class="px-4 py-3 border-b flex items-center justify-between">
      <span class="text-xs uppercase tracking-wider opacity-60">Sprache / Language</span>
      {% include lang-switcher.html %}
    </div>

    <!-- Menüeinträge -->
    {% include menu.html %}
  </aside>

  <!-- Script -->
  <script>
    // --- Menü-Steuerung ---
    const sideMenu    = document.getElementById('sideMenu');
    const sideBtn     = document.getElementById('snakeBtn');
    const sideClose   = document.getElementById('sideClose');
    const sideOverlay = document.getElementById('sideOverlay');

    function openMenu() {
      if (!sideMenu) return;
      sideMenu.classList.remove("translate-x-full");
      sideOverlay?.classList.remove("opacity-0","pointer-events-none");
      sideBtn?.setAttribute("aria-expanded","true");
    }
    function closeMenu() {
      if (!sideMenu) return;
      sideMenu.classList.add("translate-x-full");
      sideOverlay?.classList.add("opacity-0","pointer-events-none");
      sideBtn?.setAttribute("aria-expanded","false");
    }

    sideBtn?.addEventListener("click", openMenu);
    sideClose?.addEventListener("click", closeMenu);
    sideOverlay?.addEventListener("click", closeMenu);

  </script>
</body>
</html>
