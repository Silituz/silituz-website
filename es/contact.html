---
layout: default
title: "Contacto"
lang: es-MX
permalink: /es/contact/
---

<section class="relative h-64">
  <img src="/assets/images/contact-head.svg" alt="Contacto" class="absolute inset-0 w-full h-full object-cover" />
  <div class="absolute inset-0 flex items-center justify-center">
    <div class="max-w-xl bg-white/70 dark:bg-gray-900/60 backdrop-blur-sm rounded-2xl p-4 sm:p-6 shadow-md text-center">
      <h1 class="text-3xl md:text-4xl font-extrabold text-emerald-500">Contacto</h1>
      <p class="mt-2 text-base md:text-lg text-slate-700 dark:text-slate-300 opacity-90">Para consultas generales, usa el formulario o envía un email.</p>
    </div>
  </div>
</section>

<main class="py-16">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <section class="rounded-2xl bg-white/80 dark:bg-slate-800/80 p-6 shadow-md">
      <h2 class="text-xl font-bold mb-4">Enviar mensaje</h2>
      <form id="contactFormEs" action="https://formspree.io/f/mqaygong" method="POST" class="space-y-5">
        <input type="hidden" name="_next" value="/es/success/">
        <input type="hidden" name="_subject" value="Contacto desde silituz.de">
        <input type="text" name="_honeypot" class="hidden" tabindex="-1" autocomplete="off">

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label for="name" class="block text-sm mb-1">Nombre</label>
            <input id="name" name="name" type="text" required autocomplete="name" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-emerald-500 focus:ring-emerald-500" />
          </div>
          <div>
            <label for="email" class="block text-sm mb-1">Email</label>
            <input id="email" name="email" type="email" required inputmode="email" autocomplete="email" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-emerald-500 focus:ring-emerald-500" />
          </div>
        </div>

        <div>
          <label for="subject" class="block text-sm mb-1">Asunto</label>
          <input id="subject" name="subject" type="text" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-emerald-500 focus:ring-emerald-500" />
        </div>

        <div>
          <label for="message" class="block text-sm mb-1">Mensaje</label>
          <textarea id="message" name="message" rows="6" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-emerald-500 focus:ring-emerald-500"></textarea>
        </div>

        <div class="flex items-start gap-3">
          <input id="privacy" name="privacy" type="checkbox" required class="mt-1 h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-600" />
          <label for="privacy" class="text-sm text-slate-700 dark:text-slate-300">He leído el <a class="underline decoration-emerald-500" href="/datenschutz/">aviso de privacidad</a>.</label>
        </div>

        <button type="submit" class="inline-flex items-center gap-2 rounded-lg bg-emerald-500 px-5 py-2.5 text-white font-semibold hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-500">Enviar</button>
      </form>

      <script>
      (function(){
        var form = document.getElementById('contactFormEs');
        if(!form) return;
        form.addEventListener('submit', async function(e){
          e.preventDefault();
          try{
            var resp = await fetch(form.action, { method:'POST', body:new FormData(form), headers:{ 'Accept':'application/json' } });
            if(resp.ok) window.location.href = '/es/success/';
            else alert('No se pudo enviar. Inténtalo de nuevo más tarde.');
          }catch(err){
            alert('Error de red al enviar. Inténtalo de nuevo más tarde.');
          }
        });
      })();
      </script>

      <div class="mt-6 text-sm text-slate-700 dark:text-slate-300">
        <a class="underline decoration-emerald-500 hover:text-emerald-700" href="mailto:kontakt@silituz.de">Enviar por email</a>
      </div>
    </section>
  </div>
</main>
