<!-- Hero -->
<section class="relative h-64">
  <!-- Hintergrundbild -->
  <img src="/assets/images/contact-head.svg" alt="Contact"
       class="absolute inset-0 w-full h-full object-cover" />

  <!-- Overlay-Karte mittig -->
  <div class="absolute inset-0 flex items-center justify-center">
    <div class="max-w-xl bg-white/70 dark:bg-gray-900/60 backdrop-blur-sm 
                rounded-2xl p-4 sm:p-6 shadow-md text-center">
      <h1 class="text-3xl md:text-4xl font-extrabold text-emerald-500">Kontakt</h1>
      <p class="mt-2 text-base md:text-lg text-slate-700 dark:text-slate-300 opacity-90">
    Für allgemeine Anfragen nutze bitte das Formular oder sende eine E-Mail an
      </p>
    </div>
  </div>
</section>

  <!-- Hauptbereich -->
  <main class="py-16">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
      <!-- Zentrierter Titel + Intro -->
      <section class="text-center">
         </p>
      </section>

      <!-- Formular-Karte -->
      <section class="mt-6 rounded-2xl">
        <h2 class="text-xl font-bold mb-4">Nachricht senden</h2>

        <form
          name="contact"
          method="POST"
          data-netlify="true"
          data-netlify-honeypot="bot-field"
          class="space-y-5">
          <input type="hidden" name="form-name" value="contact" />
          <p class="hidden"><label>Don’t fill this out if you're human: <input name="bot-field" /></label></p>

          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label for="name" class="block text-sm mb-1">Name</label>
              <input id="name" name="name" type="text" required autocomplete="name"
                     class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-emerald-500 focus:ring-emerald-500" />
            </div>
            <div>
              <label for="email" class="block text-sm mb-1">E-Mail</label>
              <input id="email" name="email" type="email" required inputmode="email" autocomplete="email"
                     aria-describedby="emailError"
                     class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-emerald-500 focus:ring-emerald-500" />
              <p id="emailError" class="mt-1 text-sm text-rose-600 hidden"></p>
            </div>
          </div>

          <div>
            <label for="subject" class="block text-sm mb-1">Betreff</label>
            <input id="subject" name="subject" type="text" required
                   class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-emerald-500 focus:ring-emerald-500" />
          </div>

          <div>
            <label for="message" class="block text-sm mb-1">Nachricht</label>
            <textarea id="message" name="message" rows="6" required
                      class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-emerald-500 focus:ring-emerald-500"></textarea>
          </div>

          <div class="flex items-start gap-3">
            <input id="privacy" name="privacy" type="checkbox" required class="mt-1 h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-600" />
            <label for="privacy" class="text-sm text-slate-300">
              Ich habe die <a href="datenschutz.html" class="underline decoration-emerald-500 hover:text-emerald-600">Datenschutzhinweise</a> zur Kenntnis genommen.
            </label>
          </div>

          <!-- 🐍 Serpent Shield 🛡️ -->
          <h3 class="text-base font-semibold flex items-center gap-2 justify-center mt-2">🐍 Serpent Shield 🛡️</h3>
          <div id="lemin-cropped-captcha" class="mt-1"></div>
          <script src="https://api.leminnow.com/captcha/v1/cropped/CROPPED_cab783a_6bcfeac197564b0f81b752767f94377a/js"></script>
          <p id="captchaError" class="mt-2 text-sm text-rose-600 hidden"></p>

          <div class="pt-2">
            <button type="submit" id="submitBtn"
                    class="inline-flex items-center gap-2 rounded-lg bg-emerald-500 px-5 py-2.5 text-white font-semibold hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
              Abschicken
            </button>
            <p class="text-xs text-slate-300 mt-2">
             </p>
          </div>
        </form>

        <!-- Mailto-Fallback -->
        <div class="mt-6 text-sm text-slate-300">
          <button id="mailtoBtn" class="underline decoration-emerald-500 hover:text-emerald-700">Alternativ per E-Mail senden</button>
        </div>
      </section>
    </div>
  </main>

  
  <script>
    // Mailto-Fallback
    (function(){
      const btn = document.getElementById('mailtoBtn');
      btn && btn.addEventListener('click', ()=> {
        window.location.href = 'mailto:info@silituz.de?subject=Kontakt%20über%20silituz.de';
      });
    })();

    // E-Mail-Validierung + Lemin Verify (wie gehabt)
    (function(){
      const form = document.forms['contact'];
      const email = document.getElementById('email');
      const emailErr = document.getElementById('emailError');
      const submitBtn = document.getElementById('submitBtn');
      const capErr = document.getElementById('captchaError');

      function setLoading(b){ if(!submitBtn) return; submitBtn.disabled = b; submitBtn.textContent = b ? 'Prüfe…' : 'Abschicken'; }
      function showEmailError(msg){ email.setAttribute('aria-invalid','true'); emailErr.textContent = msg; emailErr.classList.remove('hidden'); }
      function clearEmailError(){ email.removeAttribute('aria-invalid'); emailErr.textContent=''; emailErr.classList.add('hidden'); }
      function basicEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i.test(v); }
      email.addEventListener('input', ()=>{ clearEmailError(); email.setCustomValidity(''); });

      function showCaptchaError(msg){ if(!capErr) return alert(msg); capErr.textContent = msg; capErr.classList.remove('hidden'); }
      function clearCaptchaError(){ if(!capErr) return; capErr.textContent=''; capErr.classList.add('hidden'); }

      async function verifyLemin(){
        clearCaptchaError();
        const api = window.leminCroppedCaptcha?.getCaptcha?.();
        const v = api?.getCaptchaValue?.();
        if(!v || !v.answer || !v.challenge_id){ showCaptchaError('Bitte löse das Puzzle, um fortzufahren.'); return false; }
        try{
          setLoading(true);
          const res = await fetch('/.netlify/functions/lemin-verify', {
            method: 'POST',
            headers: { 'Content-Type':'application/json' },
            body: JSON.stringify({ challenge_id: v.challenge_id, answer: v.answer })
          });
          const data = await res.json();
          if(!data.ok){ showCaptchaError('Captcha ungültig oder abgelaufen. Bitte erneut versuchen.'); setLoading(false); return false; }
          // Optional anhängen
          form.insertAdjacentHTML('beforeend', `<input type="hidden" name="lemin_challenge_id" value="${v.challenge_id}">`);
          form.insertAdjacentHTML('beforeend', `<input type="hidden" name="lemin_answer" value="${v.answer}">`);
          return true;
        }catch(err){
          showCaptchaError('Captcha-Verifizierung fehlgeschlagen. Bitte später erneut versuchen.');
          setLoading(false);
          return false;
        }
      }

      form.addEventListener('submit', async (e)=>{
        const val = email.value.trim();
        if(!email.checkValidity() || !basicEmail(val)){
          e.preventDefault();
          showEmailError('Bitte gib eine gültige E-Mail-Adresse ein.');
          email.setCustomValidity('Ungültige E-Mail');
          return;
        }
        email.setCustomValidity('');

        if(form.dataset.leminVerified === '1') return;
        e.preventDefault();
        const ok = await verifyLemin();
        if(ok){
          clearCaptchaError();
          form.dataset.leminVerified = '1';
          setLoading(false);
          form.submit();
        }
      }, true);
    })();
  </script>
</body>
</html>
